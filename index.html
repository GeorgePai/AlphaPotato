'use strict';
/* =========================================================
   Leaf of Legends（原名 LEAF WAR）— core: 命名空間、調色盤、工具、像素精靈、字型
   ========================================================= */
const G = window.G = {}; G.FONT_DATA = window.G_FONT; G.FONT_DATA = window.G_FONT;

// 10 階灰：0 最黑 → 9 最白（全遊戲只用這組顏色）
G.PAL = ['#0a0a0a', '#1a1a1a', '#2b2b2b', '#3f3f3f', '#575757', '#737373', '#959595', '#bcbcbc', '#e0e0e0', '#ffffff',
  // 點綴色（10 紅 HP / 11 綠 MP / 12 藍 BOSS / 13 黃 指示/升級 / 14 橘 爆擊 / 15 深紅 / 16 深綠）
  '#ec4a3f', '#43c466', '#4a8ff5', '#f7d23c', '#f68a2c', '#7c211b', '#1f6a35', '#a35cf0',
  // 介面專用（數值條）：18 青 攻速 / 19 粉 爆擊 / 20 黃綠 移速
  '#3fc6d6', '#ec64a6', '#a8d94a',
  // 21 米色：經驗值
  '#d9c08c'];
G.PAL_RGB = G.PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

// 世界座標：原著 1 格 = 32 單位；美術 1px = 2 單位；Y 軸壓縮 0.75 做出斜俯視
G.TILE = 32;
G.AX = 0.5;          // world → art x
G.AY = 0.375;        // world → art y（0.5 * 0.75）
G.AZ = 0.5;          // 高度 → art

// ---------- 工具 ----------

// 更大的地圖（104×78，點對稱）：每路 3 層外塔＋基地主塔；野怪住在森林裡的「凹槽營地」，野生首領在河道旁的坑
G.MAPS.lanes5 = (() => {
  const W = 104, H = 78, mir = p => [+(W - p[0]).toFixed(2), +(H - p[1]).toFixed(2)], mp = a => a.map(mir);
  const k = 1.3, sc = a => a.map(p => [+(p[0] * k).toFixed(2), +(p[1] * k).toFixed(2)]);
  const top = sc([[8.75, 51.25], [8.12, 41.25], [8.12, 17.5], [11.25, 10], [20, 8.12], [60, 8.12], [71.25, 8.75]]);
  const mid = sc([[8.75, 51.25], [17.5, 44.4], [30, 36.9], [40, 30], [50, 23.1], [62.5, 15.6], [71.25, 8.75]]);
  const bot = mp(top).reverse();
  const lanes = [{ r: 2.2, pts: top }, { r: 2.4, pts: mid }, { r: 2.2, pts: bot }];
  // 我方野區小徑（敵方點對稱）
  const jp = [
    [[10.6, 44], [22, 44], [30, 53]],                 // 西野區：上路 → 中路
    [[22, 44], [27, 36.5], [32.5, 28.4]],             // 西野區 → 河道
    [[44.5, 44.4], [48, 57], [62, 57], [70, 48.6]],   // 南野區：中路 → 下路側 → 河道
    [[55, 57], [55, 67.4]]                            // 南野區 → 下路
  ];
  const paths = []; for (const a of jp) { paths.push({ r: 1.5, pts: a }); paths.push({ r: 1.5, pts: mp(a) }); }
  // 凹槽營地：營地中心 + 一條窄入口（接到小徑或河道）
  const pockets = [
    { k: 'red', c: [18, 51.5], r: 3.1, e: [18, 44] },
    { k: 'exp', c: [34, 40.5], r: 3.0, e: [27, 36.5] },
    { k: 'blue', c: [56, 49.5], r: 3.1, e: [56, 57] },
    { k: 'frost', c: [20.6, 30.6], r: 3.9, e: [24.2, 24.4], w: 2.0 }   // 河道旁的首領坑（入口較寬）
  ];
  const wild = [], necks = [], clears = [];
  for (const q of pockets) {
    const isB = q.k === 'frost';
    [[q.c, q.e, q.k], [mir(q.c), mir(q.e), isB ? 'blaze' : q.k]].forEach(([c, e, key]) => { wild.push([key, c]); necks.push({ r: q.w || 1.25, pts: [e, c] }); clears.push([...c, q.r]); });
  }
  // 塔：沿每條路從我方聖所量距離，在半路的 30% / 58% / 86% 放內／中／外塔；主塔在聖所前方
  const along = (pts, d) => { for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= L) return [+(a[0] + (b[0] - a[0]) * d / L).toFixed(2), +(a[1] + (b[1] - a[1]) * d / L).toFixed(2)]; d -= L; } return pts[pts.length - 1]; };
  const len = pts => pts.slice(1).reduce((s2, p, i) => s2 + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
  const pt = [];
  [top, mid, bot].forEach((pts, lane) => { const half = len(pts) / 2; [[0.86, 0], [0.58, 1], [0.3, 2]].forEach(([f, tier]) => pt.push([along(pts, half * f), lane, tier])); });
  const hp = top[0], cdir = [W / 2 - hp[0], H / 2 - hp[1]], cl = Math.hypot(...cdir);
  pt.push([[+(hp[0] + cdir[0] / cl * 6.5).toFixed(2), +(hp[1] + cdir[1] / cl * 6.5).toFixed(2)], 1, 9]);      // tier 9 = 主塔
  const et = pt.map(([p, lane, tier]) => [mir(p), tier === 9 ? 1 : 2 - lane, tier]);
  return {
    w: W, h: H, seed: 23,
    holy: { player: hp, enemy: mir(hp) },
    towers3: { player: pt, enemy: et },
    bossHome: mir([16, 60]),
    lanes: lanes.concat(paths, necks),
    laneCount: 3,
    river: { r: 2.8, pts: [[0, 11.7], [18.2, 20.8], [35.1, 29.9], [52, 39], [68.9, 48.1], [85.8, 57.2], [104, 66.3]] },
    wild,
    clear: [[...hp, 9.5], [...mir(hp), 9.5], [52, 39, 6], ...clears]
  };
})();

// 程序化精靈的畫筆：把陰影球體畫進網格
G.paintBlob = function (grid, w, h, circles, levels, opt = {}) {
  const L = [-0.55, -0.7, 0.55], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let best = -9, bn = null;
    for (const c of circles) {
      const dx = (x + 0.5 - c[0]) / c[2], dy = (y + 0.5 - c[1]) / (c[3] || c[2]);
      const r2 = dx * dx + dy * dy; if (r2 > 1) continue;
      const hz = Math.sqrt(1 - r2) + (c[4] || 0);
      if (hz > best) { best = hz; bn = [dx, dy, Math.sqrt(1 - r2)]; }
    }
    if (!bn) continue;
    let b = bn[0] * L[0] + bn[1] * L[1] + bn[2] * L[2];
    b = G.clamp((b + 0.35) / 1.35, 0, 1);
    if (opt.noise) b += (G.hash(x * 7 + (opt.seed || 0), y * 13) - 0.5) * opt.noise;
    const t = G.clamp(b * (levels.length - 1) + (G.bayer(x, y) - 0.5), 0, levels.length - 1);
    grid[y * w + x] = levels[Math.round(t)];
  }
};
G.paintRect = (grid, w, x0, y0, x1, y1, fn) => { for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) grid[y * w + x] = fn(x, y); };

  // 秘術光球（技能）
  { const w = 9, h = 9, g = new Int8Array(w * h).fill(-1); G.paintBlob(g, w, h, [[4.5, 4.5, 4.3]], [6, 7, 8, 9, 9]); S.mistic = [G.spriteFromGrid(g, w, h, { outline: 3 })]; }

  });
  // 石頭
  S.rocks = [[12, 8, [[6, 4.5, 5.5, 3.6]]], [8, 6, [[4, 3.4, 3.6, 2.6]]], [14, 9, [[5, 5, 4.5, 3.6], [9.5, 5.2, 4, 3.2]]]].map(([w, h, c], i) => {
    const g = new Int8Array(w * h).fill(-1); G.paintBlob(g, w, h, c, [2, 3, 4, 5, 6, 7], { noise: 0.3, seed: i * 9 }); return G.spriteFromGrid(g, w, h, { outline: 1 });
  });

  // 我方聖所：白色聖樹 + 石台
  {
    const w = 44, h = 50, g = new Int8Array(w * h).fill(-1);
    G.paintBlob(g, w, h, [[22, 43, 20, 6]], [3, 4, 5, 6, 7]);                 // 石台
    G.paintBlob(g, w, h, [[22, 41, 15, 4.2, 0.2]], [5, 6, 7, 8]);
    G.paintRect(g, w, 19, 22, 25, 42, (x, y) => (x === 19 ? 6 : x === 24 ? 5 : ((y + x) % 5 === 0 ? 6 : 7)));  // 樹幹
    G.paintRect(g, w, 16, 37, 19, 41, () => 6); G.paintRect(g, w, 25, 37, 28, 41, () => 5);
    G.paintBlob(g, w, h, [[22, 12, 12, 10], [12, 18, 8, 7], [32, 18, 8, 7], [22, 20, 10, 7], [16, 8, 6], [28, 8, 6]], [5, 6, 7, 8, 9, 9], { noise: 0.35, seed: 5 });
    S.pholy = [G.spriteFromGrid(g, w, h, { outline: 0 })];
  }
  // 敵方聖所：黑色巨石祭壇 + 骷髏
  {
    const w = 40, h = 46, g = new Int8Array(w * h).fill(-1);
    G.paintBlob(g, w, h, [[20, 39, 19, 6.5]], [1, 2, 3, 4]);
    for (let y = 2; y < 38; y++) {                       // 菱形尖碑
      const half = y < 18 ? (y - 2) * 0.62 + 2 : 12 - (y - 18) * 0.25;
      for (let x = Math.round(20 - half); x < Math.round(20 + half); x++) {
        const edge = x < 20 - half + 2 ? 3 : x > 20 + half - 3 ? 0 : 1;
        g[y * w + x] = (x < 20 ? (edge === 3 ? 3 : 2) : (edge === 0 ? 0 : 1));
      }
    }
    // 骷髏面
    const sk = ['.666666.', '66666666', '60066006', '60066006', '66666666', '.666666.', '.6.66.6.'];
    sk.forEach((r, yy) => { for (let xx = 0; xx < r.length; xx++) if (r[xx] !== '.') g[(18 + yy) * w + 16 + xx] = +r[xx]; });
    // 尖刺
    for (const [sx, sy] of [[7, 30], [32, 30], [11, 33], [28, 33]]) for (let i = 0; i < 6; i++) { g[(sy - i) * w + sx] = i < 2 ? 2 : 3; if (i < 3) g[(sy - i) * w + sx + 1] = 1; }
    S.eholy = [G.spriteFromGrid(g, w, h, { outline: 4 })];
  }
};

'use strict';
/* =========================================================
   全角色像素圖（程序繪製）
   每個角色一個繪製函式 (P, f)：P 為畫筆，f 為影格 0/1（走路/拍翅）
   全部面向右；敵方深色、我方淺色
   ========================================================= */
G.Painter = (w, h) => {
  const g = new Int8Array(w * h).fill(-1);
  const P = {
    w, h, g,
    px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = c; },
    e(cx, cy, rx, ry, c) { for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) P.px(x, y, c); } },
    r(x, y, rw, rh, c) { for (let yy = 0; yy < rh; yy++) for (let xx = 0; xx < rw; xx++) P.px(x + xx, y + yy, c); },
    l(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1); for (let i = 0; i <= n; i++) P.px(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, c); },
    // 頂部打光 / 底部陰影（只作用於指定色）
    shade(base, hi, lo) {
      const s = g.slice();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x; if (s[i] !== base) continue;
        if (hi != null && (y === 0 || s[i - w] < 0)) g[i] = hi;
        else if (lo != null && (y === h - 1 || s[i + w] < 0)) g[i] = lo;
      }
    }
  };
  return P;
};
// 四足動物
G.quad = (P, f, o) => {
  const c = o.c ?? 1, lc = o.lc ?? 0;
  (o.legs || []).forEach((lx, i) => { const d = f ? (i % 2 ? 1 : -1) : 0; P.r(lx + d, o.ly, o.lw || 2, o.ll || 3, i < 2 && o.legs.length > 2 ? lc : c); });
  if (o.tail) P.l(o.bx - o.brx + 1, o.by - 1, o.bx - o.brx - o.tail[0], o.by - 1 - o.tail[1] + (f ? 1 : 0), c);
  P.e(o.bx, o.by, o.brx, o.bry, c);

G.buildBestiary = function () {
  for (const k in G.BESTIARY) {
    const d = G.BESTIARY[k], frames = [];
    for (let f = 0; f < (d.tower ? 1 : 2); f++) {
      const P = G.Painter(d.w, d.h); d.draw(P, f);
      if (d.ol == null && !d.tower) P.shade(1, 2, null);
      frames.push(G.spriteFromGrid(P.g, d.w, d.h, { outline: d.ol != null ? d.ol : (d.tower ? 4 : 0), bright: d.ol === 0 && !d.tower }));
    }
    G.SPR[k] = frames;
  }
  const towerSpr = { player_tower: 'ptower', enemy_tower: 'etower', enemy_tower2: 'etower2', enemy_tower3: 'etower3', enemy_tower4: 'etower4', mushroom_tower: 'mtower' };
  for (const name in towerSpr) if (!G.VIS[name]) G.VIS[name] = { spr: towerSpr[name], r: name === 'enemy_tower4' ? 22 : 16, shadow: name === 'enemy_tower4' ? 19 : 13 };
  for (const name in G.ORIG.units) {
    if (G.VIS[name]) continue;
    const s = G.SPR[name]; if (!s) continue;
    const d = G.BESTIARY[name] || {}, w = s[0].w;
    G.VIS[name] = { spr: name, r: G.clamp(Math.round(w * 0.62), 7, 17), shadow: G.clamp(Math.round(w * 0.55), 6, 15), fly: d.fly ? 24 : 0 };
  }
};

  let muted = false;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

    comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.55;
    bgmBus = ac.createGain(); bgmBus.gain.value = 0.32;
    sfxBus.connect(comp); bgmBus.connect(comp); comp.connect(master); master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(master);   // 背景音樂（mp3）不經過壓縮器，音量固定
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 25% 方波（8-bit 主旋律）
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * 0.25);
    pulse25 = ac.createPeriodicWave(re, im);

  }

    const o = ac.createOscillator(), g = ac.createGain();

    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (opt.atk || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;

    node.connect(g); g.connect(bus);

    voices++; o.onended = () => voices--;

G.buildMap = function (def) {
  const T = G.TILE, M = { def, w: def.w, h: def.h, ww: def.w * T, wh: def.h * T };

      else v = (n + (b - 0.5) * 0.3 > 0.55) ? 5 : 4;                     // 草地
      if (M.field(tx, ty - 0.35) >= 0) v = b < 0.65 ? 2 : 3;             // 崖下陰影
      else if (M.field(tx, ty - 0.6) >= 0) v = Math.max(3, v - 1 - (b < 0.4 ? 1 : 0));
      if (M.hasRiver) {
        const rv = M.river(tx, ty);
        if (rv < 0) {                                                    // 水面：深色 + 橫向波紋；路經過處為淺灘
          const shallow = p < 0.75, wav = G.fbm(tx * 2.2, ty * 7) + (b - 0.5) * 0.2;
          if (shallow) v = wav > 0.58 ? 6 : (b < 0.5 ? 4 : 5);
          else v = rv > -0.35 ? 3 : (wav > 0.62 ? 4 : wav > 0.56 && b < 0.5 ? 3 : 2);
          if (rv > -0.18) v = shallow ? 7 : 6;                            // 岸邊浪花
        } else if (rv < 0.35) v = b < 0.5 ? 3 : Math.min(v, 4);          // 濕潤河岸
      }
    }
    idx[ay * GW + ax] = v;
  }
  // 草叢、花、碎石
  const rng = G.mulberry(M.def.seed * 31);
  const put = (ax, ay, v) => { if (ax >= 0 && ay >= 0 && ax < GW && ay < GH) idx[ay * GW + ax] = v; };
  for (let i = 0; i < GW * GH / 55; i++) {
    const ax = (rng() * GW) | 0, ay = (rng() * GH) | 0;
    const tx = (ax - PAD) / G.AX / T, ty = (ay - PAD) / G.AY / T;
    if (M.field(tx, ty) > -0.15) continue;
    const p = M.pathiness(tx, ty), r = rng();
    if (p > 0.75) {
      if (r < 0.7) { put(ax, ay, 6); put(ax - 1, ay - 1, 6); put(ax + 1, ay - 1, 6); put(ax, ay + 1, 3); }   // 草
      else if (r < 0.8) { put(ax, ay, 9); put(ax, ay + 1, 3); }                                          // 小白花
      else { put(ax, ay, 3); put(ax + 1, ay, 3); put(ax, ay - 1, 7); }                                     // 小石
    } else if (r < 0.25) { put(ax, ay, 7); put(ax + 1, ay + 1, 4); }
  }
  for (let i = 0; i < GW * GH; i++) { const rgb = G.PAL_RGB[idx[i]]; d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  // 樹影烘進地面
  G.setPatOffset(0, 0);
  for (const p of M.props) if (p.tree) G.pxDisc(x, p.x * G.AX + PAD, p.y * G.AY + PAD, p.s.w * 0.4, 2.5, 0, 0.6);
  // 小地圖
  const MR = 3, mm = G.canvas(M.w * MR, M.h * MR), mx = mm.getContext('2d'), mid = mx.createImageData(mm.width, mm.height);
  for (let y = 0; y < M.h * MR; y++) for (let xx = 0; xx < M.w * MR; xx++) {
    const fx = (xx + 0.5) / MR, fy = (y + 0.5) / MR, f = M.field(fx, fy);
    const wet = M.hasRiver && f < 0 && M.river(fx, fy) < 0;
    const rgb = G.PAL_RGB[wet ? 2 : f < 0 ? (M.pathiness(fx, fy) < 0.6 ? 5 : 4) : 1], i = (y * mm.width + xx) * 4;
    mid.data[i] = rgb[0]; mid.data[i + 1] = rgb[1]; mid.data[i + 2] = rgb[2]; mid.data[i + 3] = 255;
  }
  mx.putImageData(mid, 0, 0);
  return { c, w: GW, h: GH, pad: PAD, mini: mm };
};

'use strict';
/* =========================================================
   特效：像素繪圖工具、粒子池、特效物件
   ========================================================= */
// --- 像素繪圖工具（美術座標） ---
G.px = (ctx, x, y, w = 1, h = 1) => ctx.fillRect(Math.round(x), Math.round(y), w, h);
G.pxEllipse = (ctx, cx, cy, rx, ry, col, dash = 0, rot = 0) => {
  if (rx < 0.5) return;
  ctx.fillStyle = G.PAL[col];
  const n = Math.max(10, Math.ceil((rx + ry) * 3.2));
  for (let i = 0; i < n; i++) {
    if (dash && ((i + (rot | 0)) % dash) < dash / 2) continue;
    const a = i / n * Math.PI * 2;
    ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
  }
};
// 抖動圖樣（4x4 Bayer），以 pattern 填色取代逐點繪製
G._pats = {}; G._patOff = [0, 0];
G.pat = (ctx, col, a) => {
  const k = Math.round(G.clamp(a, 0, 1) * 16), key = col * 17 + k;
  let p = G._pats[key];
  if (!p) {
    const c = G.canvas(4, 4), x = c.getContext('2d'); x.fillStyle = G.PAL[col];
    for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 4; xx++) if (G.bayer(xx, yy) < k / 16) x.fillRect(xx, yy, 1, 1);
    p = G._pats[key] = ctx.createPattern(c, 'repeat');
    if (p.setTransform) p.setTransform(new DOMMatrix([1, 0, 0, 1, G._patOff[0], G._patOff[1]]));
  }
  return p;
};
G.setPatOffset = (ox, oy) => {
  const tx = ((-ox % 4) + 4) % 4, ty = ((-oy % 4) + 4) % 4;
  if (tx === G._patOff[0] && ty === G._patOff[1]) return;
  G._patOff = [tx, ty];
  const m = new DOMMatrix([1, 0, 0, 1, tx, ty]);
  for (const k in G._pats) if (G._pats[k].setTransform) G._pats[k].setTransform(m);
};
G.pxDisc = (ctx, cx, cy, rx, ry, col, alpha = 1) => {
  if (rx < 0.5 || alpha <= 0) return;
  ctx.fillStyle = alpha >= 1 ? G.PAL[col] : G.pat(ctx, col, alpha);
  const y0 = Math.ceil(-ry), y1 = Math.floor(ry), icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const hw = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y / ry) * (y / ry))));
    ctx.fillRect(icx - hw, icy + y, hw * 2 + 1, 1);
  }
};
G.pxLine = (ctx, x0, y0, x1, y1, w = 1) => {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let k = 0; k < 600; k++) {
    ctx.fillRect(x0 - (w >> 1), y0 - (w >> 1), w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
};

// --- 粒子池（SoA，零配置） ---
G.Particles = class {
  constructor(n) {
    this.n = n; this.c = 0;
    for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'max', 'grav', 'drag']) this[k] = new Float32Array(n);
    this.col = new Int8Array(n); this.col2 = new Int8Array(n); this.sz = new Uint8Array(n); this.gnd = new Uint8Array(n);
  }
  add(x, y, z, vx, vy, vz, life, col, col2 = col, sz = 1, grav = 0, drag = 0, gnd = 0) {
    if (this.c >= this.n) return;
    const i = this.c++;
    this.x[i] = x; this.y[i] = y; this.z[i] = z; this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
    this.life[i] = this.max[i] = life; this.col[i] = col; this.col2[i] = col2; this.sz[i] = sz; this.grav[i] = grav; this.drag[i] = drag; this.gnd[i] = gnd;
  }
  update(dt) {
    for (let i = 0; i < this.c; i++) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.c--; this.copy(this.c, i); i--; continue; }
      const dr = 1 - this.drag[i] * dt;
      this.vx[i] *= dr; this.vy[i] *= dr; this.vz[i] = this.vz[i] * dr - this.grav[i] * dt;
      this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt; this.z[i] += this.vz[i] * dt;
      if (this.z[i] < 0) { this.z[i] = 0; this.vz[i] *= -0.35; this.vx[i] *= 0.6; this.vy[i] *= 0.6; }
    }
  }
  copy(a, b) { for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'max', 'grav', 'drag', 'col', 'col2', 'sz', 'gnd']) this[k][b] = this[k][a]; }
  draw(ctx, ox, oy, frame, ground) {
    for (let i = 0; i < this.c; i++) {
      if ((this.gnd[i] === 1) !== ground) continue;
      const t = this.life[i] / this.max[i];
      if (t < 0.35 && G.hash(i * 7, frame) > t / 0.35) continue;    // 像素式消散
      ctx.fillStyle = G.PAL[t > 0.5 ? this.col[i] : this.col2[i]];
      const s = this.sz[i] > 1 && t < 0.5 ? this.sz[i] - 1 : this.sz[i];
      ctx.fillRect(Math.round(this.x[i] * G.AX - ox - s / 2), Math.round(this.y[i] * G.AY - this.z[i] * G.AZ - oy - s / 2), s, s);
    }
  }
};

// --- 特效生成器（作用於 world W） ---
G.FX = {
  // 擊中火花
  hit(W, x, y, z, big, col = 9) {
    const n = big ? 14 : 6;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = G.rr(40, big ? 180 : 110);
      W.parts.add(x, y, z, Math.cos(a) * s, Math.sin(a) * s * 0.7, G.rr(20, 120), G.rr(0.15, 0.35), col, 6, big && i < 4 ? 2 : 1, 380, 3);
    }
    W.effects.push({ t: 0, dur: big ? 0.12 : 0.08, layer: 1, x, y, z, draw(ctx, o) { const r = (big ? 7 : 4) * (1 - this.t / this.dur); G.pxDisc(ctx, this.x * G.AX - o.x, this.y * G.AY - this.z * G.AZ - o.y, r, r, 9, 1); } });
  },
  // 近戰爪痕/斬擊
  slash(W, x, y, z, face, dark) {
    W.effects.push({
      t: 0, dur: 0.12, layer: 1, x, y, z, face, draw(ctx, o) {
        const p = this.t / this.dur, cx = this.x * G.AX - o.x, cy = this.y * G.AY - this.z * G.AZ - o.y;
        ctx.fillStyle = G.PAL[dark ? 1 : 9];
        for (let i = 0; i < 3; i++) { const yy = cy - 5 + i * 3; G.pxLine(ctx, cx - 4 * this.face + p * 2, yy - 3, cx + 4 * this.face + p * 2, yy + 2, 1); }

  },
  // 死亡：碎成像素
  shatter(W, u) {

    const h = u.spr[0].h / G.AZ;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = G.rr(30, 140);
      W.parts.add(u.x + G.rr(-u.vis.r, u.vis.r), u.y, u.z + G.rr(0, h), Math.cos(a) * s, Math.sin(a) * s * 0.6, G.rr(60, 220), G.rr(0.4, 0.9), col, col2, G.ri(1, 2), 500, 2);

  ring(W, x, y, r0, r1, dur, col = 9, th = 1) {

  },
  // 地面焦痕

  num(W, x, y, z, n, crit, side) {

  },
  // 落雷
  bolt(W, x, y) {

      t: 0, dur: 0.35, layer: 1, draw(ctx, o) {

        for (let i = 0; i < 10; i++) G.pxLine(ctx, bx + pts[i][0], by - top * (1 - pts[i][1]), bx + pts[i + 1][0], by - top * (1 - pts[i + 1][1]), this.t < 0.08 ? 3 : 1);

    for (let i = 0; i < 30; i++) { const a = Math.random() * 6.28; W.parts.add(u.x + Math.cos(a) * 14, u.y + Math.sin(a) * 10, G.rr(0, 10), 0, 0, G.rr(60, 160), G.rr(0.6, 1.2), 13, 9, 1, -20, 1); }

    for (let i = 0; i < 22; i++) { const a = Math.random() * 6.28; W.parts.add(u.x + Math.cos(a) * 12, u.y + Math.sin(a) * 8, G.rr(0, 6), Math.cos(a) * 20, Math.sin(a) * 12, G.rr(40, 110), G.rr(0.6, 1.1), G.pick([11, 16, 9]), 6, 1, -10, 1); }

  // 生成
  spawn(W, u) {

  },

,

      }
    });

  },
  // 範圍爆炸外觀
  blast(W, x, y, R) {

,
  // 地刺（召喚樹根／地矛亂刺）
  spikes(W, x, y, R) {

  // ===== 大地系（地動波 / 地震波 / 地面強擊 / 地動襲） =====

  spikes(W, x, y, R, el) {

  // ===== 角色身上的持續狀態（rt 為繪製時間） =====
  auraBack(ctx, u, ax, ay, base, gx, gy, rt, W) {

  auraFront(ctx, u, ax, ay, s, gx, gy, rt, W) {

      G.glow(ctx, cx, cy, Math.max(rx, ry), 12, hit ? 0.45 : 0.18, ry / Math.max(rx, ry));

        for (let k = 0; k < 3; k++) { const nx = px + (G.hash(k * 3 + j, fr) - 0.5) * 8, ny = py + (G.hash(k * 5 + j * 2, fr) - 0.5) * 6; G.addLine(ctx, px, py, nx, ny, 1, k ? 18 : 9); px = nx; py = ny; }

'use strict';
/* =========================================================
   世界：單位、戰鬥、技能、兵線、勝負
   ========================================================= */

// 依原著成長公式算出某等級的數值
G.stats = function (name, lv, side, kind) {
  if (kind === 'holy') { const h = G.TUNE.holy[side === 0 ? 'player' : 'enemy']; return { hp: h.hp, mp: 0, power: 0, armor: h.armor, crit: 0, delay: 9, range: 0, speed: 0, hpReg: h.heal_hp, mpReg: 0, weapon: null, exp: 600 }; }
  const o = G.ORIG.units[name] || G.ORIG.towers[name], L = lv - 1;
  // v2.2 敵方成長加成（配合技能升級變強）：敵方兵線／首領／獵手每級額外 HP、攻擊 %
  const E = G.BAL && G.BAL.enemy, eg = E && side === 1 && (kind === 'creep' || kind === 'boss' || kind === 'jungler') ? L : 0, hm = 1 + (E ? E.hp : 0) / 100 * eg, pm = 1 + (E ? E.pow : 0) / 100 * eg;
  return {
    hp: Math.round((o.hp + (o.grow_hp || 0) * L) * hm), mp: (o.mp || 0) + (o.grow_mp || 0) * L,
    power: Math.round((o.power + (o.grow_power || 0) * L) * pm), armor: o.armor + (o.grow_armor || 0) * L,
    crit: (o.critical || 0) + (o.grow_critical || 0) * L,
    delay: Math.max(300, (o.delay || 1000) + (o.grow_delay || 0) * L) / 1000,
    range: o.range + (o.grow_range || 0) * L, speed: (o.speed || 0) + (o.grow_speed || 0) * L,
    hpReg: (o.heal_hp || 0) + (o.grow_heal_hp || 0) * L, mpReg: (o.heal_mp || 0) + (o.grow_heal_mp || 0) * L,
    weapon: o.weapon_name, wopt: (o.weapon_option || 0) + (o.weapon_grow_option || 0) * L, exp: o.exp
  };
};

let UID = 1;
G.Unit = class {
  constructor(W, name, side, x, y, level, kind) {
    this.id = UID++; this.W = W; this.name = name; this.side = side; this.kind = kind; this.level = level;
    this.vis = G.VIS[name]; this.spr = G.SPR[this.vis.spr];
    this.x = this.px = x; this.y = this.py = y; this.z = this.vis.fly || 0; this.vx = this.vy = 0;
    this.rar = side === 0 && (kind === 'hero' || kind === 'creep') ? G.rarityOf(name) : null;
    this.face = side === 0 ? 1 : -1; this.alive = true; this.static = kind === 'tower' || kind === 'holy';
    this.atkT = Math.random() * 0.3; this.windup = 0; this.target = null; this.retarget = Math.random() * 0.3;
    this.anim = Math.random() * 10; this.flash = 0; this.lunge = 0; this.cast = 0; this.stun = 0; this.slow = 0; this.spawnT = kind === 'creep' || kind === 'hero' ? 0.3 : 0;
    this.calc(); this.hp = this.st.hp; this.mp = this.st.mp;
  }
  calc() {
    this.st = G.stats(this.name, this.level, this.side, this.kind);
    this.aura = null; this.lifesteal = 0; this.mpDisc = 0;
    const ps = this.pskills || (this.passives || []).map(id => ({ s: G.ORIG.skills[id], lv: 1 }));
    for (const sl of ps) {                          // 被動技能（原著 attribute；依技能等級成長，0 級不生效）
      if (!sl.lv) continue;
      const p = sl.s, v = p.value_1 + p.grow_value_1 * (sl.lv - 1), st = this.st;
      switch (p.attribute) {
        case 'hp_sec': st.hpReg += v; break;
        case 'mp_sec': st.mpReg += v / 10; break;
        case 'delay': st.delay = Math.max(0.3, st.delay + v / 1000); break;
        case 'speed': st.speed += v; break;
        case 'critical': st.crit += v; break;
        case 'range': st.range += v; break;
        case 'return': this.lifesteal += v; break;
        case 'mp_discount': this.mpDisc += v; break;
        case 'power': st.power += v; if (p.type === 'multi_buff') this.aura = Object.assign(this.aura || {}, { pow: v }); break;
        case 'armor': st.armor += v; if (p.type === 'multi_buff') this.aura = Object.assign(this.aura || {}, { arm: v }); break;
      }
    }
    if (this.kind === 'creep') this.st.speed *= G.TUNE.creepSpeedMul;
    this.melee = this.st.range <= 40;
  }
  get r() { return this.vis.r; }
};

G.World = class {
  constructor(opt) {
    this.stage = G.STAGES[opt.stage || 0];
    const md = G.MAPS[this.stage.map], T = G.TILE;
    G.mapCache = G.mapCache || {};
    if (!G.mapCache[this.stage.map]) { const M = G.buildMap(md); G.mapCache[this.stage.map] = { M, ground: G.renderGround(M) }; }
    this.M = G.mapCache[this.stage.map].M; this.ground = G.mapCache[this.stage.map].ground;
    this.units = []; this.projs = []; this.effects = []; this.decals = []; this.parts = new G.Particles(2600);
    this.spawnQ = []; this.time = 0; this.trauma = 0; this.flashScreen = 0; this.hitstop = 0; this.timeScale = 1;
    this.notices = []; this.stats = { kills: 0, time: 0, deaths: 0, assists: 0, camps: 0, towers: 0, gold: 0, dmg: 0, taken: 0, tower: 0, bosses: 0, hunters: 0, wboss: 0, potions: 0, tps: 0, maxFollow: 0, streak: 0, minHoly: 1 }; this.killT = [];   // 即時戰鬥數據
    this.over = null; this.attract = !!opt.attract; this.frame = 0;
    // 聖所與塔
    this.holy = [
      this.add(new G.Unit(this, 'player_holy', 0, md.holy.player[0] * T, md.holy.player[1] * T, 1, 'holy')),
      this.add(new G.Unit(this, 'enemy_holy', 1, md.holy.enemy[0] * T, md.holy.enemy[1] * T, 1, 'holy'))
    ];
    // 塔：每路外塔/內塔；內塔受外塔保護，聖所受內塔保護（任一路內塔被破才可攻擊聖所）
    this.towers = [[], []];
    const tw = md.towers3 || { player: (md.towers.player || []).map(p => [p, 1, 0]), enemy: (md.towers.enemy || []).map(p => [p, 1, 0]) };
    [['player', 0], ['enemy', 1]].forEach(([k, side]) => tw[k].forEach(([p, lane, tier]) => {
      // 外塔(0) → 中塔(1) → 內塔(2) → 主塔(9)
      const name = side === 0 ? 'player_tower' : ['enemy_tower', 'enemy_tower2', 'enemy_tower3'][tier] || 'enemy_tower4';
      const u = this.add(new G.Unit(this, name, side, p[0] * T, p[1] * T, 1, 'tower')); u.lane = lane; u.tier = tier; this.towers[side].push(u);
      if (tier === 9) { const m = G.ORIG.towers.enemy_tower4; Object.assign(u.st, { hp: m.hp, power: m.power, armor: m.armor, range: m.range, delay: m.delay / 1000 }); u.hp = u.st.hp; u.main = true; }
    }));
    // 保護鏈：同一路前一層塔沒倒，後一層有護盾；任一路內塔倒了才能打主塔；主塔倒了才能打聖所
    for (let side = 0; side < 2; side++) {
      const tw = this.towers[side];
      for (const u of tw) if (u.tier === 1 || u.tier === 2) { const o = tw.find(v => v.lane === u.lane && v.tier === u.tier - 1); if (o) u.protectors = [o]; }
      const inner = tw.filter(v => v.tier === 2), main = tw.filter(v => v.tier === 9);
      if (main.length) { main.forEach(m => { if (inner.length) { m.protectors = inner; m.protectAll = true; } }); this.holy[side].protectors = main; }
      else if (inner.length) { this.holy[side].protectors = inner; this.holy[side].protectAll = true; }
    }
    // 流場：每一路、每一方各一張（離開該路的格子成本 ×15，所以小兵會沿著自己的路走）
    const nl = md.laneCount || 1, M = this.M;
    const seeds = h => { const s = []; for (let i = 0; i < M.nav.length; i++) { if (!M.nav[i]) continue; const [x, y] = M.cellXY(i); if (G.d2(x, y, h.x, h.y) < 60 * 60) s.push(i); } return s; };
    G.flowCache = G.flowCache || {};
    const fk = this.stage.map;
    if (!G.flowCache[fk]) {
      const fl = [[], []];
      for (let li = 0; li < nl; li++) {
        let wt = null;
        if (nl > 1) { wt = new Float32Array(M.nav.length); for (let i = 0; i < M.nav.length; i++) { const [x, y] = M.cellXY(i); wt[i] = M.laneDist(li, x / T, y / T) <= md.lanes[li].r + 1.2 ? 1 : 15; } }
        fl[0][li] = M.dijkstra(seeds(this.holy[1]), wt); fl[1][li] = M.dijkstra(seeds(this.holy[0]), wt);
      }
      G.flowCache[fk] = fl;
    }
    this.flow = G.flowCache[fk];
    this.nLanes = nl;
    // 各路出生點：沿該路流場從聖所走出一段
    this.laneSpawn = [0, 1].map(s => this.flow[s].map(f => { let x = this.holy[s].x, y = this.holy[s].y; for (let i = 0; i < 10; i++) { const d = M.flowDir(f, x, y); if (!d) break; x += d[0] * 16; y += d[1] * 16; } return [x, y]; }));
    this.spawnPt = [0, 1].map(s => { const f = this.flow[s][Math.min(1, nl - 1)]; let x = this.holy[s].x, y = this.holy[s].y; for (let i = 0; i < 4; i++) { const d = M.flowDir(f, x, y); if (!d) break; x += d[0] * 16; y += d[1] * 16; } return [x, y]; });
    // Boss
    if (this.stage.boss) { const b = md.bossHome; this.boss = this.add(new G.Unit(this, this.stage.boss, 1, b[0] * T, b[1] * T, this.stage.bossLevel, 'boss')); this.boss.home = [b[0] * T, b[1] * T]; this.boss.skillCd = 3; }
    // 英雄
    this.hero = null;
    this.loadout = (opt.loadout && opt.loadout.length ? opt.loadout : this.stage.loadout).map(e => typeof e === 'string' ? { n: e, l: 1 } : e);
    this.loadPts = this.loadout.reduce((a, e) => a + G.Team.cost(e.n), 0);
    if (!this.attract && G.Ach) G.Ach.begin(this);
    if (!this.attract) this.spawnHero(G.HEROES[opt.hero || 0]);
    this.waveT = [G.TUNE.firstAllyWave, G.TUNE.firstEnemyWave]; this.waveN = [0, 0];
    if (this.attract) this.waveT = [0.5, 0.5];
    this.initSystems();
  }
  add(u) { this.units.push(u); return u; }

  spawnHero(hd) {
    const [x, y] = this.spawnPt[0];
    const h = new G.Unit(this, hd.name, 0, x, y, 1, 'hero');
    h.hd = hd; h.passives = hd.passives; h.calc(); h.hp = h.st.hp; h.mp = h.st.mp; h.exp = 0;
    h.skills = hd.skills.map(id => G.skillSlot(id));
    h.pskills = hd.passives.map(id => Object.assign(G.skillSlot(id), { passive: true }));
    h.passives = null; h.calc(); h.hp = h.st.hp; h.mp = h.st.mp;
    h.cmd = null; h.path = null; h.pending = null; h.hold = false; h.repath = 0; h.dead = 0; h.sp = 0;
    this.hero = this.add(h);
    G.FX.spawn(this, h);
  }

  // ---------- 音效（只播放鏡頭附近） ----------
  sfx(name, x, y) {
    if (this.attract) return;
    if (x != null && this.cam && G.d2(x, y, this.cam.x, this.cam.y) > 520 * 520) return;
    G.Audio.play(name);
  }
  shake(v) { this.trauma = Math.min(1, this.trauma + v); }

  // ---------- 主更新 ----------
  update(dt) {
    this.frame++;
    if (this.hitstop > 0) { this.hitstop -= dt; return; }
    dt *= this.timeScale;
    this.time += dt; if (!this.over) this.stats.time += dt;
    this.updateWaves(dt); this.updateSystems(dt);
    if (G.Ach && !this.attract) G.Ach.tick(this, dt);
    // 廣播：最多同時顯示 4 則（上下堆疊），其餘排隊；顯示中的才計時
    if (this.notices.length) { for (let i = 0; i < Math.min(4, this.notices.length); i++) this.notices[i].age += dt; this.notices = this.notices.filter(n => n.age < n.t + G.NOTICE_OUT); }
    for (const u of this.units) { u.px = u.x; u.py = u.y; }
    for (const u of this.units) if (u.alive) this.updateUnit(u, dt);
    this.separate();
    for (const p of this.projs) this.updateProj(p, dt);
    this.projs = this.projs.filter(p => !p.done);
    for (const e of this.effects) { e.t += dt; if (e.update) e.update(dt); }
    this.effects = this.effects.filter(e => e.t < e.dur);
    for (const d of this.decals) d.t += dt;
    if (this.mark) { this.mark.t += dt; const h = this.hero; if (!h || !h.alive || !h.cmd || h.cmd.type !== 'move') { this.mark.out = (this.mark.out || 0) + dt; if (this.mark.out > 0.2) this.mark = null; } else this.mark.out = 0; }
    this.decals = this.decals.filter(d => d.t < d.dur);
    this.parts.update(dt);
    this.units = this.units.filter(u => u.alive || (u === this.hero));
    this.trauma = Math.max(0, this.trauma - dt * 1.6);
    this.flashScreen = Math.max(0, this.flashScreen - dt);
    // 英雄復活
    const h = this.hero;
    if (h && !h.alive && !this.over) {
      h.dead -= dt;
      if (h.dead <= 0) { const [x, y] = this.spawnPt[0]; h.x = h.px = x; h.y = h.py = y; h.alive = true; h.hp = h.st.hp; h.mp = h.st.mp; h.cmd = null; h.target = null; h.pending = null; G.FX.respawn(this, h); this.sfx('shield'); }   // 重生特效（不是升級）
    }
    if (this.over) { this.over.t += dt / Math.max(0.1, this.timeScale); if (this.over.t > 1.4) this.timeScale = 1; }
    // BGM 強度
    if (h && h.alive && !this.attract) {
      let n = 0; for (const u of this.units) if (u.alive && u.side === 1 && G.d2(u.x, u.y, h.x, h.y) < 300 * 300) n += u.kind === 'boss' ? 4 : 1;
      G.Audio.setIntensity(G.clamp(n / 5, 0, 1));
    }
  }

  // ---------- 兵線 ----------
  updateWaves(dt) {
    if (this.over) return;
    for (let s = 0; s < 2; s++) {
      this.waveT[s] -= dt;
      if (this.waveT[s] <= 0) { this.waveT[s] = G.TUNE.waveInterval * (this.attract ? 0.5 : 1); this.spawnWave(s); }
    }
    for (const q of this.spawnQ) q.t -= dt;
    for (const q of this.spawnQ.filter(q => q.t <= 0)) {
      const lane = Math.min(q.lane ?? 1, this.nLanes - 1), [x, y] = this.laneSpawn[q.side][lane];
      // 雙生花：兩隻同時、左右並排出生（各自獨立行動）
      let sx = x + G.rr(-10, 10), sy = y + G.rr(-10, 10);
      if (q.twin != null) { const ox = x + (q.twin ? 8 : -8), oy = y + (q.twin ? 14 : -14); if (this.M.isWalk(ox, oy)) { sx = ox; sy = oy; } }
      const u = this.add(new G.Unit(this, q.name, q.side, sx, sy, q.level, q.kind || 'creep')); u.lane = lane;
      G.FX.spawn(this, u); this.sfx('spawn', x, y);
    }
    this.spawnQ = this.spawnQ.filter(q => q.t > 0);
  }
  spawnWave(s) {
    const n = this.waveN[s]++;
    if (this.units.filter(u => u.alive && u.side === s && u.kind !== 'holy' && !u.static).length > 40) return;
    if (s === 0) {
      let k = 0;
      this.loadout.forEach(({ n: name, l }) => {
        if (name === 'twinflower') { const t = (k++) * 0.4; for (let j = 0; j < 2; j++) this.spawnQ.push({ t, name, side: 0, level: this.stage.allyLevel, lane: l, twin: j }); }
        else this.spawnQ.push({ t: (k++) * 0.4, name, side: 0, level: this.stage.allyLevel, lane: l });
      });
    } else {
      // 依原著關卡順序逐波升級（第 n 波 = 原著第 n+1 關的敵人與等級）
      const st = G.ORIG.stages[Math.min(99, 1 + n)] || G.ORIG.stages[1], m = st.missions[0];
      for (let lane = 0; lane < this.nLanes; lane++) m.enemies.forEach((name, i) => this.spawnQ.push({ t: i * 0.45, name, side: 1, level: st.start_level, lane }));
      if (m.boss && n % 3 === 2) { this.spawnQ.push({ t: m.enemies.length * 0.45 + 0.5, name: m.boss, side: 1, level: st.start_level + 1, kind: 'boss', lane: n % this.nLanes }); this.sfx('warn'); }
      this.stageNow = 1 + n;
    }
  }
  // ---------- 搜尋 ----------
  dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y) - b.r; }
  inRange(a, b, extra = 0) { return this.dist(a, b) - a.r * 0.4 <= a.st.range + extra; }
  nearestEnemy(u, range, fromX = u.x, fromY = u.y) {
    let best = null, bd = 1e9;
    for (const t of this.units) {
      if (!t.alive || t.side === u.side || (t.protectors && this.isProtected(t))) continue;
      if (t.side === 2 && u.kind !== 'hero' && t.aggro !== u) continue;   // 中立怪：只有英雄（或被牠盯上的）會打
      if (!this.seen(u.side, t)) continue;                                // 迷霧裡的看不到
      let d = Math.hypot(t.x - fromX, t.y - fromY) - t.r;
      if (d > range) continue;
      if (t.static) d += 40;                // 優先打單位
      if (t.side === 2) d += 60;
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }
  valid(u, t) { return t && t.alive && t.side !== u.side && !this.isProtected(t) && (u.side === 2 || this.seen(u.side, t)); }
  isProtected(t) { const p = t.protectors; if (!p || !p.length) return false; return t.protectAll ? p.every(v => v.alive) : p.some(v => v.alive); }

  // ---------- 移動 ----------
  moveDir(u, dx, dy, dt, mul = 1) {
    const sp = u.st.speed * mul * (u.slow > 0 ? 0.5 : 1) * (u.iSpd || 1) * G.TUNE.moveMul;
    const k = G.damp(u.kind === 'hero' ? 20 : 9, dt);
    u.vx += (dx * sp - u.vx) * k; u.vy += (dy * sp - u.vy) * k;
    this.step(u, dt);
  }
  brake(u, dt) { const k = G.damp(16, dt); u.vx -= u.vx * k; u.vy -= u.vy * k; this.step(u, dt); }
  step(u, dt) {
    const M = this.M, nx = u.x + u.vx * dt, ny = u.y + u.vy * dt;
    if (M.isWalk(nx, ny)) { u.x = nx; u.y = ny; }
    else if (M.isWalk(nx, u.y)) { u.x = nx; u.vy *= 0.5; }
    else if (M.isWalk(u.x, ny)) { u.y = ny; u.vx *= 0.5; }
    else { u.vx *= 0.3; u.vy *= 0.3; }
    if (Math.abs(u.vx) > 6) u.face = u.vx > 0 ? 1 : -1;
    const sp = Math.hypot(u.vx, u.vy);
    u.anim += dt * (sp > 8 ? sp / 9 : 1);
    if (u.kind === 'hero' && sp > 20 && ((u.anim * 2) | 0) !== u._step) { u._step = (u.anim * 2) | 0; if (Math.random() < 0.6) this.parts.add(u.x - u.vx * 0.05, u.y + 2, 0, G.rr(-10, 10), G.rr(-5, 5), G.rr(10, 25), 0.35, 6, 4, 1, 60, 3, 0); }
  }
  moveTo(u, x, y, dt, mul = 1) {
    const dx = x - u.x, dy = y - u.y, l = Math.hypot(dx, dy);
    if (l < 2) { this.brake(u, dt); return true; }
    this.moveDir(u, dx / l, dy / l, dt, mul); return false;
  }
  flowMove(u, dt) {
    const d = this.M.flowDir(this.flow[u.side][u.lane ?? Math.min(1, this.nLanes - 1)], u.x, u.y);
    if (d) this.moveDir(u, d[0], d[1], dt); else this.brake(u, dt);
  }
  // 分離（避免重疊）
  separate() {
    const us = this.units;
    for (let i = 0; i < us.length; i++) {
      const a = us[i]; if (!a.alive) continue;
      for (let j = i + 1; j < us.length; j++) {
        const b = us[j]; if (!b.alive || (a.static && b.static) || (!!a.vis.fly !== !!b.vis.fly)) continue;
        const rr = (a.r + b.r) * 0.85, dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr || d2 < 0.0001) continue;
        const d = Math.sqrt(d2), ov = (rr - d) / d;
        let wa = a.static ? 0 : a.kind === 'hero' || a.kind === 'boss' ? 0.3 : 1, wb = b.static ? 0 : b.kind === 'hero' || b.kind === 'boss' ? 0.3 : 1;
        const s = wa + wb; if (!s) continue; wa /= s; wb /= s;
        const k = 0.5;
        const ax = a.x - dx * ov * wa * k, ay = a.y - dy * ov * wa * k, bx = b.x + dx * ov * wb * k, by = b.y + dy * ov * wb * k;
        if (wa && this.M.isWalk(ax, ay)) { a.x = ax; a.y = ay; }
        if (wb && this.M.isWalk(bx, by)) { b.x = bx; b.y = by; }
      }
    }
  }

  // ---------- 單位 AI ----------
  updateUnit(u, dt) {
    u.flash -= dt; u.lunge = Math.max(0, u.lunge - dt * 7); u.cast = Math.max(0, u.cast - dt); u.spawnT = Math.max(0, u.spawnT - dt);
    u.atkT -= dt; u.slow -= dt;
    if (u.hp < u.st.hp) u.hp = Math.min(u.st.hp, u.hp + u.st.hpReg * dt);
    this.tickStatus(u, dt); if (!u.alive) return;
    if (u.tb) this.tickBuffs(u, dt);
    if (u.st.mp) u.mp = Math.min(u.st.mp, u.mp + (u.st.mpReg + (u.iMp || 0)) * dt);
    if (u.windup > 0) { u.windup -= dt; if (u.windup <= 0) this.fire(u, u.wTarget); return this.brake(u, dt); }
    if (u.stun > 0) { u.stun -= dt; return this.brake(u, dt); }
    if (u.kind === 'holy') return;
    if (u.kind === 'tower') return this.towerAI(u, dt);
    if (u.kind === 'hero') return this.heroAI(u, dt);
    if (u.side === 2) return this.wildAI(u, dt);
    if (u.kind === 'jungler') return this.junglerAI(u, dt);
    if (u.kind === 'boss') return this.bossAI(u, dt);
    this.creepAI(u, dt);
  }
  tryAttack(u, t) {
    u.face = t.x > u.x ? 1 : -1;
    if (u.atkT <= 0) { u.windup = u.melee ? 0.13 : 0.09; u.wTarget = t; u.atkT = 9; }
  }
  creepAI(u, dt) {
    if (u.follow && this.followAI(u, dt)) return;
    u.retarget -= dt;
    if (!this.valid(u, u.target) || u.retarget <= 0) { u.retarget = 0.35; u.target = this.nearestEnemy(u, Math.max(G.TUNE.aggro, u.st.range + 20)); }
    const t = u.target;
    if (t) {
      if (this.inRange(u, t)) { this.brake(u, dt); this.tryAttack(u, t); }
      else this.moveTo(u, t.x, t.y, dt);
    } else this.flowMove(u, dt);
  }
  bossAI(u, dt) {
    if (u.follow && this.followAI(u, dt)) return;
    u.retarget -= dt; u.skillCd = (u.skillCd ?? 3) - dt;
    const home = u.home;
    if (!this.valid(u, u.target) || u.retarget <= 0) { u.retarget = 0.4; u.target = home ? this.nearestEnemy(u, 210, home[0], home[1]) : this.nearestEnemy(u, Math.max(G.TUNE.aggro, u.st.range + 20)); }
    const t = u.target, sid = G.BOSS_SKILL[u.name];
    if (t) {
      if (sid && u.skillCd <= 0) {
        const sd = G.ORIG.skills[sid], d = this.dist(u, t), round = (G.WEAPONS_BY_ID[sd.weapon_id] || {}).attack_type === 'round';
        if (d < sd.range && (round || d > 30)) { u.skillCd = Math.max(3, sd.delay); this.useSkill(u, sd, t, sd.lv1 || 1); }
      }
      if (this.inRange(u, t)) { this.brake(u, dt); this.tryAttack(u, t); }
      else this.moveTo(u, t.x, t.y, dt);
    } else if (home) { if (G.d2(u.x, u.y, home[0], home[1]) > 100) this.moveTo(u, home[0], home[1], dt); else this.brake(u, dt); }
    else this.flowMove(u, dt);
  }
  towerAI(u, dt) {
    u.retarget -= dt;
    if (!this.valid(u, u.target) || !this.inRange(u, u.target) || u.retarget <= 0) { u.retarget = 0.5; u.target = this.nearestEnemy(u, u.st.range); }
    if (u.target) this.tryAttack(u, u.target);
  }

  // ---------- 英雄 ----------
  heroAI(h, dt) {
    const T = G.TUNE;
    let nd = 1e9; for (const t of this.units) if (t.alive && t.side !== h.side) { const d = Math.hypot(t.x - h.x, t.y - h.y) - t.r - h.r * 0.4; if (d < nd) nd = d; }
    h.nearD = nd; h.rangeA = G.clamp((h.rangeA || 0) + (nd < h.st.range + 110 ? 4 : -3) * dt, 0, 1);
    const cdr = 1 / (1 - Math.min(60, h.iCdr || 0) / 100);
    for (const s of h.skills) { if (s.cd > 0) { s.cd -= dt * cdr; if (s.cd <= 0) { s.ready = 0.4; this.sfx('ready'); } } s.ready = Math.max(0, s.ready - dt); }
    // 聖所回復
    if (G.d2(h.x, h.y, this.holy[0].x, this.holy[0].y) < T.sanctuaryRange * T.sanctuaryRange) {
      h.hp = Math.min(h.st.hp, h.hp + h.st.hp * T.sanctuaryHeal * dt); h.mp = Math.min(h.st.mp, h.mp + h.st.mp * T.sanctuaryHeal * dt);
      if (Math.random() < dt * 8) this.parts.add(h.x + G.rr(-10, 10), h.y, 2, 0, 0, 40, 0.6, 9, 7, 1, -10, 0);
    }
    // 鍵盤直接移動
    const kd = this.keyDir;
    if (kd) { this.cancelTeleport(true); h.cmd = null; h.pending = null; h.path = null; return this.moveDir(h, kd[0], kd[1], dt); }
    if (this.tp && this.tp.ch) { h.target = null; return this.brake(h, dt); }   // 傳送引導中：原地不動
    // 待施放技能：走到射程內再放
    if (h.pending) {
      const p = h.pending, s = h.skills[p.i];
      if (!this.valid(h, p.t)) h.pending = null;
      else if (this.dist(h, p.t) <= s.range) { h.pending = null; this.castSkill(h, p.i, p.t); return this.brake(h, dt); }
      else return this.chase(h, p.t, dt);
    }
    const c = h.cmd;
    if (c && c.type === 'move') {
      if (!h.path || !h.path.length) { h.cmd = null; return this.brake(h, dt); }
      const wp = h.path[0];
      if (G.d2(h.x, h.y, wp[0], wp[1]) < 36) { h.path.shift(); if (!h.path.length) { h.cmd = null; } }
      if (h.path && h.path.length) {
        const w = h.path[0], dx = w[0] - h.x, dy = w[1] - h.y, l = Math.hypot(dx, dy) || 1; this.moveDir(h, dx / l, dy / l, dt);
        // 卡住偵測：0.5 秒內幾乎沒有接近終點就停下（例如點在塔上走不到）
        const end = h.path[h.path.length - 1], dd = Math.hypot(end[0] - h.x, end[1] - h.y);
        if (dd < (c.best ?? 1e9) - 3) { c.best = dd; c.stall = 0; } else if ((c.stall = (c.stall || 0) + dt) > 0.5) { h.cmd = null; h.path = null; h.retarget = 0; }
      }
      else { this.brake(h, dt); h.retarget = 0; }
      return;
    }
    if (c && c.type === 'attack') {
      if (c.auto) { h.retarget -= dt; if (h.retarget <= 0) { h.retarget = 0.2; const nt = this.autoTarget(h, h.st.range + (h.hold ? 0 : T.heroAggro)); if (nt) c.t = nt; } }
      const t = c.t;
      if (!this.valid(h, t) || (c.auto && this.dist(h, t) > h.st.range + T.heroAggro * 2.2)) { h.cmd = null; return this.brake(h, dt); }
      h.target = t;
      if (this.inRange(h, t)) { this.brake(h, dt); this.tryAttack(h, t); }
      else if (h.hold) { h.cmd = null; this.brake(h, dt); }
      else this.chase(h, t, dt);
      return;
    }
    // 閒置：自動攻擊附近敵人
    this.brake(h, dt);
    h.retarget -= dt;
    if (h.retarget <= 0) {
      h.retarget = 0.2;
      const t = this.autoTarget(h, h.st.range + (h.hold ? 0 : T.heroAggro));
      if (t) { h.cmd = { type: 'attack', t, auto: true }; h.target = t; } else h.target = null;
    }
  }
  // 自動選目標：射程內優先「血量最低的單位」，其次最近的單位，最後才是建築
  autoTarget(h, reach) {
    let best = null, bs = 1e9;
    for (const t of this.units) {
      if (!t.alive || t.side === h.side || (t.protectors && this.isProtected(t)) || !this.seen(h.side, t)) continue;
      const d = Math.hypot(t.x - h.x, t.y - h.y) - t.r - h.r * 0.4;
      if (d > reach) continue;
      const inR = d <= h.st.range;
      let sc = inR ? t.hp : 10000 + d;          // 射程內比血量，射程外比距離
      if (t.static) sc += 100000;               // 建築最後
      if (t.side === 2 && t.aggro !== h) sc += 50000;   // 沒在打的野怪排後面
      if (t === h.target) sc -= inR ? 15 : 0;   // 稍微黏住目前目標，避免來回切換
      if (sc < bs) { bs = sc; best = t; }
    }
    return best;
  }
  chase(h, t, dt, mul = 1) {
    if (this.M.los(h.x, h.y, t.x, t.y)) { h.path = null; return this.moveTo(h, t.x, t.y, dt, mul); }
    h.repath -= dt;
    if (!h.path || h.repath <= 0) { h.repath = 0.4; h.path = this.M.path(h.x, h.y, t.x, t.y); }
    if (h.path && h.path.length) { const w = h.path[0]; if (G.d2(h.x, h.y, w[0], w[1]) < 64) h.path.shift(); if (h.path.length) return this.moveTo(h, h.path[0][0], h.path[0][1], dt, mul); }
    this.brake(h, dt);
  }
  // 指令
  cmdMove(x, y, quiet) {
    const h = this.hero; if (!h || !h.alive) return;
    this.cancelTeleport(true);
    h.pending = null; h.cmd = { type: 'move' }; h.path = this.M.path(h.x, h.y, x, y); h.target = null;
    const e = h.path.length ? h.path[h.path.length - 1] : [x, y];
    if (!quiet || !this.mark) this.mark = { x: e[0], y: e[1], t: 0 };
    else { this.mark.x = e[0]; this.mark.y = e[1]; }
  }
  // 鎖定目標：英雄會一直追打直到目標死亡或玩家下新的移動指令
  cmdLock(t) {
    const h = this.hero; if (!h || !h.alive) return false;
    if (!this.valid(h, t)) { G.FX.ring(this, t.x, t.y, t.r + 10, t.r + 12, 0.35, 12, 2); G.Audio.play('deny'); return false; }
    this.cancelTeleport(true);
    h.pending = null; h.cmd = { type: 'attack', t, lock: true }; h.target = t; h.path = null; this.mark = null;
    t.lockT = 0; G.Audio.play('lock'); return true;
  }
  cmdAttack(t) {
    const h = this.hero; if (!h || !h.alive || !this.valid(h, t)) return;
    h.pending = null; h.cmd = { type: 'attack', t }; h.target = t; h.path = null;
  }
  cmdAttackNearest() {
    const h = this.hero; if (!h || !h.alive) return false;
    const t = this.nearestEnemy(h, 360); if (!t) return false;
    this.cmdAttack(t); return true;
  }
  usePotion(i) { return this.useItem(i ? 'mp' : 'hp'); }

  // ---------- 召集：點友方小兵 → 跟隨英雄（一起移動、打同一個目標）；再點一次解除 ----------
  toggleFollow(u) {
    const h = this.hero; if (!h || !h.alive || !u.alive) return;
    u.follow = !u.follow; u.path = null; u.target = null; u.repath = 0;
    if (u.follow) {
      const n = this.units.filter(v => v.follow && v.alive).length, a = n * 2.4;
      this.stats.maxFollow = Math.max(this.stats.maxFollow, n);
      u.fOff = [Math.cos(a) * (18 + (n % 3) * 8), Math.sin(a) * (12 + (n % 3) * 5)];
      G.FX.ring(this, u.x, u.y, 3, u.r + 14, 0.4, 13, 2); G.Audio.play('lock');
      if (G.UI) G.UI.toastMsg('跟隨英雄（' + n + '）', 13);
    } else {
      G.FX.ring(this, u.x, u.y, u.r + 14, 3, 0.3, 6, 1); G.Audio.play('click');
      if (G.UI) G.UI.toastMsg('解除跟隨，回到兵線', 7);
    }
  }

  },
  junglerAI(u, dt) {

      else for (const t of this.units) { if (!t.alive || t.side !== 0 || t.static || !this.seen(1, t)) continue; const d = Math.hypot(t.x - u.x, t.y - u.y); if (d < 120 && d < fd) { fd = d; foe = t; } }
      if (foe) u.target = foe;
      else {
        let best = null, bd = 1e9;

          if (!c.u || !c.u.alive || (c.def.kind === 'wboss' && (u.level < G.TUNE.jungle.bossLv || this.time < G.TUNE.jungle.bossTime))) continue;

  },
  hunterReward(u, t) {
    const d = t.wild, L = G.TUNE.jungle.maxLv;
    const lvUp = n => { const f = u.hp / u.st.hp; u.level = Math.min(L, u.level + n); u.calc(); u.hp = u.st.hp * f; G.FX.levelUp(this, u); };
    if (d.kind === 'wboss') {
      const b = this.add(new G.Unit(this, t.name, 1, t.x, t.y, d.lv, 'boss'));
      b.st.hp = Math.round(b.st.hp * 2); b.hp = b.st.hp; b.skillCd = 3;
      let bl = 1, bd = 1e9; for (let li = 0; li < this.nLanes; li++) { const v = this.M.laneDist(li, t.x / G.TILE, t.y / G.TILE); if (v < bd) { bd = v; bl = li; } }
      b.lane = bl; G.FX.spawn(this, b); this.say({ s: '敵方獵手收服了' + d.n, ic: d.ic, col: 10, t: 2.8 }); this.sfx('warn');

    }

    else if (d.buff === 'blue') { this.addBuff(u, 'j_blue', { arm: 3 }, 90, 'i_hold', 12); u.hp = u.st.hp; }
    else lvUp(1);
    const ours = G.d2(t.x, t.y, this.holy[0].x, this.holy[0].y) < G.d2(t.x, t.y, this.holy[1].x, this.holy[1].y);   // 只在偷我方野區時提醒

  },
  // ----- 視野 -----
  updateVision(dt) {
    const V = this.vis, VT = G.TUNE.vision; V.t -= dt; if (V.t > 0) return; V.t = VT.every;
    const M = this.M, cs = V.cs;
    // 視線：每 12 單位取樣，連續 3 個樣本在森林裡就算被擋住（細的樹邊不擋）
    const sight = (x0, y0, x1, y1) => { const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 12); let run = 0; for (let i = 1; i < n; i++) { const t = i / n; if (!M.isWalk(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) { if (++run >= 3) return false; } else run = 0; } return true; };
    for (let side = 0; side < 2; side++) {
      const v = V.v[side]; v.fill(0);
      for (const u of this.units) {
        if (!u.alive || u.side !== side) continue;
        const R = u.kind === 'holy' ? VT.holy : u.static ? VT.tower : u.kind === 'hero' ? VT.hero : u.kind === 'boss' ? VT.boss : u.kind === 'jungler' ? VT.jungler : VT.creep;
        const c0 = Math.max(0, ((u.x - R) / cs) | 0), c1 = Math.min(V.gw - 1, ((u.x + R) / cs) | 0), r0 = Math.max(0, ((u.y - R) / cs) | 0), r1 = Math.min(V.gh - 1, ((u.y + R) / cs) | 0);
        for (let gy = r0; gy <= r1; gy++) for (let gx = c0; gx <= c1; gx++) {
          const i = gy * V.gw + gx; if (v[i]) continue;
          const cx = (gx + 0.5) * cs, cy = (gy + 0.5) * cs; if (G.d2(cx, cy, u.x, u.y) > R * R) continue;
          if (u.static || sight(u.x, u.y, cx, cy)) v[i] = 1;
        }
      }
    }
  },
  // side 方看不看得到 t（建築永遠看得到；自己人永遠看得到）
  seen(side, t) {
    if (this.attract || side === 2 || !t || t.static || t.side === side) return true;
    const V = this.vis; if (!V) return true;
    return V.v[side][G.clamp((t.y / V.cs) | 0, 0, V.gh - 1) * V.gw + G.clamp((t.x / V.cs) | 0, 0, V.gw - 1)] === 1;
  },
  seenXY(side, x, y) { const V = this.vis; if (this.attract || !V) return true; return V.v[side][G.clamp((y / V.cs) | 0, 0, V.gh - 1) * V.gw + G.clamp((x / V.cs) | 0, 0, V.gw - 1)] === 1; },
  // ----- 友方塔傳送：點我方塔 → 引導 3 秒 → 英雄與跟隨的小兵一起傳過去；冷卻 30 秒 -----
  startTeleport(tw) {
    const h = this.hero, T = G.TUNE.tp; if (!h || !h.alive) return false;

    if (this.tp.cd > 0) { if (G.UI) G.UI.toastMsg('傳送冷卻中 ' + Math.ceil(this.tp.cd) + ' 秒', 10); G.Audio.play('deny'); return true; }
    h.cmd = null; h.pending = null; h.path = null; h.target = null; this.mark = null;
    this.tp.ch = { t: T.channel, max: T.channel, to: tw };
    G.FX.ring(this, tw.x, tw.y, 40, 6, 0.5, 13, 2); G.Audio.play('open');
    return true;
  },
  cancelTeleport(msg) { if (!this.tp || !this.tp.ch) return; this.tp.ch = null; if (msg && G.UI) G.UI.toastMsg('傳送取消', 7); },
  updateTeleport(dt) {
    const tp = this.tp, h = this.hero; if (!tp) return;
    if (tp.cd > 0) tp.cd -= dt;
    const ch = tp.ch; if (!ch) return;

    ch.t -= dt;
    if (Math.random() < dt * 30) this.parts.add(h.x + G.rr(-10, 10), h.y + G.rr(-4, 4), 0, 0, 0, G.rr(40, 90), 0.6, 13, 9, 1, -10, 0);
    if (((ch.t * 2) | 0) !== ch.k) { ch.k = (ch.t * 2) | 0; G.FX.ring(this, ch.to.x, ch.to.y, 34, 8, 0.45, 13, 1); }
    if (ch.t > 0) return;
    tp.ch = null; tp.cd = G.TUNE.tp.cd;
    this.stats.tps++;
    const tw = ch.to, M = this.M, spot = (ox, oy) => { for (let r = 0; r < 60; r += 8) for (let a = 0; a < 6.28; a += 0.8) { const x = tw.x + ox + Math.cos(a) * r, y = tw.y + oy + Math.sin(a) * r * 0.7; if (M.isWalk(x, y)) return [x, y]; } return [tw.x, tw.y + 30]; };
    G.FX.ring(this, h.x, h.y, 4, 40, 0.5, 13, 2);
    const [hx, hy] = spot(0, 34); h.x = h.px = hx; h.y = h.py = hy; h.vx = h.vy = 0;
    for (const u of this.units) if (u.alive && u.follow) { const [x, y] = spot((u.fOff ? u.fOff[0] : 0), 34 + (u.fOff ? u.fOff[1] : 0)); G.FX.ring(this, u.x, u.y, 3, 20, 0.4, 13, 1); u.x = u.px = x; u.y = u.py = y; u.vx = u.vy = 0; u.path = null; G.FX.spawn(this, u); }
    G.FX.spawn(this, h); G.FX.ring(this, hx, hy, 4, 50, 0.6, 13, 2); this.sfx('level');
    const R = G.Render; if (R && !this.attract) { R.cam.x = hx; R.cam.y = hy; R.cam.follow = true; }
  },
  // 野怪被擊殺 → 獎勵
  wildReward(t, src) {
    const d = t.wild, h = this.hero, G0 = G.TUNE.gold;
    if (src && src.kind === 'jungler') return this.hunterReward(src, t);
    if (!src || src.side !== 0 || !h) return;
    if (d.kind === 'wboss') {
      this.addGold(G0.wild, t.x, t.y);
      // 轉生為我方首領：沿最近的路線推塔
      const ally = this.add(new G.Unit(this, t.name, 0, t.x, t.y, d.lv, 'boss'));
      ally.st.hp = Math.round(ally.st.hp * 2); ally.hp = ally.st.hp; ally.skillCd = 3; ally.allyBoss = true;
      let bl = 1, bd = 1e9; for (let li = 0; li < this.nLanes; li++) { const v = this.M.laneDist(li, t.x / G.TILE, t.y / G.TILE); if (v < bd) { bd = v; bl = li; } }
      ally.lane = bl; G.FX.spawn(this, ally); G.FX.levelUp(this, ally);

      else { const b = G.JBUFF[d.buff]; this.addBuff(h, 'j_' + d.buff, b.fx, b.t, b.ic, b.col); this.say({ s: '獲得 ' + b.n, ic: b.ic, col: b.col, t: 2.2 }); G.FX.ring(this, h.x, h.y, 4, 40, 0.6, b.col, 2); }
      this.sfx('level', t.x, t.y);

  },

  // ----- 金錢 -----
  addGold(n, x, y) {
    n = Math.round(n); if (n <= 0 || this.attract) return;
    this.gold += n; this.stats.gold += n;
    if (x != null) G.FX.popText(this, x, y, 30, '+' + n, 13);
  },
  killGold(t, src) {
    const h = this.hero, G0 = G.TUNE.gold; if (!h || t.side !== 1) return;
    if (t.static) { this.addGold(G0.tower, t.x, t.y); return; }
    if (t.kind === 'jungler') { if (src === h) this.addGold(G.TUNE.jungle.gold, t.x, t.y); else if (h.alive && G.d2(h.x, h.y, t.x, t.y) < 300 * 300) this.addGold(G.TUNE.jungle.gold / 2, t.x, t.y); return; }
    if (src === h) this.addGold(t.kind === 'boss' ? G0.boss : G0.last, t.x, t.y);
    else if (h.alive && G.d2(h.x, h.y, t.x, t.y) < 300 * 300) this.addGold(G0.near);
  },
  buy(id) {
    const it = G.SHOP_BY[id]; if (!it || this.gold < it.cost) return 'gold';
    const slot = this.bag.find(b => b.id === id);
    if (!slot && this.bag.length >= G.TUNE.bagMax) return 'full';
    this.gold -= it.cost;
    if (slot) slot.n++; else this.bag.push({ id, n: 1 });
    G.Audio.play('coin'); return 'ok';
  },
  useItem(id) {
    const h = this.hero, slot = this.bag.find(b => b.id === id), it = G.SHOP_BY[id];
    if (!h || !h.alive || !slot || !it) return false;
    if (it.k === 'hp') { if (h.hp >= h.st.hp) return false; h.hp = Math.min(h.st.hp, h.hp + it.v); }
    else if (it.k === 'mp') { if (h.mp >= h.st.mp) return false; h.mp = Math.min(h.st.mp, h.mp + it.v); }
    else this.addBuff(h, 'i_' + id, { [it.k]: it.v }, it.t, it.ic, null);
    if (--slot.n <= 0) this.bag.splice(this.bag.indexOf(slot), 1);
    const col = { hp: 10, mp: 11, del: 13, crit: 14, arm: 12, pow: 17, spd: 8 }[it.k];
    for (let k = 0; k < 18; k++) this.parts.add(h.x + G.rr(-10, 10), h.y + G.rr(-4, 4), G.rr(0, 20), 0, 0, G.rr(30, 70), G.rr(0.5, 0.9), col, 4, 1, -10, 1);
    G.FX.ring(this, h.x, h.y, 4, 26, 0.35, col);
    this.stats.potions++; this.sfx('potion'); return true;
  },

  // ----- 計時增益（藥水、野怪 buff）-----
  // fx：pow(%) del(攻速%) crit(%) arm(+) spd(移速%) mpReg(+/秒) cdr(冷卻%)
  addBuff(u, key, fx, t, ic, col) {
    u.tb = u.tb || {};
    u.tb[key] = { fx, t, max: t, ic, col };
    this.applyBuffs(u);
  },
  applyBuffs(u) {
    const a = { pow: 0, del: 0, crit: 0, arm: 0, spd: 0, mpReg: 0, cdr: 0 };
    for (const k in u.tb || {}) for (const f in u.tb[k].fx) a[f] += u.tb[k].fx[f];
    u.iPow = 1 + a.pow / 100; u.iDel = 1 / (1 + a.del / 100); u.iCrit = a.crit; u.iArm = a.arm; u.iSpd = 1 + a.spd / 100; u.iMp = a.mpReg; u.iCdr = a.cdr;
  },
  tickBuffs(u, dt) {

    for (const k in u.tb) { u.tb[k].t -= dt; if (u.tb[k].t <= 0) { delete u.tb[k]; ch = true; } }
    if (ch) this.applyBuffs(u);
  },

  // ----- 技能升級 -----
  canLevel(s) {
    const h = this.hero; if (!h || !s || s.lv >= G.SKILL_MAX || (h.sp || 0) <= 0) return false;
    return h.level >= G.skillReq(s.s, s.lv + 1);
  },
  levelSkill(s, quiet) {
    const h = this.hero; if (!this.canLevel(s)) return false;
    h.sp--; s.lv++;
    if (s.passive) { const hp = h.hp / h.st.hp, mp = h.mp / h.st.mp; h.calc(); h.hp = h.st.hp * hp; h.mp = h.st.mp * mp; }
    else { const v = G.skillVal(s.s, s.lv); s.cdMax = v.cd; }
    if (!quiet) this.skillNotice(s);
    if (!quiet) { this.sfx('level'); G.FX.ring(this, h.x, h.y, 3, 22, 0.35, 13); for (let k = 0; k < 10; k++) this.parts.add(h.x + G.rr(-8, 8), h.y, G.rr(4, 20), 0, 0, G.rr(40, 80), 0.6, 13, 9, 1, -10, 0); }
    return true;
  },
  // 升級回饋：廣播這一級多了什麼（例：火球 Lv2　傷害 100→140）
  skillNotice(s) {
    const nm = (G.TXT.skill || {})[s.id] || '', r = G.skillRows(s.s)[0], R = G.Render;
    let msg = '學會 ' + nm;
    if (s.lv >= 2 && r) {
      const unit = r.f(s.lv).slice(String(r.g(s.lv)).length), ch = r.k + ' ' + r.g(s.lv - 1) + '→' + r.g(s.lv) + unit;
      const maxW = (R && R.uw ? R.uw - (R.ins ? R.ins.l + R.ins.r : 0) : 320) - 30, fit = t => !G.cnW || G.cnW(t) <= maxW, val = r.g(s.lv - 1) + '→' + r.g(s.lv) + unit;
      // 放得下就完整顯示；窄螢幕依序省略：標籤 → 等級 → 技能名（左邊有技能圖示可認）
      msg = [nm + ' Lv' + s.lv + ' ' + ch, nm + ' Lv' + s.lv + ' ' + val, nm + ' ' + val, ch].find(fit) || val;
    }

  // 自動配點（鍵盤 U 或示範）：大招 > 主動 > 被動

    const order = [h.skills[h.skills.length - 1], ...h.skills.slice(0, -1), ...h.pskills].filter(Boolean).sort((a, b) => a.lv - b.lv);

});

// ---------- 技能數值表（戰鬥資訊卡與隊伍頁共用）----------
// 回傳 [{k: 標籤, f: lv => 顯示字串}]
G.skillRows = function (sd) {
  const rows = [], V = lv => G.skillVal(sd, lv), w = G.WEAPONS_BY_ID[sd.weapon_id] || {};
  // u：單位（表格放不下時可移到標籤上，例如「冷卻(秒)」）；g：不含單位的數值
  const add = (k, g, u = '', ul = u) => rows.push({ k, u: ul, g, f: lv => String(g(lv)) + u });
  if (!sd.active) {
    const v = lv => V(lv).v1;
    const P = {
      hp_sec: ['HP 回復', lv => '+' + v(lv), '/秒', '每秒'], mp_sec: ['MP 回復', lv => '+' + (v(lv) / 10), '/秒', '每秒'],
      delay: ['攻擊間隔', lv => v(lv), 'ms'], speed: ['跑速', lv => '+' + v(lv)], critical: ['爆擊率', lv => '+' + v(lv), '%'],
      range: ['射程', lv => '+' + v(lv)], return: ['吸血', lv => v(lv), '%'], mp_discount: ['MP 消耗', lv => '−' + v(lv), '%'],
      power: [sd.type === 'multi_buff' ? '攻擊（含周圍友軍）' : '攻擊力', lv => '+' + v(lv)], armor: [sd.type === 'multi_buff' ? '防禦（含周圍友軍）' : '防禦', lv => '+' + v(lv)]
    }[sd.attribute];
    if (P) add(P[0], P[1], P[2] || '', P[3] || P[2] || '');
    return rows;
  }
  if (sd.type === 'buff') {
    if (sd.attribute === 'armor_per') add('減傷', lv => V(lv).v1, '%');
    else if (sd.attribute === 'berserker' || sd.attribute === 'berserker2') { add('攻擊', lv => '×' + G.rageOf(lv).pow); if (sd.attribute === 'berserker2') add('攻速', lv => '+' + G.rageOf(lv).spd + '%'); add('防禦', lv => '×' + G.rageOf(lv).arm); }
    else if (sd.attribute === 'weapon') add('放電傷害', lv => V(lv).v1);
    add('持續', lv => V(lv).v2, '秒');
  } else {
    add('傷害', lv => V(lv).v1);
    const v2 = lv => V(lv).v2;
    if (w.type === '2d_drop') add('範圍', lv => v2(lv) || 60);
    else if (w.type === 'line') add('連擊', lv => Math.max(1, v2(lv)), '次');
    else if (w.type === 'effect' && w.attack_type === 'round' && w.attribute === 'stun') add('暈眩', lv => Math.max(0.6, v2(lv)), '秒');
    else if (w.type === 'effect' && w.attack_type === 'splash') add('範圍', lv => v2(lv) || 50);
    else if (w.attack_type === 'jump') add('彈跳', lv => Math.max(1, v2(lv)), '次');
    else if (w.attribute === 'slow' && sd.value_2) add('減速', lv => v2(lv), '秒');
    else if (w.attack_type === 'splash' && sd.value_2) add('範圍', lv => v2(lv));
  }
  add('冷卻', lv => V(lv).cd, '秒');
  add('MP', lv => V(lv).mp);
  return rows;
};

// ===== 08_render.js =====
'use strict';
/* =========================================================
   繪製：低解析像素緩衝 → 整數放大 + 次像素平移（鏡頭平滑）
   ========================================================= */
G.Render = (() => {
  const R = {
    cam: { x: 0, y: 0, zoom: 1, follow: true, vx: 0, vy: 0 },
    scale: 4, uiS: 3, sw: 0, sh: 0, dpr: 1, ox: 0, oy: 0, fx: 0, fy: 0
  };
  let cv, ctx, buf, bctx, ui, uctx, vign;

  R.init = function (canvas) {
    cv = canvas; ctx = cv.getContext('2d', { alpha: false });
    buf = G.canvas(8, 8); bctx = buf.getContext('2d');
    ui = G.canvas(8, 8); uctx = ui.getContext('2d');
    R.uctx = uctx;
    R.resize();
  };
  // 固定畫面比例：橫屏固定 320×180（16:9）、直屏寬固定 180（高 320~400）；
  // 視窗多出來的部分留黑邊，不論視窗多大，畫面內所有物件的比例都一樣
  R.resize = function () {
    R.dpr = Math.min(window.devicePixelRatio || 1, 3);

G.Ach = (() => {
  const A = {};
  const ADD = ['kills', 'deaths', 'assists', 'camps', 'towers', 'gold', 'time', 'bosses', 'hunters', 'wboss', 'potions'];
  const BEST = ['streak', 'towers', 'gold', 'assists', 'level', 'wboss', 'follow', 'potions', 'bag'];
  A.recent = [];                                     // 本場新達成（結算畫面用）
  A.banner = null;                                   // 選單畫面的成就通知
  // 檔案：缺的欄位自動補上（舊存檔相容）
  A.P = () => {
    const v = G.Team.get();
    if (!v.p) v.p = {};
    const p = v.p;
    for (const k of [...ADD, 'games', 'wins', 'chests', 'gamble5', 'codes', 'night']) if (typeof p[k] !== 'number') p[k] = 0;
    for (const k of ['guide', 'book', 'demo']) if (!Array.isArray(p[k])) p[k] = [];
    if (!p.best) p.best = {}; for (const k of BEST) if (typeof p.best[k] !== 'number') p.best[k] = 0;
    if (!v.ach) v.ach = {};
    return p;
  };
  A.off = () => G.Team.dev;
  A.goal = a => typeof a.g === 'function' ? a.g() : a.g;
  A.state = id => (G.Team.get().ach || {})[id] || 0;          // 0 未達成、1 達成未領取、2 已領取
  A.doneCount = except => G.ACH.filter(a => a.id !== except && A.state(a.id) > 0).length;
  A.unclaimed = () => G.ACH.filter(a => A.state(a.id) === 1).length;
  A.value = (a, M) => { const P = A.P(); return a.v(P, P.best, M) || 0; };
  A.guideTotal = () => (G.Menus && G.Menus.guidePageCount ? G.Menus.guidePageCount() : 50);
  A.bookTotal = () => new Set([...G.ROSTER.bosses, ...G.ROSTER.smalls, ...G.ROSTER.towers, ...Object.keys(G.WILD).map(k => G.WILD[k].unit), ...G.ROSTER.hunters]).size;
  // 檢查所有未達成的成就（M＝本場打完的情境）
  A.check = (M, W) => {
    if (A.off()) return;
    const v = G.Team.get(); A.P(); let any = false;
    for (let pass = 0; pass < 2; pass++)            // 第二輪：讓「完成 15 個成就」能在同一次檢查中達成
      for (const a of G.ACH) {
        if (v.ach[a.id]) continue;
        if (A.value(a, M) >= A.goal(a)) { v.ach[a.id] = 1; any = true; A.recent.push(a.id); A.notify(a, W); if (G.SaveUI) G.SaveUI.bump(); }
      }
    if (any) G.Team.save();
  };
  A.notify = (a, W) => {
    G.Audio.play('level');
    if (W && !W.attract && G.UI.screen === 'battle') W.say({ s: '成就達成：' + a.n, ic: 'i_trophy', col: 13, t: 2.8 });
    else A.banner = { a, t: 0 };
  };
  A.claim = id => {
    const v = G.Team.get(); if (v.ach[id] !== 1) return 0;
    const k = G.ACH_TIER[G.ACH_BY[id].t].k; v.ach[id] = 2; G.Team.addKeys(k); G.Team.save(); return k;
  };
  // 其他畫面的事件：開寶箱、看教學、看圖鑑、技能展示、產生存檔碼
  A.on = (ev, x) => {
    if (A.off()) return;
    const P = A.P();
    if (ev === 'chest') { P.chests++; if (x && x.keys === 5) P.gamble5++; }
    else if (ev === 'guide' || ev === 'book' || ev === 'demo') { if (P[ev].includes(x)) return; P[ev].push(x); }
    else if (ev === 'code') { P.codes++; const v = G.Team.get(); v.bk = { n: 0, t: Date.now() }; }
    G.Team.save(); A.check(null, null);
  };
  // ----- 戰鬥中 -----
  A.begin = W => { W._cm = {}; for (const k of ADD) W._cm[k] = 0; W._achT = 0; A.recent = []; };
  A.commit = W => {
    if (A.off() || !W || W.attract || !W._cm) return;
    const P = A.P(), st = W.stats;
    for (const k of ADD) { const d = (st[k] || 0) - W._cm[k]; if (d) { P[k] += d; W._cm[k] = st[k] || 0; } }
    const live = { streak: st.streak, towers: st.towers, gold: st.gold, assists: st.assists, level: W.hero ? W.hero.level : 0, wboss: st.wboss, follow: st.maxFollow, potions: st.potions, bag: W.bag.length };
    for (const k of BEST) P.best[k] = Math.max(P.best[k], live[k] || 0);
    G.Team.save();
  };
  A.tick = (W, dt) => {
    if (A.off() || W.attract || !W.hero || W._fin) return;
    const ho = W.holy[0]; if (ho && ho.st) W.stats.minHoly = Math.min(W.stats.minHoly, Math.max(0, ho.hp / ho.st.hp));
    W._achT += dt; if (W._achT < 2) return; W._achT = 0;
    A.commit(W); A.check(null, W);
  };
  A.final = W => {
    if (W._fin || W.attract) return; W._fin = true;
    if (A.off()) return;
    A.commit(W);
    const P = A.P(), win = !!W.over.win; P.games++; if (win) P.wins++;
    const hr = new Date().getHours(); if (hr < 5) P.night++;
    G.Team.save();
    A.check({ win, st: W.stats, pts: W.loadPts }, W);
  };
  return A;
})();

'use strict';
/* =========================================================
   存檔碼：把所有進度（角色、鑰匙、隊伍、成就、累計數據、名稱）打包成一串文字
   格式：LW1Z-<base64url(deflate(JSON))>-<4 碼檢查碼>（瀏覽器不支援壓縮時用 LW1P，不壓縮）
   ========================================================= */
G.SaveCode = (() => {
  const S = {};
  const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const s = atob(str), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; };
  const sum = str => { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return (h % 1679616).toString(36).toUpperCase().padStart(4, '0'); };
  const pipe = async (bytes, Stream, fmt) => { const s = new Blob([bytes]).stream().pipeThrough(new Stream(fmt)); return new Uint8Array(await new Response(s).arrayBuffer()); };
  S.make = async () => {
    const v = G.Team.get(); G.Ach.P();
    const json = JSON.stringify({ s: 1, v: { name: v.name || '', hero: v.hero, loadout: v.loadout, owned: v.owned, keys: v.keys, p: v.p, ach: v.ach } });
    let raw = new TextEncoder().encode(json), mode = 'P';
    try { if (window.CompressionStream) { raw = await pipe(raw, CompressionStream, 'deflate-raw'); mode = 'Z'; } } catch (e) { mode = 'P'; raw = new TextEncoder().encode(json); }
    const body = b64u(raw);
    return 'LW1' + mode + '-' + body + '-' + sum(body);
  };
  // 讀取：回傳 { ok, v } 或 { ok:false, err }
  S.read = async code => {
    const s = String(code || '').replace(/\s+/g, '');
    if (!s) return { ok: false, err: '請先貼上存檔碼' };
    const m = /^LW1([ZP])-([A-Za-z0-9_-]+)-([0-9A-Z]{4})$/.exec(s);
    if (!m) return { ok: false, err: '這不是 Leaf of Legends 的存檔碼' };
    if (sum(m[2]) !== m[3]) return { ok: false, err: '存檔碼不完整，請確認有完整複製' };
    try {
      let bytes = unb64u(m[2]);
      if (m[1] === 'Z') { if (!window.DecompressionStream) return { ok: false, err: '這個瀏覽器無法讀取壓縮存檔' }; bytes = await pipe(bytes, DecompressionStream, 'deflate-raw'); }
      const d = JSON.parse(new TextDecoder().decode(bytes));
      const v = S.clean(d && d.v); if (!v) return { ok: false, err: '存檔內容有誤' };
      return { ok: true, v };
    } catch (e) { return { ok: false, err: '存檔碼損毀，無法讀取' }; }
  };
  // 檢查並整理資料（不存在的角色、異常數值一律剔除）
  S.clean = v => {
    if (!v || typeof v !== 'object' || !v.owned) return null;

// ===== 15_intro.js =====
'use strict';
/* =========================================================
   開場動畫（約 2.8 秒，右下可跳過）
   0.0 一片葉子從天而降 → 0.7 落地發光、地面向兩側長出 → 1.0 英雄冒出來
   → 1.3 我方小兵從左跑來、敵人從右逼近 → 2.1 衝鋒對撞 → 2.35 白光 → 標題畫面
   ========================================================= */
G.Intro = (() => {
  const I = { t: 0, flash: 0 }, P = G.PAL, R = G.Render, H = () => G.UI.h;
  const END = 2.45, ss = t => t * t * (3 - 2 * t), seg = (t, a, b) => G.clamp((t - a) / (b - a), 0, 1);
  let parts = [], snd = {};
  const once = (k, name) => { if (!snd[k]) { snd[k] = 1; G.Audio.play(name); } };
  I.reset = () => { I.t = 0; parts = []; snd = {}; I.tw = -1; I.st = -1; I.from = null; };
  I.skip = () => {
    if (G.UI.screen !== 'intro' && G.UI.screen !== 'tap') return;
    G.UI.screen = 'menu'; G.Menus.resetIntro(); I.flash = 0.35;
    const nm = G.Team.get().name; if (nm && G.SaveUI) G.SaveUI.greet = { t: 0, name: nm };
  };
  function spr(name, x, by, k, face, frame, dark) {
    const fr = G.SPR[G.VIS[name].spr], f = fr[frame % fr.length], img0 = face < 0 ? f.m : f.n, img = k > 1 ? G.scaled(img0, k) : img0;
    const fly = G.VIS[name].fly ? 8 * k : 0, x0 = Math.round(x - img.width / 2), y0 = Math.round(by - img.height - fly);
    G.pxDisc(R.uctx, x, by, img.width * 0.32, 2 + k, 0, 0.5);
    if (dark) { const gl = G.glowOf(img, 10, 1, 2); R.uctx.globalAlpha = 0.55 + Math.sin(I.t * 9) * 0.2; R.uctx.drawImage(gl.c, x0 - gl.p, y0 - gl.p); R.uctx.globalAlpha = 1; }   // 敵人：紅色外光
    R.uctx.drawImage(img, x0, y0);
    if (dark) { const c = R.uctx; c.globalAlpha = dark; c.drawImage(G.scaled(G.glowOf(img0, 0, 1, 2).tint, k), x0, y0); c.globalAlpha = 1; }
  }
  I.draw = c => {
    const dt = Math.min(0.05, G.Menus.dt || 1 / 60);
    G.Menus.ui.tick(); I.t += G.Menus.dt || dt;
    const t = I.t, uw = R.uw, uh = R.uh, cx = Math.round(uw / 2), gy = Math.round(uh * 0.6), Ins = R.ins;
    // 震動
    const shk = t > 2.3 && t < 2.45 ? Math.round((Math.random() - 0.5) * 6) : 0;
    c.fillStyle = P[0]; c.fillRect(0, 0, uw, uh);
    c.save(); c.translate(shk, 0);
    // 地面：從中間往兩側長出
    const gk = ss(seg(t, 0.7, 1.25));
    if (gk > 0) {
      const gw = Math.round(uw * gk), gh = 26, strip = G.groundStrip(uw, gh * 2);
      c.save(); c.beginPath(); c.rect(Math.round(cx - gw / 2), 0, gw, uh); c.clip();
      c.drawImage(strip, 0, gh, uw, gh, Math.round(cx - gw / 2), gy - 6, gw, gh);
      G.stageDeco(c, 0, gy - 16, uw, gh, true);                     // 地面上緣一排樹（森林背景）
      c.restore();
      c.fillStyle = P[0]; for (let k = 0; k < 6; k++) { c.globalAlpha = 0.5 - k * 0.08; c.fillRect(Math.round(cx - gw / 2), gy - 6 + gh - 6 + k, gw, 1); } c.globalAlpha = 1;
      // 草叢
      c.fillStyle = P[6];
      for (let i = 0; i < 22; i++) { const gx = Math.round(cx + (G.hash(i, 3) - 0.5) * uw), gyy = gy - 4 + Math.round(G.hash(i, 7) * 14); if (Math.abs(gx - cx) > gw / 2) continue; c.fillRect(gx, gyy, 1, 2); c.fillRect(gx - 1, gyy + 1, 1, 1); c.fillRect(gx + 1, gyy + 1, 1, 1); }
    }
    // 落葉時：一路灑下柔和的鈴聲光點；小兵跑步時：輕輕的腳步聲
    if (t < 0.68) { const k = (t / 0.085) | 0; if (k !== I.tw) { I.tw = k; G.Audio.play('opTwinkle', 1, 0.05); } }
    if (t > 1.3 && t < 2.05) { const k = (t / 0.14) | 0; if (k !== I.st) { I.st = k; G.Audio.play('opStep', 1, 0.05); } }
    // A：落葉
    if (t < 0.75) {
      const fr0 = I.from || [cx, -12], k = ss(seg(t, 0, 0.7)), lx = G.lerp(fr0[0], cx, k) + Math.sin(t * 9) * 14 * (1 - k) * (I.from ? 0.5 : 1), ly = G.lerp(fr0[1], gy - 4, k);
      const lf = G.scaled(G.SPR.leaf_pt.n, 3), gl = G.glowOf(lf, 11, 1, 3); c.globalAlpha = 0.6 + Math.sin(t * 20) * 0.2; c.drawImage(gl.c, Math.round(lx - lf.width / 2) - gl.p, Math.round(ly - lf.height / 2) - gl.p); c.globalAlpha = 1; c.drawImage(lf, Math.round(lx - lf.width / 2), Math.round(ly - lf.height / 2));
      if (Math.random() < 0.6) parts.push({ x: lx + G.rr(-3, 3), y: ly, vx: G.rr(-8, 8), vy: G.rr(-6, 6), l: 0.5, c: G.pick([11, 16, 13]) });
    }
    if (t >= 0.7) { once('land', 'opLand'); once('swell', 'opSwell'); }
    // 落地光圈
    { const k = seg(t, 0.7, 1.1); if (k > 0 && k < 1) { const r = Math.round(4 + k * 50); G.pxEllipse(c, cx, gy, r, Math.round(r * 0.32), k < 0.5 ? 13 : 11); } }
    // B：嫩芽 → 英雄冒出
    const T = G.Team.get(), hero = G.HEROES[T.hero].name;
    if (t > 0.85 && t < 1.05) { const h = Math.round(seg(t, 0.85, 1.05) * 9); c.fillStyle = P[11]; c.fillRect(cx, gy - h, 1, h); c.fillRect(cx - 2, gy - h, 2, 1); c.fillRect(cx + 1, gy - h + 1, 2, 1); }
    // 隊伍（我方從左、敵方從右）
    const allies = (T.loadout.length ? [...new Set(T.loadout.map(e => e.n))] : G.STAGES[0].loadout).slice(0, 2), foes = [G.ROSTER.smalls[0], G.ROSTER.smalls[1] || G.ROSTER.smalls[0], G.ROSTER.bosses[0]];
    const run = ss(seg(t, 1.25, 2.0)), dash = ss(seg(t, 2.05, 2.32)), fr = (t * 8) | 0;
    const K = uw >= 300 ? 2 : 1, sp = K * 16;
    // 聚光燈（英雄登場後）
    if (t > 1.0) { const a = Math.min(1, (t - 1.0) / 0.3) * (t > 2.28 ? 0 : 1); c.fillStyle = P[9]; for (let y = 0; y < gy; y += 2) { const hw = Math.round(6 + y / gy * 30 * K); c.globalAlpha = a * (0.02 + y / gy * 0.07); c.fillRect(cx - 6 - hw, y, hw * 2 + 12, 2); } c.globalAlpha = a * 0.35; G.pxDisc(c, cx - 6, gy + 2, 26 * K, 6 * K, 9, 0.12); c.globalAlpha = 1; }
    allies.forEach((n, i) => { const x0 = -20 - i * sp * 1.4, x1 = cx - sp * 2.4 - i * sp * 1.5, x = G.lerp(x0, x1, run) + dash * 20; if (t > 1.25) { spr(n, x, gy + 3 + i * 4, K, 1, run < 1 || dash > 0 ? fr : 0); if (run < 1 && fr % 2) parts.push({ x: x - 6, y: gy + 3 + i * 4, vx: -20, vy: -8, l: 0.3, c: 5 }); } });
    foes.forEach((n, i) => { const big = i === 2, x0 = uw + 20 + i * sp * 1.5, x1 = cx + sp * 2.2 + i * sp * (big ? 1.4 : 1.15), x = G.lerp(x0, x1, run) - dash * (big ? 12 : 20); if (t > 1.25) { spr(n, x, gy + (big ? 0 : 3 + i * 4), K, -1, run < 1 || dash > 0 ? fr : 0, 0.15); if (run < 1 && fr % 2) parts.push({ x: x + 6, y: gy + 3, vx: 20, vy: -8, l: 0.3, c: 4 }); } });
    if (t > 1.05) {
      const pop = seg(t, 1.05, 1.25), sq = pop < 1 ? Math.round(Math.sin(pop * Math.PI) * 6) : 0;
      once('pop', 'opPop');
      spr(hero, cx - 6 + dash * 14, gy + 2 - sq, K + 1, 1, t > 1.3 ? fr : 0);
    }
    // D：對撞白光＋星芒
    if (t > 2.28) {
      once('hit', 'opClash');
      const k = seg(t, 2.28, 2.45), r = Math.round(6 + k * 60);
      c.fillStyle = P[9];
      for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4, l = r * (a % 2 ? 0.6 : 1); G.pxLine(c, cx + 8, gy - 14, cx + 8 + Math.cos(ang) * l, gy - 14 + Math.sin(ang) * l * 0.7, a % 2 ? 1 : 2); }
      c.globalAlpha = Math.min(1, k * 1.6); c.fillRect(0, 0, uw, uh); c.globalAlpha = 1;
    }
    // 粒子
    for (const p of parts) { p.l -= dt; if (p.l <= 0) continue; p.x += p.vx * dt; p.y += p.vy * dt; c.fillStyle = P[p.c]; c.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
    parts = parts.filter(p => p.l > 0);
    c.restore();
    // 跳過（右下）
    const bw = G.cnW('跳過') + 22, bx = uw - Ins.r - bw - 2, by = uh - Ins.b - 18, o = G.Menus.ui.pr('skip') ? 1 : 0;
    H().box(c, bx, by + o, bw, 16, o ? 3 : 1, 6);
    G.cn(c, '跳過', bx + 5, by + 2 + o, 8); H().icon(c, 'i_skip', bx + bw - 9, by + 8 + o);
    G.Menus.ui.tap('skip', bx, by, bw, 16, () => I.skip());
    if (t >= END) I.skip();
  };
  // 標題畫面一開始的白光淡出
  I.drawFlash = c => { if (I.flash <= 0) return; I.flash -= G.Menus.dt || 1 / 60; c.fillStyle = P[9]; c.globalAlpha = G.clamp(I.flash / 0.35, 0, 1); c.fillRect(0, 0, R.uw, R.uh); c.globalAlpha = 1; };
  return I;
})();
G.Menus.intro = c => G.Intro.draw(c);
// ---------- 「點一下開始」：瀏覽器規定第一次點擊前不能出聲，所以先用這一下解鎖聲音，開場動畫才有完整音效 ----------
// 葉子停在畫面上方輕輕飄、發光；點一下（或按任意鍵）→ 解鎖聲音 → 葉子直接接到開場動畫裡落下
G.Intro.tapT = 0;
G.Intro.start = () => { const f = G.Intro.from; G.Audio.init(); G.Audio.musicPrime('menu'); G.Intro.reset(); G.Intro.from = f; G.UI.screen = 'intro'; };   // 葉子從「點一下開始」畫面的位置接著落下
G.Menus.tap = c => {
  const M = G.Menus.ui, R = G.Render, P = G.PAL, uw = R.uw, uh = R.uh;
  M.tick(); const t = (G.Intro.tapT += G.Menus.dt || 0.016);
  if (G.Audio.running()) { G.Intro.start(); return; }   // 已允許出聲（例如常玩的網站）→ 直接開演
  c.fillStyle = P[0]; c.fillRect(0, 0, uw, uh);
  const a = Math.min(1, t / 0.6), cx = Math.round(uw / 2), ly = Math.round(uh * 0.3 + Math.sin(t * 1.6) * 3);   // 葉子：開場動畫從這個位置接著落下
  const lf = G.scaled(G.SPR.leaf_pt.n, 3), gl = G.glowOf(lf, 11, 1, 3), lx = Math.round(cx + Math.sin(t * 1.1) * 6);
  G.Intro.from = [lx, ly];
  c.globalAlpha = a * (0.75 + Math.sin(t * 3) * 0.25); c.drawImage(gl.c, lx - lf.width / 2 - gl.p, ly - lf.height / 2 - gl.p);
  c.globalAlpha = a; c.drawImage(lf, lx - lf.width / 2, ly - lf.height / 2);
  // 光點：慢慢往上飄
  for (let i = 0; i < 10; i++) { const k = (t * 0.25 + i / 10) % 1, x = cx + Math.sin(i * 2.3 + t * 0.7) * uw * 0.32, y = uh * (0.95 - k * 0.8); c.globalAlpha = a * Math.sin(k * Math.PI) * 0.7; c.fillStyle = P[i % 3 ? 11 : 13]; c.fillRect(Math.round(x), Math.round(y), 1, 1); }
  const desk = !matchMedia('(pointer: coarse)').matches, lab = desk ? '點一下或按任意鍵開始' : '點一下開始';
  c.globalAlpha = a * (0.8 + Math.sin(t * 2.6) * 0.2); G.cn(c, lab, cx, Math.round(uh * 0.62), 9, 0.5);
  c.globalAlpha = a * 0.8; G.cn(c, '建議開啟聲音', cx, Math.round(uh * 0.62) + 18, 6, 0.5); c.globalAlpha = 1;
  G.UI.h.btn('tapStart', 0, 0, uw, uh, null, () => G.Intro.start());

// ===== 99_main.js =====
'use strict';
/* =========================================================
   主迴圈：固定 60Hz 邏輯 + 插值繪製（高刷新率螢幕也順）
   ========================================================= */
G.newWorld = function (opt) {
  G.W = new G.World(opt);
  const R = G.Render;
  if (G.W.hero) { R.cam.x = G.W.hero.x; R.cam.y = G.W.hero.y; }
  else { R.cam.x = G.W.M.ww / 2; R.cam.y = G.W.M.wh / 2; }
  R.cam.follow = true;
};

G.boot = function () {
  const cv = document.getElementById('game');
  G.buildSprites(); G.buildBestiary();
  G.Render.init(cv);
  G.UI.bind(cv);
  addEventListener('resize', () => G.Render.resize());
  G.UI.goTitle(); G.UI.screen = 'tap'; G.Intro.reset(); G.Audio.init();   // 點一下開始（解鎖聲音）→ 開場動畫 → 標題
  const STEP = 1 / 60;
  let last = performance.now(), acc = 0, fpsT = 0, fpsN = 0;
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1; if (dt < 0) dt = 0;
    fpsT += dt; fpsN++; if (fpsT >= 0.5) { G.UI.fps = fpsN / fpsT; fpsT = 0; fpsN = 0; }
    const W = G.W, U = G.UI;
    if (!U.paused && !(G.Menus && G.Menus.covers(U.screen))) {
      W.keyDir = U.screen === 'battle' ? U.keyDir() : null;
      if (W.keyDir) G.Render.cam.follow = true;
      acc += dt;
      let n = 0;
      while (acc >= STEP && n < 6) { W.update(STEP); acc -= STEP; n++; }
      if (n >= 6) acc = 0;
    }
    G.Render.updateCam(W, dt);
    if (!(G.Menus && G.Menus.covers(U.screen))) G.Render.draw(W, U.paused ? 1 : acc / STEP, now / 1000);
    // 背景音樂：依目前畫面選曲（開場動畫無音樂；多人、存檔、教學沿用首頁曲；從戰鬥暫停打開教學則維持戰場曲；結算時戰場曲降低音量）
    { const sc = U.screen, M = sc === 'intro' || sc === 'tap' ? null : sc === 'battle' ? 'battle' : (sc === 'team' || sc === 'book') ? 'team' : sc === 'store' ? 'shop' : sc === 'ach' ? 'ach' : sc === 'guide' && U.guideBack ? 'battle' : 'menu';
      G.Audio.music(M, sc === 'battle' && W.over ? 0.45 : 1); G.Audio.musicUpdate(dt); }
    U.draw(dt);
    G.Render.blitUI();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
};
window.addEventListener('load', async () => {
  // 載入中文像素字（俐方體11號，已依使用到的字做子集化）
  try { if (G.FONT_DATA) { const ff = new FontFace('Cubic11', 'url(data:font/woff2;base64,' + G.FONT_DATA + ')'); await ff.load(); document.fonts.add(ff); } } catch (e) { console.warn('font', e); }
  try { G.boot(); }
  catch (e) { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#fff;position:fixed;top:0;left:0;padding:12px;white-space:pre-wrap">' + e.stack + '</pre>'); throw e; }
});
