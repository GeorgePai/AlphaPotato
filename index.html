'use strict';
/* =========================================================
   Leaf of Legends（原名 LEAF WAR）— core: 命名空間、調色盤、工具、像素精靈、字型
   ========================================================= */
const G = window.G = {}; G.FONT_DATA = window.G_FONT; G.FONT_DATA = window.G_FONT;

// 10 階灰：0 最黑 → 9 最白（全遊戲只用這組顏色）
G.PAL = ['#0a0a0a', '#1a1a1a', '#2b2b2b', '#3f3f3f', '#575757', '#737373', '#959595', '#bcbcbc', '#e0e0e0', '#ffffff',
  // 點綴色（10 紅 HP / 11 綠 MP / 12 藍 BOSS / 13 黃 指示/升級 / 14 橘 爆擊 / 15 深紅 / 16 深綠）
  '#ec4a3f', '#43c466', '#4a8ff5', '#f7d23c', '#f68a2c', '#7c211b', '#1f6a35', '#a35cf0',
  // 介面專用（數值條）：18 青 攻速 / 19 粉 爆擊 / 20 黃綠 移速
  '#3fc6d6', '#ec64a6', '#a8d94a',
  // 21 米色：經驗值
  '#d9c08c'];
// 色票加亮（k>0，往白）／加暗（k<0，往黑），結果快取
G._tint = {};
G.tint = (i, k) => { const key = i + ':' + k; let v = G._tint[key]; if (v) return v; const c = G.PAL_RGB[i] || [128, 128, 128], t = k > 0 ? 255 : 0, a = Math.abs(k); v = 'rgb(' + c.map(q => Math.round(q + (t - q) * a)).join(',') + ')'; G._tint[key] = v; return v; };
G.PAL_RGB = G.PAL.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);

// 世界座標：原著 1 格 = 32 單位；美術 1px = 2 單位；Y 軸壓縮 0.75 做出斜俯視
G.TILE = 32;
G.AX = 0.5;          // world → art x
G.AY = 0.375;        // world → art y（0.5 * 0.75）

  m.lanes.forEach(l => l.pts = l.pts.map(f));
  m.clear = m.clear.map(c => [...f(c), c[2]]);
  return m;
};

// 大地圖（80×60，點對稱）：中央河道（楚河漢界）+ 野區（6 營小怪 + 2 野生首領）
G.MAPS.lanes4 = (() => {
  const W = 80, H = 60, mir = p => [+(W - p[0]).toFixed(2), +(H - p[1]).toFixed(2)], mp = a => a.map(mir);
  const k = 1.25, sc = a => a.map(p => [+(p[0] * k).toFixed(2), +(p[1] * k).toFixed(2)]);
  const top = sc([[7, 41], [6.5, 33], [6.5, 14], [9, 8], [16, 6.5], [48, 6.5], [57, 7]]);

    clear: [[...top[0], 7.75], [...mir(top[0]), 7.75], [40, 30, 5], ...wild.map(([k2, p]) => [...p, k2 === 'frost' || k2 === 'blaze' ? 3.8 : 2.7])]

// 更大的地圖（104×78，點對稱）：每路 3 層外塔＋基地主塔；野怪住在森林裡的「凹槽營地」，野生首領在河道旁的坑
G.MAPS.lanes5 = (() => {
  const W = 104, H = 78, mir = p => [+(W - p[0]).toFixed(2), +(H - p[1]).toFixed(2)], mp = a => a.map(mir);
  const k = 1.3, sc = a => a.map(p => [+(p[0] * k).toFixed(2), +(p[1] * k).toFixed(2)]);
  const top = sc([[8.75, 51.25], [8.12, 41.25], [8.12, 17.5], [11.25, 10], [20, 8.12], [60, 8.12], [71.25, 8.75]]);
  const mid = sc([[8.75, 51.25], [17.5, 44.4], [30, 36.9], [40, 30], [50, 23.1], [62.5, 15.6], [71.25, 8.75]]);
  const bot = mp(top).reverse();
  const LW = 1.5;                                    // v2.4 道路加寬 1.5 倍
  const lanes = [{ r: 2.2 * LW, pts: top }, { r: 2.4 * LW, pts: mid }, { r: 2.2 * LW, pts: bot }];
  // 我方野區小徑（敵方點對稱）
  const jp = [
    [[10.6, 44], [22, 44], [30, 53]],                 // 西野區：上路 → 中路
    [[22, 44], [27, 36.5], [32.5, 28.4]],             // 西野區 → 河道
    [[44.5, 44.4], [48, 57], [62, 57], [70, 48.6]],   // 南野區：中路 → 下路側 → 河道
    [[55, 57], [55, 67.4]]                            // 南野區 → 下路
  ];
  const paths = []; for (const a of jp) { paths.push({ r: 1.5 * LW, pts: a }); paths.push({ r: 1.5 * LW, pts: mp(a) }); }
  // 凹槽營地：營地中心 + 一條窄入口（接到小徑或河道）
  const pockets = [
    { k: 'red', c: [18, 51.5], r: 3.1, e: [18, 44] },
    { k: 'exp', c: [34, 40.5], r: 3.0, e: [27, 36.5] },
    { k: 'blue', c: [56, 49.5], r: 3.1, e: [56, 57] },
    { k: 'frost', c: [20.6, 30.6], r: 3.9, e: [24.2, 24.4], w: 2.0 }   // 河道旁的首領坑（入口較寬）
  ];
  const wild = [], necks = [], clears = [];
  for (const q of pockets) {
    const isB = q.k === 'frost';
    [[q.c, q.e, q.k], [mir(q.c), mir(q.e), isB ? 'blaze' : q.k]].forEach(([c, e, key]) => { wild.push([key, c]); necks.push({ r: q.w || 1.25, pts: [e, c] }); clears.push([...c, q.r]); });
  }
  // 塔：沿每條路從我方聖所量距離，在半路的 30% / 58% / 86% 放內／中／外塔；主塔在聖所前方
  const along = (pts, d) => { for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (d <= L) return [+(a[0] + (b[0] - a[0]) * d / L).toFixed(2), +(a[1] + (b[1] - a[1]) * d / L).toFixed(2)]; d -= L; } return pts[pts.length - 1]; };
  const len = pts => pts.slice(1).reduce((s2, p, i) => s2 + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
  const pt = [];
  [top, mid, bot].forEach((pts, lane) => { const half = len(pts) / 2; [[0.86, 0], [0.58, 1], [0.3, 2]].forEach(([f, tier]) => pt.push([along(pts, half * f), lane, tier])); });
  const hp = top[0], cdir = [W / 2 - hp[0], H / 2 - hp[1]], cl = Math.hypot(...cdir);
  pt.push([[+(hp[0] + cdir[0] / cl * 6.5).toFixed(2), +(hp[1] + cdir[1] / cl * 6.5).toFixed(2)], 1, 9]);      // tier 9 = 主塔
  const et = pt.map(([p, lane, tier]) => [mir(p), tier === 9 ? 1 : 2 - lane, tier]);
  return {
    w: W, h: H, seed: 23,
    holy: { player: hp, enemy: mir(hp) },
    towers3: { player: pt, enemy: et },
    bossHome: mir([16, 60]),
    lanes: lanes.concat(paths, necks),
    laneCount: 3,
    river: { r: 2.8, pts: [[0, 11.7], [18.2, 20.8], [35.1, 29.9], [52, 39], [68.9, 48.1], [85.8, 57.2], [104, 66.3]] },
    wild,
    clear: [[...hp, 9.5], [...mir(hp), 9.5], [52, 39, 6], ...clears]
  };
})();

// 程序化精靈的畫筆：把陰影球體畫進網格
G.paintBlob = function (grid, w, h, circles, levels, opt = {}) {
  const L = [-0.55, -0.7, 0.55], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let best = -9, bn = null;
    for (const c of circles) {
      const dx = (x + 0.5 - c[0]) / c[2], dy = (y + 0.5 - c[1]) / (c[3] || c[2]);
      const r2 = dx * dx + dy * dy; if (r2 > 1) continue;
      const hz = Math.sqrt(1 - r2) + (c[4] || 0);
      if (hz > best) { best = hz; bn = [dx, dy, Math.sqrt(1 - r2)]; }
    }
    if (!bn) continue;
    let b = bn[0] * L[0] + bn[1] * L[1] + bn[2] * L[2];
    b = G.clamp((b + 0.35) / 1.35, 0, 1);
    if (opt.noise) b += (G.hash(x * 7 + (opt.seed || 0), y * 13) - 0.5) * opt.noise;
    const t = G.clamp(b * (levels.length - 1) + (G.bayer(x, y) - 0.5), 0, levels.length - 1);
    grid[y * w + x] = levels[Math.round(t)];
  }
};
G.paintRect = (grid, w, x0, y0, x1, y1, fn) => { for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) grid[y * w + x] = fn(x, y); };

G.buildSprites = function () {
  const S = G.SPR;
  // 角色：身體 + 腳（走路影格）
  for (const k in G.ART) {
    const a = G.ART[k];
    const bright = ['leafy', 'quickleafy', 'leafblower', 'seedshooter', 'treeprotector'].includes(k);
    if (a.frames) S[k] = a.frames.map(f => G.sprite(f, { outline: a.ol, bright }));
    else S[k] = a.legs.map(l => G.sprite(a.body.concat(l), { outline: a.ol, bright }));
  }
  for (const k in G.ART_SMALL) S[k] = G.sprite(G.ART_SMALL[k], { outline: k.startsWith('i_') || k === 'leaf_pt' ? null : 0 });
  S.icons_dark = {};
  for (const k in G.ART_SMALL) if (k.startsWith('i_')) S.icons_dark[k] = G.sprite(G.ART_SMALL[k].map(r => r.replace(/[5-9a-h]/g, '4')));

  // 秘術光球（技能）
  { const w = 9, h = 9, g = new Int8Array(w * h).fill(-1); G.paintBlob(g, w, h, [[4.5, 4.5, 4.3]], [6, 7, 8, 9, 9]); S.mistic = [G.spriteFromGrid(g, w, h, { outline: 3 })]; }

  // 樹：深灰樹冠（森林邊緣），3 種
  S.trees = [];
  const treeDefs = [
    { w: 22, h: 28, c: [[11, 9, 9, 8], [6, 13, 6], [16, 13, 6], [11, 15, 7, 5]], trunk: [9, 13, 18, 28] },
    { w: 18, h: 30, c: [[9, 7, 5, 6], [9, 12, 7, 6], [9, 18, 8, 6]], trunk: [8, 10, 22, 30] },
    { w: 26, h: 26, c: [[8, 10, 7], [17, 9, 8], [13, 15, 9, 6], [12, 6, 6]], trunk: [11, 15, 19, 26] }
  ];
  treeDefs.forEach((d, i) => {
    const g = new Int8Array(d.w * d.h).fill(-1);
    G.paintRect(g, d.w, d.trunk[0], d.trunk[2], d.trunk[1], d.trunk[3], (x, y) => ((x + y) & 1) ? 1 : 2);
    G.paintBlob(g, d.w, d.h, d.c, [0, 1, 2, 3, 4], { noise: 0.5, seed: i * 31 });
    S.trees.push(G.spriteFromGrid(g, d.w, d.h, { outline: 0 }));
  });
  // 石頭
  S.rocks = [[12, 8, [[6, 4.5, 5.5, 3.6]]], [8, 6, [[4, 3.4, 3.6, 2.6]]], [14, 9, [[5, 5, 4.5, 3.6], [9.5, 5.2, 4, 3.2]]]].map(([w, h, c], i) => {
    const g = new Int8Array(w * h).fill(-1); G.paintBlob(g, w, h, c, [2, 3, 4, 5, 6, 7], { noise: 0.3, seed: i * 9 }); return G.spriteFromGrid(g, w, h, { outline: 1 });
  });

  // 我方聖所：白色聖樹 + 石台
  {
    const w = 44, h = 50, g = new Int8Array(w * h).fill(-1);
    G.paintBlob(g, w, h, [[22, 43, 20, 6]], [3, 4, 5, 6, 7]);                 // 石台
    G.paintBlob(g, w, h, [[22, 41, 15, 4.2, 0.2]], [5, 6, 7, 8]);
    G.paintRect(g, w, 19, 22, 25, 42, (x, y) => (x === 19 ? 6 : x === 24 ? 5 : ((y + x) % 5 === 0 ? 6 : 7)));  // 樹幹
    G.paintRect(g, w, 16, 37, 19, 41, () => 6); G.paintRect(g, w, 25, 37, 28, 41, () => 5);
    G.paintBlob(g, w, h, [[22, 12, 12, 10], [12, 18, 8, 7], [32, 18, 8, 7], [22, 20, 10, 7], [16, 8, 6], [28, 8, 6]], [5, 6, 7, 8, 9, 9], { noise: 0.35, seed: 5 });
    S.pholy = [G.spriteFromGrid(g, w, h, { outline: 0 })];
  }
  // 敵方聖所：黑色巨石祭壇 + 骷髏
  {
    const w = 40, h = 46, g = new Int8Array(w * h).fill(-1);
    G.paintBlob(g, w, h, [[20, 39, 19, 6.5]], [1, 2, 3, 4]);
    for (let y = 2; y < 38; y++) {                       // 菱形尖碑
      const half = y < 18 ? (y - 2) * 0.62 + 2 : 12 - (y - 18) * 0.25;
      for (let x = Math.round(20 - half); x < Math.round(20 + half); x++) {
        const edge = x < 20 - half + 2 ? 3 : x > 20 + half - 3 ? 0 : 1;
        g[y * w + x] = (x < 20 ? (edge === 3 ? 3 : 2) : (edge === 0 ? 0 : 1));
      }
    }
    // 骷髏面
    const sk = ['.666666.', '66666666', '60066006', '60066006', '66666666', '.666666.', '.6.66.6.'];
    sk.forEach((r, yy) => { for (let xx = 0; xx < r.length; xx++) if (r[xx] !== '.') g[(18 + yy) * w + 16 + xx] = +r[xx]; });
    // 尖刺
    for (const [sx, sy] of [[7, 30], [32, 30], [11, 33], [28, 33]]) for (let i = 0; i < 6; i++) { g[(sy - i) * w + sx] = i < 2 ? 2 : 3; if (i < 3) g[(sy - i) * w + sx + 1] = 1; }
    S.eholy = [G.spriteFromGrid(g, w, h, { outline: 4 })];
  }
};

'use strict';
/* =========================================================
   全角色像素圖（程序繪製）
   每個角色一個繪製函式 (P, f)：P 為畫筆，f 為影格 0/1（走路/拍翅）
   全部面向右；敵方深色、我方淺色
   ========================================================= */
G.Painter = (w, h) => {
  const g = new Int8Array(w * h).fill(-1);
  const P = {
    w, h, g,
    px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) g[y * w + x] = c; },

// 外觀表補齊（半徑依圖寬推算）
G.buildBestiary = function () {
  for (const k in G.BESTIARY) {
    const d = G.BESTIARY[k], frames = [];
    for (let f = 0; f < (d.tower ? 1 : 2); f++) {
      const P = G.Painter(d.w, d.h); d.draw(P, f);
      if (d.ol == null && !d.tower) P.shade(1, 2, null);
      frames.push(G.spriteFromGrid(P.g, d.w, d.h, { outline: d.ol != null ? d.ol : (d.tower ? 4 : 0), bright: d.ol === 0 && !d.tower }));
    }
    G.SPR[k] = frames;
  }
  const towerSpr = { player_tower: 'ptower', enemy_tower: 'etower', enemy_tower2: 'etower2', enemy_tower3: 'etower3', enemy_tower4: 'etower4', mushroom_tower: 'mtower' };
  for (const name in towerSpr) if (!G.VIS[name]) G.VIS[name] = { spr: towerSpr[name], r: name === 'enemy_tower4' ? 22 : 16, shadow: name === 'enemy_tower4' ? 19 : 13 };
  for (const name in G.ORIG.units) {
    if (G.VIS[name]) continue;
    const s = G.SPR[name]; if (!s) continue;
    const d = G.BESTIARY[name] || {}, w = s[0].w;
    G.VIS[name] = { spr: name, r: G.clamp(Math.round(w * 0.62), 7, 17), shadow: G.clamp(Math.round(w * 0.55), 6, 15), fly: d.fly ? 24 : 0 };
  }
};

'use strict';
/* =========================================================
   音效 & 背景音樂：全部 Web Audio 即時合成（無外部檔案）
   新增音效：在 SFX 物件加一個函式即可
   ========================================================= */
G.Audio = (() => {
  let ac = null, master, sfxBus, bgmBus, comp, noiseBuf, pulse25, musicBus;
  const MUSIC_VOL = 0.5;                          // 所有 BGM 共用同一個音量（檔案已統一響度 −18 LUFS）
  let muted = false;
  // 玩家音量（0～1，v2.3）：音樂、音效分開調；存在 localStorage
  const VOL = { music: 1, sfx: 1 };
  try { const v = JSON.parse(localStorage.getItem('leafwar_vol') || 'null'); if (v) { if (v.music >= 0) VOL.music = Math.min(1, v.music); if (v.sfx >= 0) VOL.sfx = Math.min(1, v.sfx); } } catch (e) { }
  const last = {}; let voices = 0;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.55 * VOL.sfx;
    bgmBus = ac.createGain(); bgmBus.gain.value = 0.32;
    sfxBus.connect(comp); bgmBus.connect(comp); comp.connect(master); master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = MUSIC_VOL * VOL.music; musicBus.connect(master);   // 背景音樂（mp3）不經過壓縮器，音量固定
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 25% 方波（8-bit 主旋律）
    const n = 32, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * 0.25);
    pulse25 = ac.createPeriodicWave(re, im);
    // v2.0 起背景音樂改用 mp3（見下方 Music），合成 BGM 不再啟動
  }
  const now = () => ac.currentTime;

  // 基本元件
  function osc(type, f0, f1, t0, dur, vol, bus = sfxBus, opt = {}) {
    const o = ac.createOscillator(), g = ac.createGain();
    if (type === 'pulse') o.setPeriodicWave(pulse25); else o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + (opt.atk || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (opt.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opt.lp; o.connect(f); node = f; }
    node.connect(g); g.connect(bus);
    o.start(t0); o.stop(t0 + dur + 0.05);
    voices++; o.onended = () => voices--;
  }
  function noise(t0, dur, vol, ftype, f0, f1, q = 1, bus = sfxBus) {

    const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
    voices++; s.onended = () => voices--;

'use strict';
/* =========================================================
   地圖：程序化邊界（場域函數）+ 可走網格 + 導航（Dijkstra 流場）
   ========================================================= */
G.buildMap = function (def) {
  const T = G.TILE, M = { def, w: def.w, h: def.h, ww: def.w * T, wh: def.h * T };
  const segs = [];
  for (const l of def.lanes) for (let i = 0; i < l.pts.length - 1; i++) segs.push([l.pts[i][0], l.pts[i][1], l.pts[i + 1][0], l.pts[i + 1][1], l.r]);
  // 河道（可涉水通過，不算路面）
  const rsegs = []; if (def.river) { const rp = def.river.pts; for (let i = 0; i < rp.length - 1; i++) rsegs.push([rp[i][0], rp[i][1], rp[i + 1][0], rp[i + 1][1], def.river.r]); }
  const segDist = (px, py, s) => {
    const dx = s[2] - s[0], dy = s[3] - s[1], L = dx * dx + dy * dy;
    let t = L ? ((px - s[0]) * dx + (py - s[1]) * dy) / L : 0; t = G.clamp(t, 0, 1);
    return Math.hypot(px - s[0] - dx * t, py - s[1] - dy * t);
  };
  const sd = def.seed * 17.3;
  // 場域：<0 可走；單位＝格
  M.field = (tx, ty) => {
    let d = 1e9;
    for (const s of segs) { const v = segDist(tx, ty, s) - s[4]; if (v < d) d = v; }
    for (const c of def.clear) { const v = Math.hypot(tx - c[0], ty - c[1]) - c[2]; if (v < d) d = v; }
    for (const s of rsegs) { const v = segDist(tx, ty, s) - s[4] - 0.6; if (v < d) d = v; }
    d += (G.fbm(tx * 0.42 + sd, ty * 0.42 - sd) - 0.5) * 1.3;
    const b = Math.min(tx, ty, def.w - tx, def.h - ty);
    if (b < 1.2) d = Math.max(d, 1.2 - b);
    return d;
  };
  // 河道：距離中心線（格），<0 為水面
  M.river = (tx, ty) => { let d = 1e9; for (const s of rsegs) { const v = segDist(tx, ty, s) - s[4] + (G.fbm(tx * 0.7 + 9, ty * 0.7) - 0.5) * 0.9; if (v < d) d = v; } return d; };
  M.hasRiver = rsegs.length > 0;
  // 與某條路中心線的距離（格）
  M.laneSegs = def.lanes.map(l => { const a = []; for (let i = 0; i < l.pts.length - 1; i++) a.push([l.pts[i][0], l.pts[i][1], l.pts[i + 1][0], l.pts[i + 1][1], l.r]); return a; });
  M.laneDist = (li, tx, ty) => { let d = 1e9; for (const sg of M.laneSegs[li]) { const v = segDist(tx, ty, sg); if (v < d) d = v; } return d; };
  // 路面程度（0=路中央，1=路邊）
  M.pathiness = (tx, ty) => {
    let p = 9;
    for (const s of segs) { const v = segDist(tx, ty, s) / s[4]; if (v < p) p = v; }
    return p + (G.fbm(tx * 1.3 + 40, ty * 1.3) - 0.5) * 0.5;
  };

  // 可走網格（8 單位一格）
  M.cs = 8; M.cw = Math.ceil(M.ww / M.cs); M.ch = Math.ceil(M.wh / M.cs);
  M.walk = new Uint8Array(M.cw * M.ch);
  for (let y = 0; y < M.ch; y++) for (let x = 0; x < M.cw; x++)
    M.walk[y * M.cw + x] = M.field((x + 0.5) * M.cs / T, (y + 0.5) * M.cs / T) < 0 ? 1 : 0;
  M.isWalk = (x, y) => {
    const cx = (x / M.cs) | 0, cy = (y / M.cs) | 0;
    if (x < 0 || y < 0 || cx >= M.cw || cy >= M.ch) return false;
    return M.walk[cy * M.cw + cx] === 1;
  };
  // 視線
  M.los = (x0, y0, x1, y1) => {
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 6);
    for (let i = 1; i <= n; i++) { const t = i / n; if (!M.isWalk(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; }
    return true;
  };

  // 導航網格（半格 16 單位）
  M.ns = 16; M.nw = Math.ceil(M.ww / M.ns); M.nh = Math.ceil(M.wh / M.ns);
  M.nav = new Uint8Array(M.nw * M.nh);
  for (let y = 0; y < M.nh; y++) for (let x = 0; x < M.nw; x++) {
    const wx = (x + 0.5) * M.ns, wy = (y + 0.5) * M.ns;
    M.nav[y * M.nw + x] = (M.isWalk(wx, wy) && M.isWalk(wx - 5, wy) && M.isWalk(wx + 5, wy) && M.isWalk(wx, wy - 5) && M.isWalk(wx, wy + 5)) ? 1 : 0;
  }
  M.cellOf = (x, y) => G.clamp((y / M.ns) | 0, 0, M.nh - 1) * M.nw + G.clamp((x / M.ns) | 0, 0, M.nw - 1);
  M.cellXY = i => [((i % M.nw) + 0.5) * M.ns, (((i / M.nw) | 0) + 0.5) * M.ns];
  // 最近可走導航格
  M.nearestNav = (x, y) => {
    const c = M.cellOf(x, y); if (M.nav[c]) return c;
    const cx = c % M.nw, cy = (c / M.nw) | 0;

      let best = -1, bd = 1e9;
      for (let yy = cy - r; yy <= cy + r; yy++) for (let xx = cx - r; xx <= cx + r; xx++) {
        if (xx < 0 || yy < 0 || xx >= M.nw || yy >= M.nh) continue;
        if (Math.max(Math.abs(xx - cx), Math.abs(yy - cy)) !== r) continue;
        const i = yy * M.nw + xx; if (!M.nav[i]) continue;
        const [wx, wy] = M.cellXY(i), d = G.d2(wx, wy, x, y); if (d < bd) { bd = d; best = i; }

      const top = heap[0], tp = pri[0], li = heap.pop(), lp = pri.pop();

      }

      const [i, p] = pop(); if (p > dist[i]) continue;
      const x = i % M.nw, y = (i / M.nw) | 0;
      for (const [dx, dy, c] of dirs) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= M.nw || ny >= M.nh) continue;
        const j = ny * M.nw + nx; if (!M.nav[j]) continue;

  M.flowDir = (dist, x, y) => {

    const cx = c % M.nw, cy = (c / M.nw) | 0;

      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= M.nw || ny >= M.nh) continue;
      const j = ny * M.nw + nx; if (!M.nav[j]) continue;
      if (dx && dy && (!M.nav[cy * M.nw + nx] || !M.nav[ny * M.nw + cx])) continue;
      if (dist[j] < bd) { bd = dist[j]; best = j; }
    }
    const [tx, ty] = M.cellXY(best);

  };
  // 路徑（拉線平滑）
  M.path = (sx, sy, ex, ey) => {
    const goal = M.nearestNav(ex, ey);
    const [gx, gy] = M.cellXY(goal);
    const fx = M.nav[M.cellOf(ex, ey)] && M.isWalk(ex, ey) ? ex : gx, fy = M.nav[M.cellOf(ex, ey)] && M.isWalk(ex, ey) ? ey : gy;
    if (M.los(sx, sy, fx, fy)) return [[fx, fy]];

      const cx = c % M.nw, cy = (c / M.nw) | 0; let best = c, bd = dist[c];

        const nx = cx + dx, ny = cy + dy; if ((!dx && !dy) || nx < 0 || ny < 0 || nx >= M.nw || ny >= M.nh) continue;
        const j = ny * M.nw + nx; if (dist[j] < bd) { bd = dist[j]; best = j; }
      }
      if (best === c) break; c = best; pts.push(M.cellXY(c));
    }
    pts.push([fx, fy]);
    // 拉線
    const out = []; let ax = sx, ay = sy, i = 0;
    while (i < pts.length) {
      let j = pts.length - 1;
      while (j > i && !M.los(ax, ay, pts[j][0], pts[j][1])) j--;
      out.push(pts[j]); ax = pts[j][0]; ay = pts[j][1]; i = j + 1;
    }
    return out;
  };

  // 道具（樹/石）— 以種子固定
  const rng = G.mulberry(def.seed * 999);
  M.props = [];
  for (let y = -200; y < M.wh + 260; y += 22) for (let x = -180; x < M.ww + 180; x += 22) {
    const px = x + (rng() - 0.5) * 16, py = y + (rng() - 0.5) * 14, f = M.field(px / T, py / T);
    if (f > 0.22 && f < 1.4 && rng() < 0.5) M.props.push({ x: px, y: py, s: G.SPR.trees[(rng() * 3) | 0], tree: 1 });
    else if (f >= 1.3 && rng() < 0.09) M.props.push({ x: px, y: py, s: G.SPR.trees[(rng() * 3) | 0], tree: 1 });
    else if (f < -0.9 && f > -1.6 && M.pathiness(px / T, py / T) > 0.9 && !(M.hasRiver && M.river(px / T, py / T) < 0.5) && rng() < 0.05) M.props.push({ x: px, y: py, s: G.SPR.rocks[(rng() * 3) | 0] });
  }
  return M;
};

// 地面預先繪製（美術像素）
G.renderGround = function (M) {
  const T = G.TILE, PAD = 110, GW = Math.ceil(M.ww * G.AX) + PAD * 2, GH = Math.ceil(M.wh * G.AY) + PAD * 2;
  const c = G.canvas(GW, GH), x = c.getContext('2d'), id = x.createImageData(GW, GH), d = id.data;
  const idx = new Int8Array(GW * GH);
  const step = 1 / (G.AX * T);   // 美術 1px = 多少格
  for (let ay = 0; ay < GH; ay++) for (let ax = 0; ax < GW; ax++) {
    const tx = (ax - PAD + 0.5) / G.AX / T, ty = (ay - PAD + 0.5) / G.AY / T;
    const f = M.field(tx, ty), b = G.bayer(ax, ay);
    let v;
    if (f >= 0) {
      const below = M.field(tx, ty + 0.42) < 0;                        // 森林邊緣的「崖面」
      if (below) v = (G.fbm(tx * 3, ty * 0.6) > 0.5 ? 2 : 1) + ((ax & 1) && b > 0.6 ? 1 : 0);
      else {
        const n = G.fbm(tx * 1.6, ty * 1.6);
        v = n + (b - 0.5) * 0.25 > 0.52 ? 2 : 1;
        if (f < 0.35 && b < 0.5) v = 0;
        if (G.hash(ax * 3, ay * 7) > 0.985) v = 3;
      }
    } else {
      const p = M.pathiness(tx, ty), n = G.fbm(tx * 0.8 + 50, ty * 0.8);
      if (p < 0.55) v = (n + (b - 0.5) * 0.35 > 0.5) ? 6 : 5;            // 路面
      else if (p < 0.7) v = b < 0.5 ? 5 : 4;                             // 路邊抖動
      else v = (n + (b - 0.5) * 0.3 > 0.55) ? 5 : 4;                     // 草地
      if (M.field(tx, ty - 0.35) >= 0) v = b < 0.65 ? 2 : 3;             // 崖下陰影
      else if (M.field(tx, ty - 0.6) >= 0) v = Math.max(3, v - 1 - (b < 0.4 ? 1 : 0));
      if (M.hasRiver) {
        const rv = M.river(tx, ty);
        if (rv < 0) {                                                    // 水面：深色 + 橫向波紋；路經過處為淺灘
          const shallow = p < 0.75, wav = G.fbm(tx * 2.2, ty * 7) + (b - 0.5) * 0.2;
          if (shallow) v = wav > 0.58 ? 6 : (b < 0.5 ? 4 : 5);
          else v = rv > -0.35 ? 3 : (wav > 0.62 ? 4 : wav > 0.56 && b < 0.5 ? 3 : 2);
          if (rv > -0.18) v = shallow ? 7 : 6;                            // 岸邊浪花
        } else if (rv < 0.35) v = b < 0.5 ? 3 : Math.min(v, 4);          // 濕潤河岸
      }
    }
    idx[ay * GW + ax] = v;
  }
  // 草叢、花、碎石
  const rng = G.mulberry(M.def.seed * 31);
  const put = (ax, ay, v) => { if (ax >= 0 && ay >= 0 && ax < GW && ay < GH) idx[ay * GW + ax] = v; };
  for (let i = 0; i < GW * GH / 55; i++) {
    const ax = (rng() * GW) | 0, ay = (rng() * GH) | 0;
    const tx = (ax - PAD) / G.AX / T, ty = (ay - PAD) / G.AY / T;
    if (M.field(tx, ty) > -0.15) continue;
    const p = M.pathiness(tx, ty), r = rng();
    if (p > 0.75) {
      if (r < 0.7) { put(ax, ay, 6); put(ax - 1, ay - 1, 6); put(ax + 1, ay - 1, 6); put(ax, ay + 1, 3); }   // 草
      else if (r < 0.8) { put(ax, ay, 9); put(ax, ay + 1, 3); }                                          // 小白花
      else { put(ax, ay, 3); put(ax + 1, ay, 3); put(ax, ay - 1, 7); }                                     // 小石
    } else if (r < 0.25) { put(ax, ay, 7); put(ax + 1, ay + 1, 4); }
  }
  for (let i = 0; i < GW * GH; i++) { const rgb = G.PAL_RGB[idx[i]]; d[i * 4] = rgb[0]; d[i * 4 + 1] = rgb[1]; d[i * 4 + 2] = rgb[2]; d[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  // 樹影烘進地面
  G.setPatOffset(0, 0);
  for (const p of M.props) if (p.tree) G.pxDisc(x, p.x * G.AX + PAD, p.y * G.AY + PAD, p.s.w * 0.4, 2.5, 0, 0.6);
  // 小地圖
  const MR = 3, mm = G.canvas(M.w * MR, M.h * MR), mx = mm.getContext('2d'), mid = mx.createImageData(mm.width, mm.height);
  for (let y = 0; y < M.h * MR; y++) for (let xx = 0; xx < M.w * MR; xx++) {
    const fx = (xx + 0.5) / MR, fy = (y + 0.5) / MR, f = M.field(fx, fy);
    const wet = M.hasRiver && f < 0 && M.river(fx, fy) < 0;
    const rgb = G.PAL_RGB[wet ? 2 : f < 0 ? (M.pathiness(fx, fy) < 0.6 ? 5 : 4) : 1], i = (y * mm.width + xx) * 4;
    mid.data[i] = rgb[0]; mid.data[i + 1] = rgb[1]; mid.data[i + 2] = rgb[2]; mid.data[i + 3] = 255;

// ===== 06_fx.js =====
'use strict';
/* =========================================================
   特效：像素繪圖工具、粒子池、特效物件
   ========================================================= */
// --- 像素繪圖工具（美術座標） ---
G.px = (ctx, x, y, w = 1, h = 1) => ctx.fillRect(Math.round(x), Math.round(y), w, h);
G.pxEllipse = (ctx, cx, cy, rx, ry, col, dash = 0, rot = 0) => {
  if (rx < 0.5) return;
  ctx.fillStyle = G.PAL[col];
  const n = Math.max(10, Math.ceil((rx + ry) * 3.2));
  for (let i = 0; i < n; i++) {
    if (dash && ((i + (rot | 0)) % dash) < dash / 2) continue;
    const a = i / n * Math.PI * 2;
    ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
  }
};
// 抖動圖樣（4x4 Bayer），以 pattern 填色取代逐點繪製
G._pats = {}; G._patOff = [0, 0];
G.pat = (ctx, col, a) => {
  const k = Math.round(G.clamp(a, 0, 1) * 16), key = col * 17 + k;
  let p = G._pats[key];
  if (!p) {
    const c = G.canvas(4, 4), x = c.getContext('2d'); x.fillStyle = G.PAL[col];
    for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 4; xx++) if (G.bayer(xx, yy) < k / 16) x.fillRect(xx, yy, 1, 1);
    p = G._pats[key] = ctx.createPattern(c, 'repeat');
    if (p.setTransform) p.setTransform(new DOMMatrix([1, 0, 0, 1, G._patOff[0], G._patOff[1]]));
  }
  return p;
};
G.setPatOffset = (ox, oy) => {
  const tx = ((-ox % 4) + 4) % 4, ty = ((-oy % 4) + 4) % 4;
  if (tx === G._patOff[0] && ty === G._patOff[1]) return;
  G._patOff = [tx, ty];
  const m = new DOMMatrix([1, 0, 0, 1, tx, ty]);
  for (const k in G._pats) if (G._pats[k].setTransform) G._pats[k].setTransform(m);
};
G.pxDisc = (ctx, cx, cy, rx, ry, col, alpha = 1) => {
  if (rx < 0.5 || alpha <= 0) return;
  ctx.fillStyle = alpha >= 1 ? G.PAL[col] : G.pat(ctx, col, alpha);
  const y0 = Math.ceil(-ry), y1 = Math.floor(ry), icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const hw = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y / ry) * (y / ry))));
    ctx.fillRect(icx - hw, icy + y, hw * 2 + 1, 1);
  }
};
G.pxLine = (ctx, x0, y0, x1, y1, w = 1) => {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let k = 0; k < 600; k++) {
    ctx.fillRect(x0 - (w >> 1), y0 - (w >> 1), w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
};

// --- 粒子池（SoA，零配置） ---
G.Particles = class {
  constructor(n) {
    this.n = n; this.c = 0;
    for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'max', 'grav', 'drag']) this[k] = new Float32Array(n);
    this.col = new Int8Array(n); this.col2 = new Int8Array(n); this.sz = new Uint8Array(n); this.gnd = new Uint8Array(n);
  }
  add(x, y, z, vx, vy, vz, life, col, col2 = col, sz = 1, grav = 0, drag = 0, gnd = 0) {
    if (this.c >= this.n) return;
    const i = this.c++;
    this.x[i] = x; this.y[i] = y; this.z[i] = z; this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
    this.life[i] = this.max[i] = life; this.col[i] = col; this.col2[i] = col2; this.sz[i] = sz; this.grav[i] = grav; this.drag[i] = drag; this.gnd[i] = gnd;
  }
  update(dt) {
    for (let i = 0; i < this.c; i++) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) { this.c--; this.copy(this.c, i); i--; continue; }
      const dr = 1 - this.drag[i] * dt;
      this.vx[i] *= dr; this.vy[i] *= dr; this.vz[i] = this.vz[i] * dr - this.grav[i] * dt;
      this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt; this.z[i] += this.vz[i] * dt;
      if (this.z[i] < 0) { this.z[i] = 0; this.vz[i] *= -0.35; this.vx[i] *= 0.6; this.vy[i] *= 0.6; }
    }
  }
  copy(a, b) { for (const k of ['x', 'y', 'z', 'vx', 'vy', 'vz', 'life', 'max', 'grav', 'drag', 'col', 'col2', 'sz', 'gnd']) this[k][b] = this[k][a]; }
  draw(ctx, ox, oy, frame, ground) {
    for (let i = 0; i < this.c; i++) {
      if ((this.gnd[i] === 1) !== ground) continue;
      const t = this.life[i] / this.max[i];
      if (t < 0.35 && G.hash(i * 7, frame) > t / 0.35) continue;    // 像素式消散
      ctx.fillStyle = G.PAL[t > 0.5 ? this.col[i] : this.col2[i]];
      const s = this.sz[i] > 1 && t < 0.5 ? this.sz[i] - 1 : this.sz[i];
      ctx.fillRect(Math.round(this.x[i] * G.AX - ox - s / 2), Math.round(this.y[i] * G.AY - this.z[i] * G.AZ - oy - s / 2), s, s);
    }
  }
};

// --- 特效生成器（作用於 world W） ---
G.FX = {
  // 擊中火花

      const a = Math.random() * Math.PI * 2, s = G.rr(40, big ? 180 : 110);
      W.parts.add(x, y, z, Math.cos(a) * s, Math.sin(a) * s * 0.7, G.rr(20, 120), G.rr(0.15, 0.35), col, 6, big && i < 4 ? 2 : 1, 380, 3);
    }
    W.effects.push({ t: 0, dur: big ? 0.12 : 0.08, layer: 1, x, y, z, draw(ctx, o) { const r = (big ? 7 : 4) * (1 - this.t / this.dur); G.pxDisc(ctx, this.x * G.AX - o.x, this.y * G.AY - this.z * G.AZ - o.y, r, r, 9, 1); } });
  },
  // 近戰爪痕/斬擊
  slash(W, x, y, z, face, dark) {

      t: 0, dur: 0.12, layer: 1, x, y, z, face, draw(ctx, o) {

        ctx.fillStyle = G.PAL[dark ? 1 : 9];
        for (let i = 0; i < 3; i++) { const yy = cy - 5 + i * 3; G.pxLine(ctx, cx - 4 * this.face + p * 2, yy - 3, cx + 4 * this.face + p * 2, yy + 2, 1); }
      }
    });
  },
  // 近戰揮擊的弧形殘影（v2.3）：攻擊者前方一道由上往下掃的月牙，前端亮、尾巴淡出
  swingArc(b, u, ax, ay, s, prog) {
    const f = u.face, k = G.clamp(prog / 0.75, 0, 1), e = 1 - (1 - k) * (1 - k);
    const cx = ax + s.w / 2 + f * s.w * 0.12, cy = ay + s.h * 0.55, big = u.kind === 'boss' || u.kind === 'hero', r = Math.max(6, s.w * 0.55) + (big ? 4 : 2);
    const a0 = -2.1, a1 = 0.9, lead = a0 + (a1 - a0) * e, tail = Math.max(a0, lead - 1.3), n = 14;

    for (let i = 0; i <= n; i++) {
      const q = i / n, a = tail + (lead - tail) * q, rr = r - (1 - q) * 2, x = Math.round(cx + Math.cos(a) * rr * f), y = Math.round(cy + Math.sin(a) * rr * 0.85);

    }

  },
  // 死亡：碎成像素
  shatter(W, u) {

  if (/meteor/.test(n)) return 'i_meteor'; if (/thunder|tunder/.test(n)) return 'i_bolt'; if (/punch|strike/.test(n) && w.type === '2d_bullet_effect') return 'i_punch';
  if (/ice/.test(n)) return 'i_ice'; if (/sun|solar/.test(n)) return 'i_sun'; if (/tomato/.test(n)) return 'i_tomato'; if (/flux|misticball/.test(n)) return 'i_flux';

'use strict';
/* =========================================================
   世界：單位、戰鬥、技能、兵線、勝負

// 依原著成長公式算出某等級的數值
G.stats = function (name, lv, side, kind) {
  if (kind === 'holy') { const h = G.TUNE.holy[side === 0 ? 'player' : 'enemy']; return { hp: h.hp, mp: 0, power: 0, armor: h.armor, crit: 0, delay: 9, range: 0, speed: 0, hpReg: h.heal_hp, mpReg: 0, weapon: null, exp: 600 }; }
  const o = G.ORIG.units[name] || G.ORIG.towers[name], L = lv - 1;
  // v2.2 敵方成長加成（配合技能升級變強）：敵方兵線／首領／獵手每級額外 HP、攻擊 %
  const E = G.BAL && G.BAL.enemy, eg = E && side === 1 && (kind === 'creep' || kind === 'boss' || kind === 'jungler') ? L : 0, hm = 1 + (E ? E.hp : 0) / 100 * eg, pm = 1 + (E ? E.pow : 0) / 100 * eg;
  return {
    hp: Math.round((o.hp + (o.grow_hp || 0) * L) * hm), mp: (o.mp || 0) + (o.grow_mp || 0) * L,
    power: Math.round((o.power + (o.grow_power || 0) * L) * pm), armor: o.armor + (o.grow_armor || 0) * L,
    crit: (o.critical || 0) + (o.grow_critical || 0) * L,
    delay: Math.max(300, (o.delay || 1000) + (o.grow_delay || 0) * L) / 1000,
    range: o.range + (o.grow_range || 0) * L, speed: (o.speed || 0) + (o.grow_speed || 0) * L,
    hpReg: (o.heal_hp || 0) + (o.grow_heal_hp || 0) * L, mpReg: (o.heal_mp || 0) + (o.grow_heal_mp || 0) * L,
    weapon: o.weapon_name, wopt: (o.weapon_option || 0) + (o.weapon_grow_option || 0) * L, exp: o.exp
  };
};

let UID = 1;
G.Unit = class {
  constructor(W, name, side, x, y, level, kind) {
    this.id = UID++; this.W = W; this.name = name; this.side = side; this.kind = kind; this.level = level;
    this.vis = G.VIS[name]; this.spr = G.SPR[this.vis.spr];
    this.x = this.px = x; this.y = this.py = y; this.z = this.vis.fly || 0; this.vx = this.vy = 0;
    this.rar = side === 0 && (kind === 'hero' || kind === 'creep') ? G.rarityOf(name) : null;
    this.face = side === 0 ? 1 : -1; this.alive = true; this.static = kind === 'tower' || kind === 'holy';
    this.atkT = Math.random() * 0.3; this.windup = 0; this.target = null; this.retarget = Math.random() * 0.3;
    this.anim = Math.random() * 10; this.flash = 0; this.lunge = 0; this.cast = 0; this.stun = 0; this.slow = 0; this.spawnT = kind === 'creep' || kind === 'hero' ? 0.3 : 0;
    this.calc(); this.hp = this.st.hp; this.mp = this.st.mp;
  }
  calc() {
    this.st = G.stats(this.name, this.level, this.side, this.kind);
    this.aura = null; this.lifesteal = 0; this.mpDisc = 0;
    const ps = this.pskills || (this.passives || []).map(id => ({ s: G.ORIG.skills[id], lv: 1 }));
    for (const sl of ps) {                          // 被動技能（原著 attribute；依技能等級成長，0 級不生效）
      if (!sl.lv) continue;
      const p = sl.s, v = p.value_1 + p.grow_value_1 * (sl.lv - 1), st = this.st;
      switch (p.attribute) {
        case 'hp_sec': st.hpReg += v; break;
        case 'mp_sec': st.mpReg += v / 10; break;
        case 'delay': st.delay = Math.max(0.3, st.delay + v / 1000); break;
        case 'speed': st.speed += v; break;
        case 'critical': st.crit += v; break;
        case 'range': st.range += v; break;
        case 'return': this.lifesteal += v; break;
        case 'mp_discount': this.mpDisc += v; break;
        case 'power': st.power += v; if (p.type === 'multi_buff') this.aura = Object.assign(this.aura || {}, { pow: v }); break;
        case 'armor': st.armor += v; if (p.type === 'multi_buff') this.aura = Object.assign(this.aura || {}, { arm: v }); break;
      }
    }
    if (this.kind === 'creep') this.st.speed *= G.TUNE.creepSpeedMul;
    this.melee = this.st.range <= 40;
  }
  get r() { return this.vis.r; }
};

G.World = class {
  constructor(opt) {
    this.stage = G.STAGES[opt.stage || 0];
    const md = G.MAPS[this.stage.map], T = G.TILE;
    G.mapCache = G.mapCache || {};
    if (!G.mapCache[this.stage.map]) { const M = G.buildMap(md); G.mapCache[this.stage.map] = { M, ground: G.renderGround(M) }; }
    this.M = G.mapCache[this.stage.map].M; this.ground = G.mapCache[this.stage.map].ground;
    this.units = []; this.projs = []; this.effects = []; this.decals = []; this.parts = new G.Particles(2600);
    this.spawnQ = []; this.time = 0; this.trauma = 0; this.flashScreen = 0; this.hitstop = 0; this.timeScale = 1;
    this.notices = []; this.stats = { kills: 0, time: 0, deaths: 0, assists: 0, camps: 0, towers: 0, gold: 0, dmg: 0, taken: 0, tower: 0, bosses: 0, hunters: 0, wboss: 0, potions: 0, tps: 0, maxFollow: 0, streak: 0, minHoly: 1 }; this.killT = [];   // 即時戰鬥數據
    this.over = null; this.attract = !!opt.attract; this.frame = 0;
    // 聖所與塔
    this.holy = [
      this.add(new G.Unit(this, 'player_holy', 0, md.holy.player[0] * T, md.holy.player[1] * T, 1, 'holy')),
      this.add(new G.Unit(this, 'enemy_holy', 1, md.holy.enemy[0] * T, md.holy.enemy[1] * T, 1, 'holy'))
    ];
    // 塔：每路外塔/內塔；內塔受外塔保護，聖所受內塔保護（任一路內塔被破才可攻擊聖所）
    this.towers = [[], []];
    const tw = md.towers3 || { player: (md.towers.player || []).map(p => [p, 1, 0]), enemy: (md.towers.enemy || []).map(p => [p, 1, 0]) };
    [['player', 0], ['enemy', 1]].forEach(([k, side]) => tw[k].forEach(([p, lane, tier]) => {
      // 外塔(0) → 中塔(1) → 內塔(2) → 主塔(9)
      const name = side === 0 ? 'player_tower' : ['enemy_tower', 'enemy_tower2', 'enemy_tower3'][tier] || 'enemy_tower4';
      const u = this.add(new G.Unit(this, name, side, p[0] * T, p[1] * T, 1, 'tower')); u.lane = lane; u.tier = tier; this.towers[side].push(u);
      if (tier === 9) { const m = G.ORIG.towers.enemy_tower4; Object.assign(u.st, { hp: m.hp, power: m.power, armor: m.armor, range: m.range, delay: m.delay / 1000 }); u.hp = u.st.hp; u.main = true; }
    }));
    // 保護鏈：同一路前一層塔沒倒，後一層有護盾；任一路內塔倒了才能打主塔；主塔倒了才能打聖所
    for (let side = 0; side < 2; side++) {
      const tw = this.towers[side];
      for (const u of tw) if (u.tier === 1 || u.tier === 2) { const o = tw.find(v => v.lane === u.lane && v.tier === u.tier - 1); if (o) u.protectors = [o]; }
      const inner = tw.filter(v => v.tier === 2), main = tw.filter(v => v.tier === 9);
      if (main.length) { main.forEach(m => { if (inner.length) { m.protectors = inner; m.protectAll = true; } }); this.holy[side].protectors = main; }
      else if (inner.length) { this.holy[side].protectors = inner; this.holy[side].protectAll = true; }
    }
    // 流場：每一路、每一方各一張（離開該路的格子成本 ×15，所以小兵會沿著自己的路走）
    const nl = md.laneCount || 1, M = this.M;
    const seeds = h => { const s = []; for (let i = 0; i < M.nav.length; i++) { if (!M.nav[i]) continue; const [x, y] = M.cellXY(i); if (G.d2(x, y, h.x, h.y) < 60 * 60) s.push(i); } return s; };
    G.flowCache = G.flowCache || {};
    const fk = this.stage.map;
    if (!G.flowCache[fk]) {
      const fl = [[], []];
      for (let li = 0; li < nl; li++) {
        let wt = null;
        if (nl > 1) { wt = new Float32Array(M.nav.length); for (let i = 0; i < M.nav.length; i++) { const [x, y] = M.cellXY(i); wt[i] = M.laneDist(li, x / T, y / T) <= md.lanes[li].r + 1.2 ? 1 : 15; } }
        fl[0][li] = M.dijkstra(seeds(this.holy[1]), wt); fl[1][li] = M.dijkstra(seeds(this.holy[0]), wt);
      }
      G.flowCache[fk] = fl;
    }
    this.flow = G.flowCache[fk];
    this.nLanes = nl;
    // 各路出生點：沿該路流場從聖所走出一段
    this.laneSpawn = [0, 1].map(s => this.flow[s].map(f => { let x = this.holy[s].x, y = this.holy[s].y; for (let i = 0; i < 10; i++) { const d = M.flowDir(f, x, y); if (!d) break; x += d[0] * 16; y += d[1] * 16; } return [x, y]; }));
    this.spawnPt = [0, 1].map(s => { const f = this.flow[s][Math.min(1, nl - 1)]; let x = this.holy[s].x, y = this.holy[s].y; for (let i = 0; i < 4; i++) { const d = M.flowDir(f, x, y); if (!d) break; x += d[0] * 16; y += d[1] * 16; } return [x, y]; });
    // Boss

  // ---------- 兵線 ----------

  spawnWave(s) {

  // 分離（避免重疊）

  // ---------- 單位 AI ----------

    if (u.windup > 0) { u.windup -= dt; if (u.windup <= 0) this.fire(u, u.wTarget); return this.brake(u, dt); }
    if (u.stun > 0) { u.stun -= dt; return this.brake(u, dt); }
    if (u.kind === 'holy') return;
    if (u.kind === 'tower') return this.towerAI(u, dt);
    if (u.kind === 'hero') return this.heroAI(u, dt);
    if (u.side === 2) return this.wildAI(u, dt);

  tryAttack(u, t) {

  }

    const t = u.target;

  bossAI(u, dt) {

    const t = u.target, sid = G.BOSS_SKILL[u.name];

        if (d < sd.range && (round || d > 30)) { u.skillCd = Math.max(3, sd.delay); this.beginCharge(u, sd, t, sd.lv1 || 1, G.TUNE.chgBoss); }
      }

      else this.moveTo(u, t.x, t.y, dt);

  }
  towerAI(u, dt) {

  // ---------- 英雄 ----------
  heroAI(h, dt) {

    if (h.inv > 0) h.inv = Math.max(0, h.inv - dt);

  // 自動選目標：射程內優先「血量最低的單位」，其次最近的單位，最後才是建築

      if (t === h.target) sc -= inR ? 15 : 0;   // 稍微黏住目前目標，避免來回切換

  chase(h, t, dt, mul = 1) {
    if (this.M.los(h.x, h.y, t.x, t.y)) { h.path = null; return this.moveTo(h, t.x, t.y, dt, mul); }

  // 指令
  cmdMove(x, y, quiet) {
    const h = this.hero; if (!h || !h.alive) return;
    this.cancelTeleport(true);
    h.pending = null; h.cmd = { type: 'move' }; h.path = this.M.path(h.x, h.y, x, y); h.target = null;
    const e = h.path.length ? h.path[h.path.length - 1] : [x, y];

  }
  // 鎖定目標：英雄會一直追打直到目標死亡或玩家下新的移動指令
  cmdLock(t) {

    if (!this.valid(h, t)) { G.FX.ring(this, t.x, t.y, t.r + 10, t.r + 12, 0.35, 12, 2); G.Audio.play('deny'); return false; }
    this.cancelTeleport(true);

    t.lockT = 0; G.Audio.play('lock'); return true;

  cmdAttack(t) {

  cmdAttackNearest() {

  }
  usePotion(i) { return this.useItem(i ? 'mp' : 'hp'); }

  // ---------- 召集：點友方小兵 → 跟隨英雄（一起移動、打同一個目標）；再點一次解除 ----------
  toggleFollow(u) {
    const h = this.hero; if (!h || !h.alive || !u.alive) return;
    u.follow = !u.follow; u.path = null; u.target = null; u.repath = 0;
    if (u.follow) {

  }
  clearFollow() { let n = 0; for (const u of this.units) if (u.follow) { u.follow = false; u.path = null; n++; } if (n && G.UI) G.UI.toastMsg('英雄倒下，跟隨解除', 10); }
  // 回傳 true = 本幀已處理
  followAI(u, dt) {
    const h = this.hero, T = G.TUNE;
    if (!h || !h.alive) { u.follow = false; return false; }
    const cm = Math.max(T.followSpeed, h.st.speed * (h.iSpd || 1) * 1.1 / Math.max(1, u.st.speed));   // 趕路倍率：至少跟得上英雄
    u.retarget -= dt;
    if (u.retarget <= 0) {
      u.retarget = 0.25;
      const ht = h.pending ? h.pending.t : (h.cmd && h.cmd.type === 'attack' ? h.cmd.t : null);
      if (ht && this.valid(u, ht)) u.target = ht;                       // 英雄在打誰就打誰
      else if (!this.valid(u, u.target) || Math.hypot(u.target.x - h.x, u.target.y - h.y) > T.followLeash) u.target = this.nearestEnemy(u, T.followAssist, h.x, h.y);

    if (t && this.valid(u, t) && Math.hypot(t.x - h.x, t.y - h.y) < T.followLeash) {
      if (t.side === 2 && !t.aggro) t.aggro = u;

      else this.chase(u, t, dt, cm);

    const fx = h.x + (u.fOff ? u.fOff[0] : 0) - h.face * 10, fy = h.y + (u.fOff ? u.fOff[1] : 0), d = Math.hypot(fx - u.x, fy - u.y);
    if (d < 10) this.brake(u, dt); else this.chase(u, { x: fx, y: fy }, dt, d > 40 ? cm : 1);

  // ---------- 技能 ----------
  // 回傳：'ok' / 'queued' / 'cd' / 'mp' / 'none'
  trySkill(i) {
    const h = this.hero; if (!h || !h.alive) return 'none';
    const s = h.skills[i]; if (!s) return 'none';
    if (!s.lv) return 'lock';
    if (h.chg) return 'busy';
    if (s.cd > 0) return 'cd';
    if (h.mp < Math.round(s.mp * (1 - (h.mpDisc || 0) / 100))) return 'mp';
    this.cancelTeleport(true);
    if (!s.needT) { this.castSkill(h, i, null); return 'ok'; }
    let t = this.valid(h, h.target) && this.dist(h, h.target) <= s.range + 10 ? h.target : this.nearestEnemy(h, s.range + 10);
    if (t) { this.castSkill(h, i, t); return 'ok'; }
    t = this.valid(h, h.target) ? h.target : this.nearestEnemy(h, s.range * 2.2);
    if (t) { h.pending = { i, t }; h.cmd = null; return 'queued'; }
    return 'none';
  }
  // v2.4 指定施放（拖曳瞄準放開／按住快捷鍵放開）：A = { x, y, t }
  castAim(i, A) {
    const h = this.hero; if (!h || !h.alive) return 'none';
    const s = h.skills[i]; if (!s) return 'none';
    if (!s.lv) return 'lock'; if (h.chg) return 'busy'; if (s.cd > 0) return 'cd';
    if (h.mp < Math.round(s.mp * (1 - (h.mpDisc || 0) / 100))) return 'mp';
    this.cancelTeleport(true); h.pending = null;
    const k = s.shape.k;
    if (k === 'self' || k === 'buff') { this.castSkill(h, i, null); return 'ok'; }
    if (k === 'area' || k === 'line') { this.castSkill(h, i, { x: A.x, y: A.y, r: 0, alive: true, vis: { fly: 0 }, static: false, pt: true }); return 'ok'; }
    if (A.t && this.valid(h, A.t) && this.dist(h, A.t) <= s.range + 10) { this.castSkill(h, i, A.t); return 'ok'; }
    return 'none';
  }
  castSkill(h, i, t) {
    const s = h.skills[i], cost = Math.round(s.mp * (1 - (h.mpDisc || 0) / 100));
    if (h.mp < cost || s.cd > 0) { G.Audio.play('deny'); return false; }
    if (h.chg) return false;
    h.mp -= cost; s.cd = s.cdMax; h.atkT = Math.max(h.atkT, 0.25);
    const ult = i === h.skills.length - 1 && s.s.lv1 >= 5;
    return this.beginCharge(h, s.s, t, s.lv, ult ? G.TUNE.chgUlt : G.TUNE.chgSkill, () => { s.cd = 0; h.mp = Math.min(h.st.mp, h.mp + cost); });
  }
  say(n) { if (this.attract) return; n.age = 0; n.t = Math.max(2.2, n.t || 2.4); this.notices.push(n); }
  kill(t, src) {
    if (t === this.hero && this.tryRevive(t)) return;
    t.alive = false; t.hp = 0;
    G.FX.shatter(this, t);

      for (let k = 0; k < 4; k++) G.FX.smoke(this, t.x + G.rr(-16, 16), t.y + G.rr(-6, 6), G.rr(0, 30), 8, 6);
      G.FX.scorch(this, t.x, t.y, 30, 30);
    } else this.sfx('die', t.x, t.y);
    const h = this.hero;
    if (t.side === 1 && h && h.alive && (src === h || G.d2(h.x, h.y, t.x, t.y) < 480 * 480)) this.gainExp(h, t.st.exp);
    // 戰鬥數據：最後一擊＝擊殺；英雄 8 秒內打過、但由別人收尾＝助攻
    const helped = h && t.heroHitT != null && this.time - t.heroHitT < 8;

    else if (t.side === 1 && helped && !t.static) this.stats.assists++;
    if (t.side === 1 && t.kind === 'tower' && src !== h && helped) this.stats.towers++;
    if (t.side === 2 && (src === h || helped)) this.stats.camps++;
    if (t === h) this.stats.deaths++;

    if (t.side === 1 && src === h) { this.killT.push(this.time); this.killT = this.killT.filter(v => this.time - v <= 4); this.stats.streak = Math.max(this.stats.streak, this.killT.length); }   // 4 秒內連續擊倒
    this.tryKey(t, src);

    }
  }

G.JBUFF = {
  red: { n: '狂暴之力', d: '攻擊力 +25%', ic: 'i_rage', col: 10, t: 90, fx: { pow: 25 } },
  blue: { n: '智慧之泉', d: 'MP 回復 +5/秒、技能冷卻 −20%', ic: 'i_mp', col: 12, t: 90, fx: { mpReg: 5, cdr: 20 } }
};

Object.assign(G.World.prototype, {
  // ----- 初始化（建構完成後呼叫） -----
  initSystems() {
    this.gold = G.TUNE.gold.start; this.bag = [];
    this.camps = [];
    const md = G.MAPS[this.stage.map], T = G.TILE;
    if (md.wild && !this.attract) for (const [key, p] of md.wild) this.camps.push({ key, def: G.WILD[key], x: p[0] * T, y: p[1] * T, u: null, t: 1.5 });
    if (md.wild && this.attract) for (const [key, p] of md.wild) this.camps.push({ key, def: G.WILD[key], x: p[0] * T, y: p[1] * T, u: null, t: 0.2 });
    this.jg = { t: G.TUNE.jungle.first, u: null };
    this.keysGot = 0; this.keyFx = [];
    // 視野網格（每格 48 單位）：v[side][cell] = 1 看得到
    const cs = G.TUNE.vision.cell, gw = Math.ceil(this.M.ww / cs), gh = Math.ceil(this.M.wh / cs);
    this.vis = { cs, gw, gh, v: [new Uint8Array(gw * gh), new Uint8Array(gw * gh)], t: 0, fog: new Float32Array(gw * gh).fill(1) };
    if (!this.attract) this.updateVision(1);
    this.tp = { cd: 0, ch: null };
    const h = this.hero;
    if (h) {
      h.sp = 1;                                    // 1 級時有 1 點，自動學第一個可學技能
      const first = [...h.skills, ...h.pskills].find(s => G.skillReq(s.s, 1) <= 1);
      if (first) this.levelSkill(first, true);
    }
  },
  // ----- 每幀 -----
  updateSystems(dt) {
    if (this.over) return;
    if (this.hero && !this.attract) { this.gold += G.TUNE.gold.perSec * dt; this.stats.gold += G.TUNE.gold.perSec * dt; }
    // 敵方獵手：同時最多 1 隻，死亡後倒數再出動
    if (!this.attract && this.camps.length && !(this.jg.u && this.jg.u.alive)) { if (this.jg.u) { this.jg.u = null; this.jg.t = G.TUNE.jungle.respawn; } this.jg.t -= dt; if (this.jg.t <= 0) this.spawnHunter(); }
    this.updateTeleport(dt);
    if (!this.attract) this.updateVision(dt);
    for (const c of this.camps) {
      if (c.u && c.u.alive) continue;
      if (c.u && !c.u.alive) { c.u = null; c.t = c.def.respawn; }
      c.t -= dt;
      if (c.t <= 0) this.spawnCamp(c);
    }
  },
  spawnCamp(c) {
    const d = c.def, u = this.add(new G.Unit(this, d.unit, 2, c.x, c.y, d.lv, d.kind === 'wboss' ? 'boss' : 'wild'));
    u.st.hp = Math.round(u.st.hp * d.hpMul); u.hp = u.st.hp; u.st.power = Math.round(u.st.power * (d.pMul || 1)); u.st.armor = Math.round(u.st.armor * (d.aMul || 1));
    u.home = [c.x, c.y]; u.camp = c; u.wild = d; u.skillCd = 4; u.face = c.x > this.M.ww / 2 ? -1 : 1;
    c.u = u; G.FX.spawn(this, u);
  },
  // 中立怪 AI：被打才反擊；離開巢穴太遠就回家並回滿血
  wildAI(u, dt) {
    const home = u.home, dh = Math.hypot(u.x - home[0], u.y - home[1]), leash = u.kind === 'boss' ? 190 : 150;
    if (u.aggro && (!u.aggro.alive || dh > leash || Math.hypot(u.aggro.x - home[0], u.aggro.y - home[1]) > leash + 60)) { u.aggro = null; u.resetting = true; }
    if (u.resetting) {
      u.hp = Math.min(u.st.hp, u.hp + u.st.hp * 0.5 * dt);
      if (this.moveTo(u, home[0], home[1], dt) || dh < 6) { u.resetting = false; u.face = home[0] > this.M.ww / 2 ? -1 : 1; }
      return;
    }
    const t = u.aggro;
    if (!t) { if (dh > 8) this.moveTo(u, home[0], home[1], dt); else this.brake(u, dt); if (u.hp < u.st.hp) u.hp = Math.min(u.st.hp, u.hp + u.st.hp * 0.05 * dt); return; }
    u.target = t; u.skillCd = (u.skillCd ?? 3) - dt;
    const sid = u.kind === 'boss' && G.BOSS_SKILL[u.name];
    if (sid && u.skillCd <= 0) { const sd = G.ORIG.skills[sid]; if (this.dist(u, t) < sd.range) { u.skillCd = Math.max(4, sd.delay); this.beginCharge(u, sd, t, sd.lv1 || 1, G.TUNE.chgBoss); } }
    if (this.inRange(u, t)) { this.brake(u, dt); this.tryAttack(u, t); } else this.moveTo(u, t.x, t.y, dt);
  },
  // ----- 鑰匙：擊倒時依機率掉落，自動收進背包（飛向畫面上的鑰匙計數）-----
  tryKey(t, src) {
    if (this.attract || !src || src.side !== 0 || t.side === 0) return;
    const p = G.KEY_RATE[G.keyCat(t)] / (src.kind === 'hero' ? 1 : 2);
    if (Math.random() * 100 >= p) return;
    this.keysGot++; G.Team.addKeys(1);
    this.keyFx.push({ x: t.x, y: t.y, z: (t.static ? 40 : 20) + (t.vis.fly || 0), t: 0 });
    G.FX.ring(this, t.x, t.y, 4, 34, 0.5, 13, 2); G.FX.ring(this, t.x, t.y, 2, 22, 0.7, 9, 1);
    for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, sp = G.rr(40, 140); this.parts.add(t.x, t.y, 20, Math.cos(a) * sp, Math.sin(a) * sp * 0.6, G.rr(60, 160), G.rr(0.5, 1), i % 3 ? 13 : 9, 14, 1, 200, 1); }
    G.Audio.play('keyDrop', 1, 0);
  },
  // ----- 敵方獵手 -----
  spawnHunter() {
    const [x, y] = this.spawnPt[1], st = G.ORIG.stages[Math.min(99, this.stageNow || 1)] || G.ORIG.stages[1];
    const lv = G.clamp(st.start_level || 1, 3, G.TUNE.jungle.maxLv);
    const u = this.add(new G.Unit(this, 'hunter', 1, x, y, lv, 'jungler')); u.jHome = [x, y];
    this.jg.u = u; G.FX.spawn(this, u);
    this.say({ s: '敵方獵手出動了', ic: 'i_attack', col: 14, t: 2.4 });
  },
  junglerAI(u, dt) {
    u.retarget -= dt;
    if (u.retarget <= 0) {
      u.retarget = 0.4;
      let foe = null, fd = 1e9;
      if (u.lastHit && u.lastHit.alive && u.lastHit.side === 0 && Math.hypot(u.lastHit.x - u.x, u.lastHit.y - u.y) < 240) foe = u.lastHit;
      else for (const t of this.units) { if (!t.alive || t.side !== 0 || t.static || !this.seen(1, t)) continue; const d = Math.hypot(t.x - u.x, t.y - u.y); if (d < 120 && d < fd) { fd = d; foe = t; } }
      if (foe) u.target = foe;
      else {
        let best = null, bd = 1e9;
        for (const c of this.camps) {
          if (!c.u || !c.u.alive || (c.def.kind === 'wboss' && (u.level < G.TUNE.jungle.bossLv || this.time < G.TUNE.jungle.bossTime))) continue;
          if (c.u.aggro && c.u.aggro.alive && c.u.aggro.side === 0) continue;          // 我方正在打的不搶
          const d = Math.hypot(c.x - u.x, c.y - u.y); if (d < bd) { bd = d; best = c.u; }
        }
        u.target = best;
      }
    }
    const t = u.target;
    if (t && t.alive) {
      if (t.side === 2 && !(t.aggro && t.aggro.alive)) { t.aggro = u; t.resetting = false; }
      if (this.inRange(u, t)) { this.brake(u, dt); this.tryAttack(u, t); } else this.chase(u, t, dt);
      return;
    }
    const hm = u.jHome; if (Math.hypot(hm[0] - u.x, hm[1] - u.y) > 30) this.chase(u, { x: hm[0], y: hm[1] }, dt); else this.brake(u, dt);
  },
  hunterReward(u, t) {
    const d = t.wild, L = G.TUNE.jungle.maxLv;
    const lvUp = n => { const f = u.hp / u.st.hp; u.level = Math.min(L, u.level + n); u.calc(); u.hp = u.st.hp * f; G.FX.levelUp(this, u); };
    if (d.kind === 'wboss') {
      const b = this.add(new G.Unit(this, t.name, 1, t.x, t.y, d.lv, 'boss'));
      b.st.hp = Math.round(b.st.hp * 2); b.hp = b.st.hp; b.skillCd = 3;
      let bl = 1, bd = 1e9; for (let li = 0; li < this.nLanes; li++) { const v = this.M.laneDist(li, t.x / G.TILE, t.y / G.TILE); if (v < bd) { bd = v; bl = li; } }
      b.lane = bl; G.FX.spawn(this, b); this.say({ s: '敵方獵手收服了' + d.n, ic: d.ic, col: 10, t: 2.8 }); this.sfx('warn');
      return;
    }
    if (d.buff === 'red') this.addBuff(u, 'j_red', G.JBUFF.red.fx, 90, 'i_rage', 10);
    else if (d.buff === 'blue') { this.addBuff(u, 'j_blue', { arm: 3 }, 90, 'i_hold', 12); u.hp = u.st.hp; }
    else lvUp(1);
    const ours = G.d2(t.x, t.y, this.holy[0].x, this.holy[0].y) < G.d2(t.x, t.y, this.holy[1].x, this.holy[1].y);   // 只在偷我方野區時提醒
    if (ours) this.say({ s: '敵方獵手搶走了' + d.n, ic: d.ic, col: 10, t: 2.2 });
  },
  // ----- 視野 -----
  updateVision(dt) {
    const V = this.vis, VT = G.TUNE.vision; V.t -= dt; if (V.t > 0) return; V.t = VT.every;
    const M = this.M, cs = V.cs;
    // 視線：每 12 單位取樣，連續 3 個樣本在森林裡就算被擋住（細的樹邊不擋）
    const sight = (x0, y0, x1, y1) => { const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 12); let run = 0; for (let i = 1; i < n; i++) { const t = i / n; if (!M.isWalk(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) { if (++run >= 3) return false; } else run = 0; } return true; };
    for (let side = 0; side < 2; side++) {
      const v = V.v[side]; v.fill(0);
      for (const u of this.units) {
        if (!u.alive || u.side !== side) continue;
        const R = u.kind === 'holy' ? VT.holy : u.static ? VT.tower : u.kind === 'hero' ? VT.hero : u.kind === 'boss' ? VT.boss : u.kind === 'jungler' ? VT.jungler : VT.creep;
        const c0 = Math.max(0, ((u.x - R) / cs) | 0), c1 = Math.min(V.gw - 1, ((u.x + R) / cs) | 0), r0 = Math.max(0, ((u.y - R) / cs) | 0), r1 = Math.min(V.gh - 1, ((u.y + R) / cs) | 0);
        for (let gy = r0; gy <= r1; gy++) for (let gx = c0; gx <= c1; gx++) {
          const i = gy * V.gw + gx; if (v[i]) continue;
          const cx = (gx + 0.5) * cs, cy = (gy + 0.5) * cs; if (G.d2(cx, cy, u.x, u.y) > R * R) continue;
          if (u.static || sight(u.x, u.y, cx, cy)) v[i] = 1;
        }
      }
    }
  },
  // side 方看不看得到 t（建築永遠看得到；自己人永遠看得到）
  seen(side, t) {
    if (this.attract || side === 2 || !t || t.static || t.side === side) return true;
    const V = this.vis; if (!V) return true;
    return V.v[side][G.clamp((t.y / V.cs) | 0, 0, V.gh - 1) * V.gw + G.clamp((t.x / V.cs) | 0, 0, V.gw - 1)] === 1;
  },
  seenXY(side, x, y) { const V = this.vis; if (this.attract || !V) return true; return V.v[side][G.clamp((y / V.cs) | 0, 0, V.gh - 1) * V.gw + G.clamp((x / V.cs) | 0, 0, V.gw - 1)] === 1; },
  // ----- 友方塔傳送：點我方塔 → 引導 3 秒 → 英雄與跟隨的小兵一起傳過去；冷卻 30 秒 -----
  startTeleport(tw) {
    const h = this.hero, T = G.TUNE.tp; if (!h || !h.alive) return false;
    if (Math.hypot(tw.x - h.x, tw.y - h.y) < T.minDist) return false;              // 就在旁邊 → 當成一般移動
    if (this.tp.cd > 0) { if (G.UI) G.UI.toastMsg('傳送冷卻中 ' + Math.ceil(this.tp.cd) + ' 秒', 10); G.Audio.play('deny'); return true; }
    h.cmd = null; h.pending = null; h.path = null; h.target = null; this.mark = null;
    this.tp.ch = { t: T.channel, max: T.channel, to: tw };
    G.FX.ring(this, tw.x, tw.y, 40, 6, 0.5, 13, 2); G.Audio.play('open');
    return true;
  },
  cancelTeleport(msg) { if (!this.tp || !this.tp.ch) return; this.tp.ch = null; if (msg && G.UI) G.UI.toastMsg('傳送取消', 7); },
  updateTeleport(dt) {
    const tp = this.tp, h = this.hero; if (!tp) return;
    if (tp.cd > 0) tp.cd -= dt;
    const ch = tp.ch; if (!ch) return;
    if (!h || !h.alive || !ch.to.alive) { tp.ch = null; return; }
    ch.t -= dt;
    if (Math.random() < dt * 30) this.parts.add(h.x + G.rr(-10, 10), h.y + G.rr(-4, 4), 0, 0, 0, G.rr(40, 90), 0.6, 13, 9, 1, -10, 0);
    if (((ch.t * 2) | 0) !== ch.k) { ch.k = (ch.t * 2) | 0; G.FX.ring(this, ch.to.x, ch.to.y, 34, 8, 0.45, 13, 1); }
    if (ch.t > 0) return;
    tp.ch = null; tp.cd = G.TUNE.tp.cd;
    this.stats.tps++;
    const tw = ch.to, M = this.M, spot = (ox, oy) => { for (let r = 0; r < 60; r += 8) for (let a = 0; a < 6.28; a += 0.8) { const x = tw.x + ox + Math.cos(a) * r, y = tw.y + oy + Math.sin(a) * r * 0.7; if (M.isWalk(x, y)) return [x, y]; } return [tw.x, tw.y + 30]; };
    G.FX.ring(this, h.x, h.y, 4, 40, 0.5, 13, 2);
    const [hx, hy] = spot(0, 34); h.x = h.px = hx; h.y = h.py = hy; h.vx = h.vy = 0;
    for (const u of this.units) if (u.alive && u.follow) { const [x, y] = spot((u.fOff ? u.fOff[0] : 0), 34 + (u.fOff ? u.fOff[1] : 0)); G.FX.ring(this, u.x, u.y, 3, 20, 0.4, 13, 1); u.x = u.px = x; u.y = u.py = y; u.vx = u.vy = 0; u.path = null; G.FX.spawn(this, u); }
    G.FX.spawn(this, h); G.FX.ring(this, hx, hy, 4, 50, 0.6, 13, 2); this.sfx('level');
    const R = G.Render; if (R && !this.attract) { R.cam.x = hx; R.cam.y = hy; R.cam.follow = true; }
  },
  // 野怪被擊殺 → 獎勵
  wildReward(t, src) {
    const d = t.wild, h = this.hero, G0 = G.TUNE.gold;
    if (src && src.kind === 'jungler') return this.hunterReward(src, t);
    if (!src || src.side !== 0 || !h) return;
    if (d.kind === 'wboss') {
      this.addGold(G0.wild, t.x, t.y);
      // 轉生為我方首領：沿最近的路線推塔
      const ally = this.add(new G.Unit(this, t.name, 0, t.x, t.y, d.lv, 'boss'));
      ally.st.hp = Math.round(ally.st.hp * 2); ally.hp = ally.st.hp; ally.skillCd = 3; ally.allyBoss = true;
      let bl = 1, bd = 1e9; for (let li = 0; li < this.nLanes; li++) { const v = this.M.laneDist(li, t.x / G.TILE, t.y / G.TILE); if (v < bd) { bd = v; bl = li; } }
      ally.lane = bl; G.FX.spawn(this, ally); G.FX.levelUp(this, ally);
      this.stats.wboss++;
      G.FX.ring(this, t.x, t.y, 6, 80, 0.7, 13, 2); this.shake(0.5); this.sfx('level', t.x, t.y);
      this.say({ s: d.n + ' 加入我方', ic: d.ic, col: 13, t: 2.6 });
    } else {
      this.addGold(G0.camp, t.x, t.y);
      if (d.buff === 'exp') { this.gainExp(h, Math.round(this.expNeed(h) * 0.55)); this.say({ s: '經驗大幅提升', ic: 'i_book', col: 13, t: 2 }); }
      else { const b = G.JBUFF[d.buff]; this.addBuff(h, 'j_' + d.buff, b.fx, b.t, b.ic, b.col); this.say({ s: '獲得 ' + b.n, ic: b.ic, col: b.col, t: 2.2 }); G.FX.ring(this, h.x, h.y, 4, 40, 0.6, b.col, 2); }
      this.sfx('level', t.x, t.y);
    }
  },

  // ----- 金錢 -----
  addGold(n, x, y) {
    n = Math.round(n); if (n <= 0 || this.attract) return;
    this.gold += n; this.stats.gold += n;
    if (x != null) G.FX.popText(this, x, y, 30, '+' + n, 13);
  },
  killGold(t, src) {
    const h = this.hero, G0 = G.TUNE.gold; if (!h || t.side !== 1) return;
    if (t.static) { this.addGold(G0.tower, t.x, t.y); return; }
    if (t.kind === 'jungler') { if (src === h) this.addGold(G.TUNE.jungle.gold, t.x, t.y); else if (h.alive && G.d2(h.x, h.y, t.x, t.y) < 300 * 300) this.addGold(G.TUNE.jungle.gold / 2, t.x, t.y); return; }
    if (src === h) this.addGold(t.kind === 'boss' ? G0.boss : G0.last, t.x, t.y);
    else if (h.alive && G.d2(h.x, h.y, t.x, t.y) < 300 * 300) this.addGold(G0.near);
  },
  buy(id) {
    const it = G.SHOP_BY[id]; if (!it || this.gold < it.cost) return 'gold';
    const slot = this.bag.find(b => b.id === id);
    if (!slot && this.bag.length >= G.TUNE.bagMax) return 'full';
    this.gold -= it.cost;
    if (slot) slot.n++; else this.bag.push({ id, n: 1 });
    G.Audio.play('coin'); return 'ok';
  },
  useItem(id) {
    const h = this.hero, slot = this.bag.find(b => b.id === id), it = G.SHOP_BY[id];
    if (!h || !h.alive || !slot || !it) return false;
    if (it.k === 'rev') return 'rev';                    // 復活藥水：陣亡時自動使用
    if (it.k === 'hp') { if (h.hp >= h.st.hp) return false; h.hot = { k: 'hp', left: it.v, rate: it.v / 0.6 }; }   // v2.4 0.6 秒內補滿（看得到血條往上長）
    else if (it.k === 'mp') { if (h.mp >= h.st.mp) return false; h.hot = { k: 'mp', left: it.v, rate: it.v / 0.6 }; }
    else if (it.k === 'inv') { if (h.inv > 0) return false; h.inv = it.t; h.stun = 0; h.slow = 0; this.addBuff(h, 'i_' + id, {}, it.t, it.ic, null); }
    else this.addBuff(h, 'i_' + id, { [it.k]: it.v }, it.t, it.ic, null);
    if (--slot.n <= 0) this.bag.splice(this.bag.indexOf(slot), 1);
    G.VFX.potion(this, h, it);
    this.stats.potions++; return true;
  },

  // 復活藥水（v2.4）：英雄陣亡瞬間自動使用 → 原地復活、回復 50% HP/MP、無敵 1.5 秒
  tryRevive(h) {
    const slot = this.bag.find(b => b.id === 'rev'); if (!slot || this.over || this.attract) return false;
    if (--slot.n <= 0) this.bag.splice(this.bag.indexOf(slot), 1);
    const it = G.SHOP_BY.rev; h.alive = true; h.hp = Math.round(h.st.hp * it.v / 100); h.mp = Math.max(h.mp, Math.round(h.st.mp * it.v / 100)); h.inv = 1.5; h.stun = 0; h.slow = 0; h.poison = null;
    G.VFX.potion(this, h, it); this.say({ s: '復活藥水生效！', ic: 'p_rev', col: 19, t: 2.2 }); this.stats.potions++;
    return true;
  },
  // ----- 計時增益（藥水、野怪 buff）-----
  // fx：pow(%) del(攻速%) crit(%) arm(+) spd(移速%) mpReg(+/秒) cdr(冷卻%)
  addBuff(u, key, fx, t, ic, col) {
    u.tb = u.tb || {};
    u.tb[key] = { fx, t, max: t, ic, col };
    this.applyBuffs(u);
  },
  applyBuffs(u) {
    const a = { pow: 0, del: 0, crit: 0, arm: 0, spd: 0, mpReg: 0, cdr: 0, xp: 0, wave: 0 };
    for (const k in u.tb || {}) for (const f in u.tb[k].fx) a[f] += u.tb[k].fx[f];
    u.iPow = 1 + a.pow / 100; u.iDel = 1 / (1 + a.del / 100); u.iCrit = a.crit; u.iArm = a.arm; u.iSpd = 1 + a.spd / 100; u.iMp = a.mpReg; u.iCdr = a.cdr; u.iXp = a.xp; u.iWave = a.wave;
  },
  tickBuffs(u, dt) {
    let ch = false;
    for (const k in u.tb) { u.tb[k].t -= dt; if (u.tb[k].t <= 0) { delete u.tb[k]; ch = true; } }
    if (ch) this.applyBuffs(u);
  },

  // ----- 技能升級 -----
  canLevel(s) {
    const h = this.hero; if (!h || !s || s.lv >= G.SKILL_MAX || (h.sp || 0) <= 0) return false;
    return h.level >= G.skillReq(s.s, s.lv + 1);
  },
  levelSkill(s, quiet) {
    const h = this.hero; if (!this.canLevel(s)) return false;
    h.sp--; s.lv++;
    if (s.passive) { const hp = h.hp / h.st.hp, mp = h.mp / h.st.mp; h.calc(); h.hp = h.st.hp * hp; h.mp = h.st.mp * mp; }
    else { const v = G.skillVal(s.s, s.lv); s.cdMax = v.cd; }
    if (!quiet) this.skillNotice(s);
    if (!quiet) { this.sfx('level'); G.FX.ring(this, h.x, h.y, 3, 22, 0.35, 13); for (let k = 0; k < 10; k++) this.parts.add(h.x + G.rr(-8, 8), h.y, G.rr(4, 20), 0, 0, G.rr(40, 80), 0.6, 13, 9, 1, -10, 0); }
    return true;
  },
  // 升級回饋：廣播這一級多了什麼（例：火球 Lv2　傷害 100→140）
  skillNotice(s) {
    const nm = (G.TXT.skill || {})[s.id] || '', r = G.skillRows(s.s)[0], R = G.Render;
    let msg = '學會 ' + nm;
    if (s.lv >= 2 && r) {
      const unit = r.f(s.lv).slice(String(r.g(s.lv)).length), ch = r.k + ' ' + r.g(s.lv - 1) + '→' + r.g(s.lv) + unit;
      const maxW = (R && R.uw ? R.uw - (R.ins ? R.ins.l + R.ins.r : 0) : 320) - 30, fit = t => !G.cnW || G.cnW(t) <= maxW, val = r.g(s.lv - 1) + '→' + r.g(s.lv) + unit;
      // 放得下就完整顯示；窄螢幕依序省略：標籤 → 等級 → 技能名（左邊有技能圖示可認）
      msg = [nm + ' Lv' + s.lv + ' ' + ch, nm + ' Lv' + s.lv + ' ' + val, nm + ' ' + val, ch].find(fit) || val;
    }
    this.say({ s: msg, ic: s.icon, col: s.passive ? 17 : 13, t: 2.4 });
  },
  // 自動配點（鍵盤 U 或示範）：大招 > 主動 > 被動
  autoLevel() {
    const h = this.hero; if (!h) return false;
    const order = [h.skills[h.skills.length - 1], ...h.skills.slice(0, -1), ...h.pskills].filter(Boolean).sort((a, b) => a.lv - b.lv);
    for (const s of order) if (this.canLevel(s)) return this.levelSkill(s);
    return false;
  }
});

// ---------- 技能數值表（戰鬥資訊卡與隊伍頁共用）----------
// 回傳 [{k: 標籤, f: lv => 顯示字串}]
G.skillRows = function (sd) {
  const rows = [], V = lv => G.skillVal(sd, lv), w = G.WEAPONS_BY_ID[sd.weapon_id] || {};
  // u：單位（表格放不下時可移到標籤上，例如「冷卻(秒)」）；g：不含單位的數值
  const add = (k, g, u = '', ul = u) => rows.push({ k, u: ul, g, f: lv => String(g(lv)) + u });
  if (!sd.active) {
    const v = lv => V(lv).v1;
    const P = {
      hp_sec: ['HP 回復', lv => '+' + v(lv), '/秒', '每秒'], mp_sec: ['MP 回復', lv => '+' + (v(lv) / 10), '/秒', '每秒'],
      delay: ['攻擊間隔', lv => v(lv), 'ms'], speed: ['跑速', lv => '+' + v(lv)], critical: ['爆擊率', lv => '+' + v(lv), '%'],
      range: ['射程', lv => '+' + v(lv)], return: ['吸血', lv => v(lv), '%'], mp_discount: ['MP 消耗', lv => '−' + v(lv), '%'],
      power: [sd.type === 'multi_buff' ? '攻擊（含周圍友軍）' : '攻擊力', lv => '+' + v(lv)], armor: [sd.type === 'multi_buff' ? '防禦（含周圍友軍）' : '防禦', lv => '+' + v(lv)]
    }[sd.attribute];
    if (P) add(P[0], P[1], P[2] || '', P[3] || P[2] || '');
    return rows;
  }
  if (sd.type === 'buff') {
    if (sd.attribute === 'armor_per') add('減傷', lv => V(lv).v1, '%');
    else if (sd.attribute === 'berserker' || sd.attribute === 'berserker2') { add('攻擊', lv => '×' + G.rageOf(lv).pow); if (sd.attribute === 'berserker2') add('攻速', lv => '+' + G.rageOf(lv).spd + '%'); add('防禦', lv => '×' + G.rageOf(lv).arm); }
    else if (sd.attribute === 'weapon') add('放電傷害', lv => V(lv).v1);
    add('持續', lv => V(lv).v2, '秒');
  } else {
    add('傷害', lv => V(lv).v1);
    const v2 = lv => V(lv).v2;
    if (w.type === '2d_drop') add('範圍', lv => v2(lv) || 60);
    else if (w.type === 'line') add('連擊', lv => Math.max(1, v2(lv)), '次');
    else if (w.type === 'effect' && w.attack_type === 'round' && w.attribute === 'stun') add('暈眩', lv => Math.max(0.6, v2(lv)), '秒');
    else if (w.type === 'effect' && w.attack_type === 'splash') add('範圍', lv => v2(lv) || 50);
    else if (w.attack_type === 'jump') add('彈跳', lv => Math.max(1, v2(lv)), '次');
    else if (w.attribute === 'slow' && sd.value_2) add('減速', lv => v2(lv), '秒');
    else if (w.attack_type === 'splash' && sd.value_2) add('範圍', lv => v2(lv));
  }
  add('冷卻', lv => V(lv).cd, '秒');
  add('MP', lv => V(lv).mp);
  return rows;
};

'use strict';

G.Render = (() => {
  const R = {
    cam: { x: 0, y: 0, zoom: 1, follow: true, vx: 0, vy: 0 },

  let cv, ctx, buf, bctx, ui, uctx, vign;

  R.init = function (canvas) {

    if (!touch0) { const k = Math.floor(cs * R.dpr); if (k >= 2) { kInt = k; cs = k / R.dpr; } }
    const cw = kInt ? LW * cs : Math.floor(LW * cs), ch = kInt ? LH * cs : Math.floor(LH * cs);
    R.cssX = Math.floor((W0 - cw) / 2); R.cssY = Math.floor((H0 - ch) / 2);
    cv.style.position = 'fixed'; cv.style.left = R.cssX + 'px'; cv.style.top = R.cssY + 'px'; cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    R.sw = kInt ? LW * kInt : Math.round(cw * R.dpr); R.sh = kInt ? LH * kInt : Math.round(ch * R.dpr);
    cv.width = R.sw; cv.height = R.sh;
    R.uw = LW; R.uh = LH; R.uiS = R.sw / LW;
    R.base = port ? R.uiS * 0.9 : R.uiS;
    // 安全邊距（UI px，固定值）：直屏避開圓角/底部手勢列，橫屏避開瀏海；系統安全區超出黑邊時再加大
    const touch = matchMedia('(pointer: coarse)').matches, cssPerUi = cs;

    const ex = (v, gap) => Math.ceil(Math.max(0, v - gap) / cssPerUi), gx = R.cssX, gy = R.cssY;
    const base = port ? { l: 5, r: 5, t: 5, b: touch ? 15 : 5 } : { l: touch ? 13 : 2, r: touch ? 13 : 2, t: touch ? 3 : 2, b: touch ? 6 : 2 };
    R.ins = { l: Math.max(base.l, ex(si.l, gx)), r: Math.max(base.r, ex(si.r, gx)), t: Math.max(base.t, ex(si.t, gy)), b: Math.max(base.b, ex(si.b, gy)) };
    ui.width = R.uw; ui.height = R.uh;
    // 暗角
    vign = G.canvas(R.sw, R.sh); const v = vign.getContext('2d');
    const g = v.createRadialGradient(R.sw / 2, R.sh / 2, Math.min(R.sw, R.sh) * 0.35, R.sw / 2, R.sh / 2, Math.hypot(R.sw, R.sh) * 0.6);

  R.zoomMin = () => { const W = G.W; if (!W || !W.M) return 0.6; const fit = Math.min(R.sw / (W.M.ww * G.AX), R.sh / (W.M.wh * G.AY)) / R.base; return Math.min(0.6, fit * 0.98); };
  R.setZoom = z => { R.cam.zoom = G.clamp(z, R.zoomMin(), 2.0); };

  // 鏡頭
  R.updateCam = function (W, dt) {
    const c = R.cam, h = W.hero;
    let tx = c.x, ty = c.y;
    if (W.attract) { const t = W.time * 0.05; tx = W.M.ww * (0.5 + Math.sin(t) * 0.28); ty = W.M.wh * (0.5 - Math.sin(t) * 0.22); }
    else if (c.follow) {
      if (h && h.alive) { tx = h.x + h.vx * 0.35; ty = h.y + h.vy * 0.35; }
      else if (W.over) { const t = W.holy[W.over.win ? 1 : 0]; tx = t.x; ty = t.y; }

    else if (c.vx || c.vy) { c.x += c.vx * dt * 0.5; c.y += c.vy * dt * 0.5; const d = Math.exp(-dt * 9); c.vx *= d; c.vy *= d; if (Math.abs(c.vx) + Math.abs(c.vy) < 2) c.vx = c.vy = 0; }
    const sc = R.base * c.zoom, hw = R.sw / sc / 2 / G.AX, hh = R.sh / sc / 2 / G.AY;
    const px = W.ground.pad / G.AX - 20, py = W.ground.pad / G.AY - 20;   // 地圖外圍森林邊界
    c.x = G.clamp(c.x, Math.min(hw - px, W.M.ww / 2), Math.max(W.M.ww - hw + px, W.M.ww / 2));
    c.y = G.clamp(c.y, Math.min(hh - py, W.M.wh / 2), Math.max(W.M.wh - hh + py, W.M.wh / 2));

  // 直線範圍（穿透技）：從 (x0,y0) 往 (x1,y1) 方向、長 len、寬 w 的長方形
  G.drawLineZone = (b, ox, oy, x0, y0, x1, y1, len, w, col, a, rt) => {
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, ux = dx / l, uy = dy / l, nx = -uy * w, ny = ux * w;
    const P2 = [[x0 + nx, y0 + ny], [x0 + ux * len + nx, y0 + uy * len + ny], [x0 + ux * len - nx, y0 + uy * len - ny], [x0 - nx, y0 - ny]].map(([x, y]) => [x * G.AX - ox, y * G.AY - oy]);
    b.globalAlpha = a; b.fillStyle = G.PAL[col]; b.beginPath(); P2.forEach(([x, y], i) => i ? b.lineTo(x, y) : b.moveTo(x, y)); b.closePath(); b.fill(); b.globalAlpha = 1;
    b.fillStyle = G.PAL[col]; for (let i = 0; i < 4; i++) G.pxLine(b, P2[i][0], P2[i][1], P2[(i + 1) % 4][0], P2[(i + 1) % 4][1], 1);
  };
  R.screenToWorld = (sx, sy) => {
    const ax = R.ox + R.fx + sx / R.scale, ay = R.oy + R.fy + sy / R.scale;
    return [ax / G.AX, ay / G.AY];
  };
  R.worldToScreen = (x, y, z = 0) => [((x * G.AX - R.ox - R.fx) * R.scale), ((y * G.AY - z * G.AZ - R.oy - R.fy) * R.scale)];

  // 單位在美術座標的外框（點選用）
  R.unitBox = (u) => {
    const s = u.spr[0], ax = u.x * G.AX - R.ox, ay = u.y * G.AY - u.z * G.AZ - R.oy;
    return [ax - s.w / 2, ay - s.h, s.w, s.h];
  };

  const sprOf = (k) => { const s = G.SPR[k]; return Array.isArray(s) ? s[0] : s; };

  R.draw = function (W, alpha, rt) {
    R.dtF = Math.min(0.1, Math.max(0, rt - (R._lrt || rt))); R._lrt = rt;
    const sc = R.scale = R.base * R.cam.zoom;
    const bw = Math.ceil(R.sw / sc) + 2, bh = Math.ceil(R.sh / sc) + 2;
    if (buf.width !== bw || buf.height !== bh) { buf.width = bw; buf.height = bh; }
    const b = bctx; b.imageSmoothingEnabled = false;
    // 鏡頭 + 震動
    const tr = W.trauma * W.trauma, sh = tr * 7;
    const shx = (G.vnoise(rt * 25, 3.1) - 0.5) * 2 * sh, shy = (G.vnoise(5.7, rt * 25) - 0.5) * 2 * sh;
    const left = R.cam.x * G.AX - R.sw / sc / 2 + shx, top = R.cam.y * G.AY - R.sh / sc / 2 + shy;
    const ox = Math.floor(left), oy = Math.floor(top);
    R.ox = ox; R.oy = oy; R.fx = left - ox; R.fy = top - oy;
    const o = { x: ox, y: oy };
    G.setPatOffset(ox, oy);
    // 背景 + 地面
    b.fillStyle = G.PAL[1]; b.fillRect(0, 0, bw, bh);
    const gd = W.ground;
    let sx = ox + gd.pad, sy = oy + gd.pad, dx = 0, dy = 0, w = bw, h = bh;
    if (sx < 0) { dx = -sx; w += sx; sx = 0; } if (sy < 0) { dy = -sy; h += sy; sy = 0; }
    if (sx + w > gd.w) w = gd.w - sx; if (sy + h > gd.h) h = gd.h - sy;

    // 焦痕

    // 地面特效
    for (const e of W.effects) if (e.layer === 0 && e.draw) e.draw(b, o);
    W.parts.draw(b, ox, oy, W.frame, true);
    // 野怪巢穴：空巢時顯示重生倒數
    const campTxt = [];
    for (const cp of W.camps || []) {
      if (cp.u) continue;
      const gx = cp.x * G.AX - ox, gy = cp.y * G.AY - oy; if (gx < -40 || gy < -40 || gx > bw + 40 || gy > bh + 40) continue;
      const big = cp.def.kind === 'wboss', r = big ? 16 : 10;
      G.pxEllipse(b, gx, gy, r, r * 0.5, 3, 4, rt * 2);

    }
    // 移動落點：地面脈衝圈 + 落下彈跳的箭頭

      const pr = (t * 2.2) % 1;
      G.pxEllipse(b, gx, gy, 9 * G.AX * 2 * (1 - pr) + 2, 9 * G.AY * 2 * (1 - pr) + 1, pr > 0.6 ? 15 : 13);
      G.pxDisc(b, gx, gy, 6, 2.5, 13, 0.3 * fade);
      G.pxEllipse(b, gx, gy, 7, 3, 13);
      b.fillStyle = G.PAL[13]; b.fillRect(Math.round(gx), Math.round(gy), 1, 1);
      const drop = t < 0.18 ? (1 - t / 0.18) * 26 : 0, bounce = t < 0.18 ? 0 : Math.abs(Math.sin((t - 0.18) * 7)) * 3;
      mk.ax = Math.round(gx); mk.ay = Math.round(gy - 8 - drop - bounce); mk.fade = fade;
    }
    // v2.4 敵塔攻擊範圍：英雄靠近時淡入（淡粉紅填滿）；被鎖定時變紅、呼吸
    const h0 = W.hero, P0 = G.PAL;
    const zone = (x, y, r, col, fa, oa, dash) => {           // 地面範圍：半透明填滿＋外框（世界座標、半徑）
      const gx = x * G.AX - ox, gy = y * G.AY - oy;
      if (fa > 0) { b.globalAlpha = fa; b.fillStyle = P0[col]; b.beginPath(); b.ellipse(Math.round(gx), Math.round(gy), r * G.AX, r * G.AY, 0, 0, 6.2832); b.fill(); b.globalAlpha = 1; }
      if (oa > 0) { b.globalAlpha = oa; G.pxEllipse(b, gx, gy, r * G.AX, r * G.AY, col, dash || 0, rt * 6); b.globalAlpha = 1; }
    };
    if (h0 && h0.alive && !W.attract) for (const t of W.units) {

      const reach = t.st.range + t.r * 0.4 + h0.r, d = Math.hypot(h0.x - t.x, h0.y - t.y), lk = t.target === h0;
      t.zoneA = G.clamp((t.zoneA || 0) + (d < reach + 50 ? 3 : -3) * R.dtF, 0, 1);
      if (t.zoneA > 0.01) { const pu = lk ? 0.5 + 0.5 * Math.sin(rt * 9) : 0; zone(t.x, t.y, reach, lk ? 10 : 19, t.zoneA * (lk ? 0.13 + 0.07 * pu : 0.12), t.zoneA * (lk ? 0.9 : 0.55), lk ? 0 : 4); }
    }

    for (const u of W.units) {
      const c0 = u.chg; if (!c0 || !u.alive || !W.seen(0, u)) continue;
      const sp = G.skillShape(c0.sd), col = u.side === 0 ? 13 : 10, k = Math.min(1, c0.T / c0.dur), a = 0.1 + 0.12 * k;
      if (sp.k === 'self' || (sp.k === 'buff' && sp.r)) zone(u.x, u.y, sp.r, col, a, 0.9);

      else if (sp.k === 'unit' && c0.t && c0.t.alive !== false) zone(c0.t.x, c0.t.y, (c0.t.r || 8) + 6, col, 0, 0.9, 3);
    }
    // 技能瞄準（拖曳技能鈕／按住快捷鍵）：施放距離＋落點範圍
    const AM = G.UI.aim;
    if (h0 && h0.alive && AM && (AM.on || (AM.pre && !(G.UI.hold && G.UI.hold.fired))) && !W.attract) {   // 按著技能鈕（還沒拖）也先顯示範圍
      const sp = AM.s.shape, col = AM.cancel ? 10 : 13;
      if (sp.cast) zone(h0.x, h0.y, sp.cast, col, 0.06, 0.8, 4);
      if (sp.k === 'self' || sp.k === 'buff') zone(h0.x, h0.y, sp.r, col, 0.16, 1);
      else if (!AM.on) { }

G.Ach = (() => {
  const A = {};
  const ADD = ['kills', 'deaths', 'assists', 'camps', 'towers', 'gold', 'time', 'bosses', 'hunters', 'wboss', 'potions'];
  const BEST = ['streak', 'towers', 'gold', 'assists', 'level', 'wboss', 'follow', 'potions', 'bag'];
  A.recent = [];                                     // 本場新達成（結算畫面用）
  A.banner = null;                                   // 選單畫面的成就通知
  // 檔案：缺的欄位自動補上（舊存檔相容）
  A.P = () => {
    const v = G.Team.get();
    if (!v.p) v.p = {};
    const p = v.p;
    for (const k of [...ADD, 'games', 'wins', 'chests', 'gamble5', 'codes', 'night']) if (typeof p[k] !== 'number') p[k] = 0;
    for (const k of ['guide', 'book', 'demo']) if (!Array.isArray(p[k])) p[k] = [];
    if (!p.best) p.best = {}; for (const k of BEST) if (typeof p.best[k] !== 'number') p.best[k] = 0;
    if (!v.ach) v.ach = {};
    return p;
  };
  A.off = () => G.Team.dev;
  A.goal = a => typeof a.g === 'function' ? a.g() : a.g;
  A.state = id => (G.Team.get().ach || {})[id] || 0;          // 0 未達成、1 達成未領取、2 已領取
  A.doneCount = except => G.ACH.filter(a => a.id !== except && A.state(a.id) > 0).length;
  A.unclaimed = () => G.ACH.filter(a => A.state(a.id) === 1).length;
  A.value = (a, M) => { const P = A.P(); return a.v(P, P.best, M) || 0; };
  A.guideTotal = () => (G.Menus && G.Menus.guidePageCount ? G.Menus.guidePageCount() : 50);
  A.bookTotal = () => new Set([...G.ROSTER.bosses, ...G.ROSTER.smalls, ...G.ROSTER.towers, ...Object.keys(G.WILD).map(k => G.WILD[k].unit), ...G.ROSTER.hunters]).size;
  // 檢查所有未達成的成就（M＝本場打完的情境）
  A.check = (M, W) => {
    if (A.off()) return;
    const v = G.Team.get(); A.P(); let any = false;
    for (let pass = 0; pass < 2; pass++)            // 第二輪：讓「完成 15 個成就」能在同一次檢查中達成
      for (const a of G.ACH) {
        if (v.ach[a.id]) continue;
        if (A.value(a, M) >= A.goal(a)) { v.ach[a.id] = 1; any = true; A.recent.push(a.id); A.notify(a, W); if (G.SaveUI) G.SaveUI.bump(); }
      }
    if (any) G.Team.save();
  };
  A.notify = (a, W) => {
    G.Audio.play('level');
    if (W && !W.attract && G.UI.screen === 'battle') W.say({ s: '成就達成：' + a.n, ic: 'i_trophy', col: 13, t: 2.8 });
    else if (G.Ach.queueBanner) G.Ach.queueBanner({ a, t: 0 }); else A.banner = { a, t: 0 };
  };
  A.claim = id => {
    const v = G.Team.get(); if (v.ach[id] !== 1) return 0;
    const k = G.ACH_TIER[G.ACH_BY[id].t].k; v.ach[id] = 2; G.Team.addKeys(k); G.Team.save(); return k;
  };
  // 其他畫面的事件：開寶箱、看教學、看圖鑑、技能展示、產生存檔碼
  A.on = (ev, x) => {
    if (A.off()) return;
    const P = A.P();
    if (ev === 'chest') { P.chests++; if (x && x.keys === 5) P.gamble5++; }
    else if (ev === 'guide' || ev === 'book' || ev === 'demo') { if (P[ev].includes(x)) return; P[ev].push(x); }
    else if (ev === 'code') { P.codes++; const v = G.Team.get(); v.bk = { n: 0, t: Date.now() }; }
    G.Team.save(); A.check(null, null);
  };
  // ----- 戰鬥中 -----
  A.begin = W => { W._cm = {}; for (const k of ADD) W._cm[k] = 0; W._achT = 0; A.recent = []; };
  A.commit = W => {
    if (A.off() || !W || W.attract || !W._cm) return;
    const P = A.P(), st = W.stats;
    for (const k of ADD) { const d = (st[k] || 0) - W._cm[k]; if (d) { P[k] += d; W._cm[k] = st[k] || 0; } }
    const live = { streak: st.streak, towers: st.towers, gold: st.gold, assists: st.assists, level: W.hero ? W.hero.level : 0, wboss: st.wboss, follow: st.maxFollow, potions: st.potions, bag: W.bag.length };
    for (const k of BEST) P.best[k] = Math.max(P.best[k], live[k] || 0);
    G.Team.save();
  };
  A.tick = (W, dt) => {
    if (A.off() || W.attract || !W.hero || W._fin) return;
    const ho = W.holy[0]; if (ho && ho.st) W.stats.minHoly = Math.min(W.stats.minHoly, Math.max(0, ho.hp / ho.st.hp));
    W._achT += dt; if (W._achT < 2) return; W._achT = 0;
    A.commit(W); A.check(null, W);
  };
  A.final = W => {
    if (W._fin || W.attract) return; W._fin = true;
    if (A.off()) return;
    A.commit(W);
    const P = A.P(), win = !!W.over.win; P.games++; if (win) P.wins++;
    const hr = new Date().getHours(); if (hr < 5) P.night++;
    G.Team.save();
    A.check({ win, st: W.stats, pts: W.loadPts }, W);
  };
  return A;
})();
